[profile.ci]
fail-fast = false

[profile.ci.junit]
path = "junit.xml"

# These cases repeatedly launch the path-classifier interpreter. On Windows,
# overlapping them with live gateway startup exhausted the readiness budget.
# Reserve this runner's test slots while each classifier case executes.
[[profile.ci.overrides]]
platform = 'cfg(windows)'
filter = 'binary(=ci_changed_paths)'
threads-required = 'num-test-threads'

# Git provider cases spawn several Git processes per test. On busy Windows
# runners, unrelated subprocess tests can exhaust the product's 10s deadline.
# Isolate their scheduling instead of changing the runtime timeout contract.
[[profile.ci.overrides]]
platform = 'cfg(windows)'
filter = 'package(labby-codemode) & test(git::provider::tests::)'
threads-required = 'num-test-threads'

# Shared lifecycle harness tests are compiled into several integration binaries.
# Windows CI observed four concurrent instances exhausting their unchanged 45s
# readiness deadline during database initialization; later instances finished in
# 2-7s. Reserve slots for these cases to avoid competing daemon startups. Their
# own multi-process scenarios still run concurrently inside the test.
[[profile.ci.overrides]]
platform = 'cfg(windows)'
filter = 'package(labby) & test(live_labby::tests::)'
threads-required = 'num-test-threads'
