tracing.workspace = true
percent-encoding.workspace = true
tempfile.workspace = true
sha2.workspace = true
jiff.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = [
  "test-util",
  "macros",
  "rt-multi-thread",
] }
wiremock.workspace = true
tracing-subscriber.workspace = true

[features]
all = []
default = []
