image:
  distribution: ubuntu
  release: resolute
  architecture: amd64
  variant: default
  name: labby-incus
  description: Labby gateway Incus image {{ image.release }} {{ image.architecture }} ({{ image.serial }})
  serial: local

source:
  downloader: debootstrap
  same_as: gutsy
  # LABBY_SUPPLY: ubuntu_snapshot
  url: https://snapshot.ubuntu.com/ubuntu/20260904T000000Z/

packages:
  manager: apt
  update: true
  cleanup: true
  # Source of truth for the Labby gateway apt floor. `labby setup --provision`
  # derives its bare-metal package install/verification list from this install set.
  # android-sdk is intentionally NOT in this list — it pulls ~300 MiB of JVM +
  # java deps that only the claude-in-mobile MCP server needs. It installs via
  # the LABBY_PROVISION_ACTION: android-sdk block when LABBY_ENABLE_ANDROID_SDK=1.
  repositories:
    - name: ubuntu
      url: |-
        deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/20260904T000000Z {{ image.release }} main restricted universe multiverse
        deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/20260904T000000Z {{ image.release }}-updates main restricted universe multiverse
        deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/20260904T000000Z {{ image.release }}-security main restricted universe multiverse
  sets:
    - action: install
      packages:
        - git
        - openssh-client
        - gh
        - ca-certificates
        - curl
        - jq
        - ripgrep
        - lsof
        - rsync
        - xz-utils
        - python3
        - zsh
        - ffmpeg

actions:
  - trigger: post-packages
    action: |-
      #!/usr/bin/env bash
      set -euo pipefail
      # LABBY_IMAGE_ACTION: incus-network
      install -d -m 0755 /etc/netplan
      cat > /etc/netplan/10-lxc.yaml <<'EOF'
      network:
        version: 2
        ethernets:
          eth0:
            dhcp4: true
            dhcp-identifier: mac
      EOF
      chmod 0600 /etc/netplan/10-lxc.yaml
      mkdir -p /etc/systemd/system/multi-user.target.wants
      ln -sfn /usr/lib/systemd/system/systemd-networkd.service \
        /etc/systemd/system/multi-user.target.wants/systemd-networkd.service
      ln -sfn /usr/lib/systemd/system/systemd-resolved.service \
        /etc/systemd/system/multi-user.target.wants/systemd-resolved.service

  - trigger: post-packages
    action: |-
      #!/usr/bin/env bash
      set -euo pipefail
      # LABBY_PROVISION_ACTION: labby-user
      if ! id -u labby >/dev/null 2>&1; then
        useradd --create-home --shell /usr/bin/zsh labby
      fi
      mkdir -p \
        /home/labby/.labby \
        /home/labby/.local/bin \
        /home/labby/.local/opt \
        /home/labby/.cache \
        /home/labby/.config \
        /home/labby/.npm \
        /home/labby/.codex \
        /home/labby/.claude \
        /home/labby/.gemini \
        /home/labby/downloads
      profile=/home/labby/.zprofile
      touch "$profile"
      if ! grep -q "LABBY managed PATH" "$profile"; then
        cat >> "$profile" <<'EOF'

      # LABBY managed PATH
      export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/usr/local/go/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
      EOF
      fi
      chown -R labby:labby /home/labby

  - trigger: post-packages
    action: |-
      #!/usr/bin/env bash
      set -euo pipefail
      # LABBY_PROVISION_ACTION: node
      # LABBY_SUPPLY: node
      runuser -u labby -- env HOME=/home/labby USER=labby LOGNAME=labby XDG_CONFIG_HOME=/home/labby/.config XDG_CACHE_HOME=/home/labby/.cache XDG_DATA_HOME=/home/labby/.local/share sh -lc '
      set -eu
      case "$(uname -m)" in
        x86_64|amd64) ;;
        *) echo "unsupported Node static tarball architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      mkdir -p "$HOME/.local/bin" "$HOME/.local/opt"
      version="24.13.0"
      digest="e798599612f4bb71333a3397ab0d095fd62214e115aea45aa858a145fc72d67e"
      base="https://nodejs.org/dist/v${version}"
      tmp="$(mktemp -d)"
      trap '\''rm -rf "$tmp"'\'' EXIT
      asset="node-v${version}-linux-x64.tar.xz"
      curl -fsSL --connect-timeout 10 --max-time 300 -o "$tmp/$asset" "$base/$asset"
      echo "$digest  $tmp/$asset" | sha256sum --check --strict
      tar -xJf "$tmp/$asset" -C "$HOME/.local/opt"
      dir="$HOME/.local/opt/${asset%.tar.xz}"
      ln -sfn "$dir" "$HOME/.local/opt/node"
      ln -sfn "$dir/bin/node" "$HOME/.local/bin/node"
      ln -sfn "$dir/bin/npm" "$HOME/.local/bin/npm"
      ln -sfn "$dir/bin/npx" "$HOME/.local/bin/npx"
      '

  - trigger: post-packages
    action: |-
      #!/usr/bin/env bash
      set -euo pipefail
      # LABBY_PROVISION_ACTION: uv-python
      # LABBY_SUPPLY: uv
      runuser -u labby -- env HOME=/home/labby USER=labby LOGNAME=labby XDG_CONFIG_HOME=/home/labby/.config XDG_CACHE_HOME=/home/labby/.cache XDG_DATA_HOME=/home/labby/.local/share sh -lc '
      set -eu
      # uv discovers config by walking up from the CWD; the provision runs from
      # root'\''s home, so uv would try to read /root/uv.toml (unreadable by labby).
      # Pin the CWD to the labby home and disable ambient uv config discovery.
      cd "$HOME"
      export UV_NO_CONFIG=1
      mkdir -p "$HOME/.local/bin"
      tmp="$(mktemp -d)"
      trap '\''rm -rf "$tmp"'\'' EXIT
      asset="$tmp/uv.tar.gz"
      curl -fsSL --connect-timeout 10 --max-time 300 -o "$asset" https://github.com/astral-sh/uv/releases/download/0.11.10/uv-x86_64-unknown-linux-gnu.tar.gz
      echo "077e1a0777bcf516e02f4ef245e269c8d1baa780438e4c50e09c5c997f85538a  $asset" | sha256sum --check --strict
      tar -xzf "$asset" -C "$tmp"
      install -m 0755 "$tmp/uv-x86_64-unknown-linux-gnu/uv" "$HOME/.local/bin/uv"
      install -m 0755 "$tmp/uv-x86_64-unknown-linux-gnu/uvx" "$HOME/.local/bin/uvx"
      # Python comes from the immutable Ubuntu snapshot above; uv must not fetch
      # a second, independently mutable managed-Python artifact.
      ln -sfn /usr/bin/python3 "$HOME/.local/bin/python"
      ln -sfn /usr/bin/python3 "$HOME/.local/bin/python3"
      '

  - trigger: post-packages
    action: |-
      #!/usr/bin/env bash
      set -euo pipefail
      # LABBY_PROVISION_ACTION: rust-go
      # LABBY_SUPPLY: rustup
      runuser -u labby -- env HOME=/home/labby USER=labby LOGNAME=labby XDG_CONFIG_HOME=/home/labby/.config XDG_CACHE_HOME=/home/labby/.cache XDG_DATA_HOME=/home/labby/.local/share sh -lc '
      set -eu
      mkdir -p "$HOME/.cargo" "$HOME/.local/bin"
      tmp="$(mktemp -d)"
      trap '\''rm -rf "$tmp"'\'' EXIT
      installer="$tmp/rustup-init"
      curl -fsSL --connect-timeout 10 --max-time 300 -o "$installer" https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init
      echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  $installer" | sha256sum --check --strict
      chmod 0755 "$installer"
      # LABBY_SUPPLY: rust
      "$installer" -y --profile minimal --default-toolchain 1.97.1
      '
      # LABBY_SUPPLY: go
      case "$(uname -m)" in x86_64|amd64) ;; *) echo "unsupported Go architecture" >&2; exit 1 ;; esac
      tmp="$(mktemp -d)"
      trap 'rm -rf "$tmp"' EXIT
      go_asset="go1.26.5.linux-amd64.tar.gz"
      curl -fsSL --connect-timeout 10 --max-time 300 -o "$tmp/$go_asset" "https://go.dev/dl/$go_asset"
      echo "5c2c3b16caefa1d968a94c1daca04a7ca301a496d9b086e17ad77bb81393f053  $tmp/$go_asset" | sha256sum --check --strict
      rm -rf /usr/local/go
      tar -C /usr/local -xzf "$tmp/$go_asset"
      ln -sfn /usr/local/go/bin/go /usr/local/bin/go
      ln -sfn /usr/local/go/bin/gofmt /usr/local/bin/gofmt

  - trigger: post-packages
    action: |-
      #!/usr/bin/env bash
      set -euo pipefail
      # LABBY_PROVISION_ACTION: agent-clis
      runuser -u labby -- env HOME=/home/labby USER=labby LOGNAME=labby XDG_CONFIG_HOME=/home/labby/.config XDG_CACHE_HOME=/home/labby/.cache XDG_DATA_HOME=/home/labby/.local/share sh -lc '
      set -eu
      export PATH="$HOME/.local/bin:$PATH"
      npm config set prefix "$HOME/.local"
      tmp="$(mktemp -d)"
      trap '\''rm -rf "$tmp"'\'' EXIT
      install_verified() {
        package=$1 version=$2 integrity=$3 file="$tmp/$(echo "$package" | tr '\''/@'\'' '\''__'\'').tgz"
        url="$(npm view "$package@$version" dist.tarball)"
        curl -fsSL --connect-timeout 10 --max-time 300 -o "$file" "$url"
        actual="sha512-$(openssl dgst -sha512 -binary "$file" | openssl base64 -A)"
        test "$actual" = "$integrity"
        npm install -g "$file"
      }
      # LABBY_SUPPLY: claude_code
      install_verified @anthropic-ai/claude-code 2.1.163 sha512-aK+hmLIaxp6v2M/fifhrCdYJ+kuQuGOl4Iok+AwRijeZl/HMn55rkwF6lEIq1Ny0xNCp2UKiZcmCegyoMumoWg==
      # LABBY_SUPPLY: codex
      install_verified @openai/codex 0.130.0 sha512-WGDj+RZ3TXWC/7MlwprgLWOqzpwatPIINPhP3IRzHA0ni+o3QZ4i4xrS2uWwGmHUJ395J5JHwoZAAZYyfJyz6w==
      # LABBY_SUPPLY: gemini_cli
      install_verified @google/gemini-cli 0.58.0 sha512-++LtUYMcLE8dVxMcuwv6kIp8+h6z+std/7iVE+vSunkrwNDaWMFkWw/psv2RSySWjr2A1SsEEIGCK0xULWY2sA==
      '

  - trigger: post-packages
    action: |-
      #!/usr/bin/env bash
      set -euo pipefail
      # LABBY_PROVISION_ACTION: mise
      # LABBY_SUPPLY: mise_installer
      runuser -u labby -- env HOME=/home/labby USER=labby LOGNAME=labby XDG_CONFIG_HOME=/home/labby/.config XDG_CACHE_HOME=/home/labby/.cache XDG_DATA_HOME=/home/labby/.local/share sh -lc '
      set -eu
      mkdir -p "$HOME/.local/bin"
      tmp="$(mktemp -d)"
      trap '\''rm -rf "$tmp"'\'' EXIT
      installer="$tmp/mise-install.sh"
      curl -fsSL --connect-timeout 10 --max-time 300 -o "$installer" https://mise.run
      echo "3731dfec59ffb0bc23df96ae19b4b51470db939c875c2fdf01cf6c25b1b1e039  $installer" | sha256sum --check --strict
      env MISE_VERSION=2026.9.1 MISE_INSTALL_PATH="$HOME/.local/bin/mise" sh "$installer"
      '

  - trigger: post-packages
    action: |-
      #!/usr/bin/env bash
      set -euo pipefail
      # LABBY_PROVISION_ACTION: chezmoi
      # LABBY_SUPPLY: chezmoi_installer
      runuser -u labby -- env HOME=/home/labby USER=labby LOGNAME=labby XDG_CONFIG_HOME=/home/labby/.config XDG_CACHE_HOME=/home/labby/.cache XDG_DATA_HOME=/home/labby/.local/share sh -lc '
      set -eu
      mkdir -p "$HOME/.local/bin"
      tmp="$(mktemp -d)"
      trap '\''rm -rf "$tmp"'\'' EXIT
      installer="$tmp/chezmoi-install.sh"
      curl -fsSL --connect-timeout 10 --max-time 300 -o "$installer" https://get.chezmoi.io
      echo "75de125a45a82b53c16546db7057052e98c11866ded27c4b6f95a51f59432e7b  $installer" | sha256sum --check --strict
      sh "$installer" -t v2.72.1 -b "$HOME/.local/bin"
      '

  - trigger: post-packages
    action: |-
      #!/usr/bin/env bash
      set -euo pipefail
      # LABBY_PROVISION_ACTION: crgx
      # LABBY_SUPPLY: crgx_installer
      runuser -u labby -- env HOME=/home/labby USER=labby LOGNAME=labby XDG_CONFIG_HOME=/home/labby/.config XDG_CACHE_HOME=/home/labby/.cache XDG_DATA_HOME=/home/labby/.local/share sh -lc '
      set -eu
      if command -v crgx >/dev/null 2>&1; then
        exit 0
      fi
      mkdir -p "$HOME/.local/bin"
      tmp="$(mktemp -d)"
      trap '\''rm -rf "$tmp"'\'' EXIT
      installer="$tmp/crgx-install.sh"
      curl -fsSL --connect-timeout 10 --max-time 300 -o "$installer" https://crgx.dev/install.sh
      echo "232ca80d014043bfac12afd7a48e75d7cd98d35e6d0e7384062093535e3eb998  $installer" | sha256sum --check --strict
      sed -i 's|VERSION=$(curl .*|VERSION=0.1.0|' "$installer"
      sh "$installer"
      '

  - trigger: post-packages
    action: |-
      #!/usr/bin/env bash
      set -euo pipefail
      # LABBY_PROVISION_ACTION: android-sdk
      # Opt-in capability for the claude-in-mobile MCP server. Pulled out of the
      # image apt floor because android-sdk drags in ~300 MiB of JVM + java deps
      # that the gateway core does not need. The block guards itself on
      # LABBY_ENABLE_ANDROID_SDK=1 because distrobuilder runs every post-packages
      # action during image build — without this guard the packages would bake
      # back into the image, defeating the slimming. provision.rs also gates the
      # plan on the same env var so it only runs when explicitly requested.
      case "${LABBY_ENABLE_ANDROID_SDK:-0}" in
        1|true|yes|on|TRUE|YES|ON) ;;
        *) echo "android-sdk: skipping (set LABBY_ENABLE_ANDROID_SDK=1 to install)"; exit 0 ;;
      esac
      apt-get update
      apt-get install -y adb android-sdk android-sdk-platform-tools android-sdk-platform-tools-common android-sdk-build-tools

  - trigger: post-packages
    action: |-
      #!/usr/bin/env bash
      set -euo pipefail
      # LABBY_PROVISION_ACTION: tailscale-install
      # LABBY_SUPPLY: tailscale_installer
      if ! command -v tailscale >/dev/null 2>&1; then
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        curl -fsSL --connect-timeout 10 --max-time 300 -o "$tmp/install.sh" https://tailscale.com/install.sh
        echo "805e85ed6f6f81a7ea2e70d52d47e7d5290863299e5c922b2787d71aa312f22e  $tmp/install.sh" | sha256sum --check --strict
        sh "$tmp/install.sh"
        tailscale version | grep -F '1.102.3'
      fi
      rm -f /var/lib/tailscale/*.state /run/labby-ts-authkey

  - trigger: post-packages
    action: |-
      #!/usr/bin/env bash
      set -euo pipefail
      # LABBY_PROVISION_ACTION: cache-cleanup
      # Caches regenerate on demand (apt-get update re-pulls lists; npm install
      # re-populates _cacache), so shipping them is pure image bloat. apt-get
      # clean drops /var/cache/apt/archives; the *.bin + lists removals drop
      # apt's pkgcache/srcpkgcache + downloaded package indexes; _cacache is
      # npm's download cache left behind by the agent-clis global install.
      apt-get clean
      rm -f /var/cache/apt/*.bin
      rm -rf /var/lib/apt/lists/*
      rm -rf /home/labby/.npm/_cacache

files:
  - generator: copy
    source: "@@LABBY_BINARY@@"
    path: /usr/local/bin/labby
    mode: "0755"
  - generator: dump
    path: /etc/labby-image-release
    mode: "0644"
    content: |-
      {{ image.serial }}
