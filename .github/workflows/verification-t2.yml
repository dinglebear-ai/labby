name: Verification T2

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read

jobs:
  kani:
    name: Kani bounded proofs (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: tools/verification/target
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-kache
      - name: Install exact Kani release
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cargo install --locked --version 0.67.0 kani-verifier
          cargo kani setup
          driver="$HOME/.kani/kani-0.67.0/bin/kani-driver"
          test -x "$driver"
          printf 'LABBY_KANI_DRIVER=%s\n' "$driver" >> "$GITHUB_ENV"
          printf '%s\n' "$(dirname "$driver")" >> "$GITHUB_PATH"
      - name: Run actual positive, under-unwind, and negative controls
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p verification-evidence
          git rev-parse HEAD > verification-evidence/source-revision.txt
          sha256sum "$LABBY_KANI_DRIVER" > verification-evidence/kani-driver-sha256.txt
          "$LABBY_KANI_DRIVER" --version > verification-evidence/kani-version.txt
          timeout --signal=TERM --kill-after=5s 1200s \
            cargo test --manifest-path tools/verification/Cargo.toml -p verify-kani \
              --test actual_kani --locked -- --ignored --test-threads=1 \
              2>&1 | tee verification-evidence/kani-qualification.txt
      - name: Preserve bounded-proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-t2-kani
          path: verification-evidence/
          if-no-files-found: error
          retention-days: 14
  shuttle:
    name: Shuttle bounded schedules (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: tools/verification/target
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-kache
      - name: Run deterministic Shuttle lifecycle controls
        timeout-minutes: 40
        run: |
          set -euo pipefail
          mkdir -p verification-evidence
          git rev-parse HEAD > verification-evidence/source-revision.txt
          timeout --signal=TERM --kill-after=5s 2100s \
            cargo test --manifest-path tools/verification/Cargo.toml -p verify-loom \
              --locked --test lifecycle shuttle_ -- --test-threads=1 \
              2>&1 | tee verification-evidence/shuttle-qualification.txt
      - name: Preserve bounded-schedule evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-t2-shuttle
          path: verification-evidence/
          if-no-files-found: error
          retention-days: 14
