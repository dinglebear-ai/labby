<body>
<main class="app" id="app">
  <header class="top">
    <div class="brand"><div class="mark" aria-hidden="true">L</div><div><div class="eyebrow">Labby</div><h1>Skill Library</h1><p class="sub">Save personally · activate locally · expose over MCP</p></div></div>

  </header>
  <section class="summary" id="summary"><div class="summary-card"><div><div class="summary-title">Create a reusable Agent Skill</div><p class="sub">Start with SKILL.md, validate it, then save an immutable revision. Activation is always a separate step.</p><div class="meta"><span class="pill draft">Draft</span><span class="pill">Personal by default</span></div></div><div class="actions"><button id="quickCreate" class="primary">Create skill</button><button id="browse">Browse library</button></div></div></section>

    <section class="main" id="main" tabindex="-1"></section>
  </section>

</main>
<script>window.__LABBY_APP_INFO={name:"LabbySkillLibrary",version:"1.0.0"};</script>

<script>
(() => {
"use strict";
const host=window.LabbyAppHost,$=id=>document.getElementById(id),app=$("app"),workspace=$("workspace"),main=$("main"),listEl=$("skillList"),status=$("status"),expand=$("expand");

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function recovery(kind){const k=String(kind||"").toLowerCase();if(k.includes("stale")||k.includes("conflict"))return "Reload authoritative server truth, review the current revision, and retry.";if(k.includes("valid"))return "Correct the reported Skill files and validate again.";if(k.includes("forbid")||k.includes("author"))return "Only the owner or a Labby administrator can change this Skill.";if(k.includes("source")||k.includes("depot"))return "The import source is optional; keep editing locally or ask an administrator to restore it.";if(k.includes("publish")||k.includes("refresh"))return "Reload server truth; publication is incomplete until committed and published versions match.";return "Reload the authoritative library and retry.";}

const allowed=a=>state.contract.actions.has(a);
function setStatus(text){status.textContent=text;resize();}
function notice(message,type="",guidance=""){const n=$("notice");if(!n)return;n.className=`notice ${type}`;n.innerHTML=`<b>${esc(message)}</b>${guidance?`<p>${esc(guidance)}</p><button data-command="reload">Reload library</button>`:""}`;n.hidden=false;resize();}
function tokenKey(action,target){return `${action}:${target||"new"}`;}

function canonicalIntent(value){if(Array.isArray(value))return `[${value.map(canonicalIntent).join(",")}]`;if(value&&typeof value==="object")return `{${Object.keys(value).filter(k=>value[k]!==undefined&&k!=="idempotency_key").sort().map(k=>`${JSON.stringify(k)}:${canonicalIntent(value[k])}`).join(",")}}`;return JSON.stringify(value??null);}
function intentDigest(value){const text=canonicalIntent(value),seeds=[0xcbf29ce484222325n,0x84222325cbf29ce4n,0x9e3779b185ebca87n,0xd6e8feb86659fd93n];return seeds.map(seed=>{let hash=seed;for(let i=0;i<text.length;i++){hash^=BigInt(text.charCodeAt(i));hash=BigInt.asUintN(64,hash*0x100000001b3n);}return hash.toString(16).padStart(16,"0");}).join("");}

function requestKey(action,target,intent={}){const key=tokenKey(action,target),derived=deterministicIdempotencyKey(action,target,intent);if(state.pending.get(key)!==derived){state.pending.set(key,derived);persistContinuity();}return state.pending.get(key);}
function idempotency(action){return requestKey(action,state.selected?.artifact_id||"new");}
function clearIdempotency(action){state.pending.delete(tokenKey(action,state.selected?.artifact_id||"new"));persistContinuity();}
function ambiguous(e){if(e?.definitive===true)return false;return /timeout|network|disconnect|cancel|closed|unavailable|ambiguous|transport/i.test(`${e?.kind||""} ${e?.message||""}`);}

function deriveViewModel(d={},opts={}){const actions=new Set(d.allowed_actions||state.contract.actions),visibility=opts.visibility??d.visibility,visibilityLabel=visibility==="private"||visibility==="personal"?"Personal":visibility==="shared"?"Shared":"Not reported",generation=Number.isSafeInteger(d.current_generation)?d.current_generation:null,publishedVersion=Number.isSafeInteger(d.published_library_version)?d.published_library_version:null,publicationSynchronized=generation!==null&&publishedVersion!==null?generation===publishedVersion:null,active=d.active_revision_id||null,latest=d.latest_revision_id||null,archived=d.archived===true,canMutate=d.can_mutate===true&&!archived;let lifecycle=opts.draft?"Draft":archived?"Archived":!active?"Deactivated":publicationSynchronized===false?"Publishing":"Active";const materialization=d.materialized===true?"Materialized":d.materialized===false?"Not materialized":"Not reported",files=manifest(d);return{lifecycle,mutable:canMutate,visibility:{value:visibility,label:visibilityLabel},materialization,publication:{generation,publishedVersion,synchronized:publicationSynchronized},activeRevision:active,latestRevision:latest,actions,affordances:{edit:canMutate&&actions.has("artifacts.read")&&files.length>0,validate:actions.has("artifacts.validate"),save:opts.isNew?actions.has("artifacts.create"):canMutate&&actions.has("artifacts.save"),activate:canMutate&&!!latest&&actions.has("artifacts.activate"),deactivate:canMutate&&!!active&&actions.has("artifacts.deactivate"),archive:canMutate&&actions.has("artifacts.archive"),history:actions.has("artifacts.history"),rollback:canMutate&&actions.has("artifacts.rollback")},facts:[{label:"Access",value:d.access_label},{label:"Owner",value:d.owner?.relationship},{label:"Provenance",value:d.provenance?.source},{label:"Materialization",value:materialization},{label:"Latest revision",value:latest},{label:"Active revision",value:active},{label:"Generation",value:generation},{label:"Published library version",value:publishedVersion},{label:"Published URI",value:d.canonical_uri}]};}
function openWorkspace(create=false){workspace.hidden=false;expand.setAttribute("aria-expanded","true");expand.innerHTML='↙<span class="sr-only">Collapse library</span>';if(create)newDraft();else if(!state.selected)renderEmpty();loadList();main.focus();resize();}

function renderEditor(isNew=false,focus=false){const d=state.detail||state.selected||{},f=state.files[state.file]||{},vm=deriveViewModel(d,{draft:true,isNew,visibility:state.visibility}),filesPending=state.files.some(x=>x.loaded===false);main.innerHTML=`<form id="editor" class="editor"><div id="notice" hidden></div><div class="detail-head"><div><h2>${isNew?"Create a Skill":`Edit ${esc(d.name)}`}</h2><div class="meta"><span class="pill draft">${esc(vm.lifecycle)}</span><span class="pill ${vm.visibility.value==="shared"?"shared":""}">${esc(vm.visibility.label)}</span><span class="pill">Saving does not activate</span></div></div><button type="button" data-command="cancel">Cancel</button></div><div class="field"><label for="skillName">Skill name</label><input id="skillName" value="${esc(isNew?"":d.name)}" required ${isNew?"":"readonly"} autocomplete="off"></div>${visibilityChoice(isNew)}<div><div class="file-tabs" id="fileTabs" role="tablist" aria-label="Skill files"></div><button type="button" data-command="add-file">+ Supporting file</button></div><div class="field"><label for="filePath">Logical file name</label><input id="filePath" value="${esc(f.path)}" required autocomplete="off"></div><div class="field"><label for="fileBody">Contents</label><textarea id="fileBody" required spellcheck="false" ${f.loaded===false?"disabled":""}>${esc(f.loaded===false?"Loading…":f.content)}</textarea></div><div class="actions"><button type="button" data-command="validate" ${filesPending||!vm.affordances.validate?"disabled":""}>Validate</button><button class="primary" type="submit" ${filesPending||!vm.affordances.save?"disabled":""}>${isNew?"Save Skill":"Save immutable revision"}</button></div></form>`;renderTabs();if(focus)$("skillName").focus();resize();}

function syncFile(){if(!$("filePath")||state.files[state.file]?.loaded===false)return;state.files[state.file]={path:$("filePath").value,content:$("fileBody").value,loaded:true};state.dirty=true;}
async function call(action,params){if(state.disposed)throw fault({kind:"view_closed",message:"This view has closed"});return unwrap(await host.callAction("artifacts",action,params));}
async function loadList(cursor=state.cursors[state.page]){const seq=++state.seq.list;setStatus("Loading authoritative library…");try{const data=await call("artifacts.list",{cursor,limit:50});if(seq!==state.seq.list||state.disposed)return;observeVersion(data?.library_version);receiveContract(data);state.items=Array.isArray(data?.items)?data.items:[];state.next=data?.next_cursor||null;renderList();setStatus(`${state.items.length} Skills on this page${state.version===null?"":` · server version ${state.version}`}`);}catch(e){if(seq===state.seq.list)setStatus(`Could not load: ${e.message}`);}}
async function selectSkill(id){const seq=++state.seq.detail;state.seq.history++;state.seq.read++;const selected=state.items.find(x=>x.artifact_id===id);if(!selected)return;state.selected=selected;state.detail=selected;state.dirty=false;renderList();renderDetail();try{const data=await call("artifacts.get",{artifact_id:id});if(seq!==state.seq.detail||state.selected?.artifact_id!==id||state.disposed)return;observeVersion(data?.library_version);state.detail={...selected,...(data?.item||{})};renderDetail();}catch(e){if(seq!==state.seq.detail||state.selected?.artifact_id!==id)return;notice(e.message,"error",e.recovery||recovery(e.kind));}}
async function loadHistory(id,cursor=null){const seq=++state.seq.history,revision=state.detail?.latest_revision_id;try{const data=await call("artifacts.history",{artifact_id:id,cursor,limit:50});if(seq!==state.seq.history||state.detail?.artifact_id!==id||state.detail?.latest_revision_id!==revision)return;observeVersion(data?.library_version);const incoming=Array.isArray(data?.items)?data.items:[],combined=cursor?[...state.history,...incoming]:incoming,overflow=Math.max(0,combined.length-HISTORY_WINDOW_LIMIT);if(!cursor)state.historyOffset=0;state.historyOffset+=overflow;state.history=overflow?combined.slice(overflow):combined;state.historyNext=data?.next_cursor||null;const el=$("history"),vm=deriveViewModel(state.detail),windowLabel=state.historyOffset?`<p class="muted">Showing revisions ${state.historyOffset+1}–${state.historyOffset+state.history.length} from the traversed history window.</p>`:"";if(!el)return;el.innerHTML=state.history.length?windowLabel+state.history.map(r=>`<div class="revision"><div><b>${esc(r.revision_id)}</b>${r.created_at?`<div class="muted">${esc(r.created_at)}</div>`:""}</div><button data-command="rollback" data-revision="${esc(r.revision_id)}" ${!vm.affordances.rollback?"disabled":""}>Roll back</button></div>`).join("")+(state.historyNext?'<button data-command="more-history">Load more history</button>':""):'<p class="muted">No revisions returned.</p>';resize();}catch(e){if(seq===state.seq.history&&state.detail?.artifact_id===id){const el=$("history");if(el)el.innerHTML=`<div class="notice error">${esc(e.message)}</div>`;}}}
function newDraft(){const vm=deriveViewModel({}, {isNew:true,draft:true,visibility:state.visibility});if(!state.contract.canCreate||!vm.affordances.save){setStatus("The server has not granted Skill creation.");return;}state.selected=null;state.detail=null;state.files=[{path:"SKILL.md",content:template,loaded:true}];state.file=0;state.dirty=true;renderList();renderEditor(true,true);}
async function loadFile(index,artifact,revision){const current=state.files[index];if(!current||current.loaded)return;const seq=++state.seq.read,path=current.path;renderEditor(false);try{const data=await call("artifacts.read",{artifact_id:artifact,revision_id:revision,path});if(seq!==state.seq.read||state.detail?.artifact_id!==artifact||state.detail?.latest_revision_id!==revision||state.files[index]?.path!==path)return;observeVersion(data?.library_version);state.files[index]={path:data.path,content:data.text,loaded:true};renderEditor(false);$("fileBody").focus();}catch(e){if(seq===state.seq.read)notice(e.message,"error",e.recovery||recovery(e.kind));}}
async function edit(){const d=state.detail,revision=d?.latest_revision_id,files=manifest(d);if(!d||!revision||!files.length){notice("Labby did not return a file manifest for this revision.","error","Reload server truth; editing is disabled without the complete manifest.");return;}state.files=files;state.file=Math.max(0,files.findIndex(x=>x.path==="SKILL.md"));state.dirty=false;renderEditor(false);await loadFile(state.file,d.artifact_id,revision);}
async function ensureFiles(){const d=state.detail,revision=d?.latest_revision_id;for(let i=0;i<state.files.length;i++){if(!state.files[i].loaded)await loadFile(i,d.artifact_id,revision);if(!state.files[i].loaded)throw fault({kind:"file_read_failed",message:`Could not load ${state.files[i].path}`});}}
function validationFeedback(data){if(data?.valid){notice(`Valid${data.revision_id?` · ${data.revision_id}`:""}`,"ok");return;}const rejections=Array.isArray(data?.rejections)?data.rejections:[],node=$("notice");if(!node)return;node.className="notice warn";node.innerHTML=`<b>Validation did not pass</b>${rejections.length?`<ul class="rejections">${rejections.map(r=>`<li>${r.path?`<code>${esc(r.path)}</code>: `:""}${esc(r.field)} · <code>${esc(r.code)}</code></li>`).join("")}</ul>`:"<p>Labby returned no structured rejection details.</p>"}`;node.hidden=false;resize();}
async function validate(){syncFile();try{await ensureFiles();setStatus("Validating logical files…");const data=await call("artifacts.validate",{name:$("skillName").value.trim(),files:state.files.map(({path,content})=>({path,content}))});validationFeedback(data);setStatus(data?.valid?"Validation passed":"Validation needs attention");}catch(e){notice(e.message,"error",e.recovery||recovery(e.kind));setStatus("Validation failed");}}
function authoredMutationAlreadySatisfied(action,target,revision){return action==="artifacts.save"&&!!revision&&state.detail?.artifact_id===target&&state.detail?.latest_revision_id===revision;}
function matchesCommittedCreate(item,artifact,name,revision,visibility){return item?.artifact_id===artifact&&item?.name===name&&item?.latest_revision_id===revision&&item?.visibility===visibility;}
async function findCommittedCreate(artifact,name,revision,visibility){if(!artifact)return null;try{const data=await call("artifacts.get",{artifact_id:artifact});observeVersion(data?.library_version);const item=data?.item;return matchesCommittedCreate(item,artifact,name,revision,visibility)?item:null;}catch(e){if(/not[_ ]?found|unknown target/i.test(`${e?.kind||""} ${e?.message||""}`))return null;throw e;}}
async function save(event){event.preventDefault();syncFile();await ensureFiles();const creating=!state.selected,action=creating?"artifacts.create":"artifacts.save",target=creating?"new":state.selected.artifact_id,name=$("skillName").value.trim(),files=state.files.map(({path,content})=>({path,content}));if(state.version===null)throw fault({kind:"stale_library_version",message:"Current library version is unavailable"});const validation=await call("artifacts.validate",{name,files});if(!validation?.valid){validationFeedback(validation);setStatus("Validation needs attention");return;}const recovered=creating?await findCommittedCreate(validation.artifact_id,name,validation.revision_id,state.visibility):null;if(recovered||authoredMutationAlreadySatisfied(action,target,validation.revision_id)){state.pending.delete(tokenKey(action,target));state.reconciliation=null;persistContinuity();setStatus("Server truth already contains this exact revision; nothing was resubmitted.");if(recovered){state.items=[recovered];renderList();await selectSkill(recovered.artifact_id);}else renderDetail();return;}const params={files,expected_library_version:state.version};if(creating){params.name=name;params.visibility=state.visibility;}else{params.artifact_id=target;params.expected_revision_id=state.detail.latest_revision_id;}params.idempotency_key=requestKey(action,target,params);await mutate(action,params,"Saved immutable revision. It is not active.",target);}
async function mutate(action,params,success,target=state.detail?.artifact_id){if(state.busy)return;const key=tokenKey(action,target);if(mutationAlreadySatisfied(action,params)){state.pending.delete(key);state.reconciliation=null;persistContinuity();setStatus("Server truth already reflects this mutation; nothing was resubmitted.");return;}state.busy=true;setStatus("Committing with Labby…");try{const receipt=await call(action,params);state.pending.delete(key);state.reconciliation=null;persistContinuity();observeVersion(receipt?.committed_library_version);observeVersion(receipt?.published_library_version);const published=receipt?.committed_library_version===receipt?.published_library_version,message=(action.endsWith("activate")||action.endsWith("rollback"))?(published?"Active generation published.":"Revision committed; publication is incomplete."):success,artifact=receipt?.artifact_id||target;await loadList();if(artifact&&state.items.some(x=>x.artifact_id===artifact))await selectSkill(artifact);setStatus(`${message}${receipt?.new_generation===undefined?"":` Generation ${receipt.new_generation}.`}`);notice(message,published?"ok":"warn",receipt?.relist_required?receipt.relist_guidance:(!published?recovery("publish"):""));}catch(e){if(ambiguous(e))state.reconciliation={action,idempotency_key:params.idempotency_key,artifact_id:target};else{state.pending.delete(key);state.reconciliation=null;}persistContinuity();setStatus(ambiguous(e)?"Outcome is ambiguous; reconciling server truth…":"Request rejected; reloading server truth…");await loadList();if(target&&state.items.some(x=>x.artifact_id===target))await selectSkill(target);notice(e.message,"error",`${e.recovery||recovery(e.kind)}${ambiguous(e)?" The same request key will be reused.":""}`);}finally{state.busy=false;}}
function mutationAlreadySatisfied(action,params){const d=state.detail;if(!d||d.artifact_id!==params.artifact_id)return false;if(action==="artifacts.activate"||action==="artifacts.rollback")return d.active_revision_id===params.expected_revision_id&&deriveViewModel(d).lifecycle==="Active";if(action==="artifacts.deactivate")return !d.active_revision_id;if(action==="artifacts.archive")return d.archived===true;return false;}
function mutationParams(action,revision){const d=state.detail;if(!d||state.version===null)throw fault({kind:"stale_library_version",message:"Current library version is unavailable"});const p={artifact_id:d.artifact_id,expected_library_version:state.version};if(revision)p.expected_revision_id=revision;p.idempotency_key=requestKey(action,d.artifact_id,p);return p;}
async function command(target){if(target.dataset.file!==undefined){syncFile();state.file=Number(target.dataset.file);renderEditor(!state.selected);if(state.selected)return loadFile(state.file,state.detail.artifact_id,state.detail.latest_revision_id);return;}const cmd=target.dataset.command;if(!cmd)return;try{if(cmd==="reload")return loadList();if(cmd==="edit")return edit();if(cmd==="cancel")return state.selected?renderDetail():renderEmpty();if(cmd==="add-file"){syncFile();state.files.push({path:"references/notes.md",content:"",loaded:true});state.file=state.files.length-1;return renderEditor(!state.selected);}if(cmd==="validate")return validate();if(cmd==="activate")return mutate("artifacts.activate",mutationParams("artifacts.activate",state.detail.latest_revision_id),"Active generation published.");if(cmd==="deactivate")return mutate("artifacts.deactivate",mutationParams("artifacts.deactivate"),"Skill deactivated; revisions remain stored.");if(cmd==="archive"){if(confirm("Archive this Skill? Revisions remain stored, but it will no longer be active."))return mutate("artifacts.archive",mutationParams("artifacts.archive"),"Skill archived.");}if(cmd==="rollback")return mutate("artifacts.rollback",mutationParams("artifacts.rollback",target.dataset.revision),"Prior revision activated as a new generation.");if(cmd==="more-history")return loadHistory(state.detail.artifact_id,state.historyNext);}catch(e){notice(e.message,"error",e.recovery||recovery(e.kind));}}
function resize(){requestAnimationFrame(()=>{if(!state.disposed)host.requestResize({width:Math.ceil(app.getBoundingClientRect().width),height:Math.ceil(app.getBoundingClientRect().height)});});}
expand.addEventListener("click",()=>workspace.hidden?openWorkspace():closeWorkspace());$("quickCreate").addEventListener("click",()=>openWorkspace(true));$("browse").addEventListener("click",()=>openWorkspace());$("newSkill").addEventListener("click",newDraft);$("search").addEventListener("input",renderList);$("prevPage").addEventListener("click",()=>{if(state.page>0){state.page--;loadList();}});$("nextPage").addEventListener("click",()=>{if(state.next){state.cursors[++state.page]=state.next;loadList(state.next);}});
listEl.addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b)selectSkill(b.dataset.id);});listEl.addEventListener("keydown",e=>{const options=[...listEl.querySelectorAll('[role="option"]')],at=options.indexOf(document.activeElement);let next;if(e.key==="ArrowDown")next=Math.min(options.length-1,at+1);else if(e.key==="ArrowUp")next=Math.max(0,at-1);else if(e.key==="Home")next=0;else if(e.key==="End")next=options.length-1;else if((e.key==="Enter"||e.key===" ")&&at>=0){e.preventDefault();return selectSkill(options[at].dataset.id);}else return;e.preventDefault();options[next]?.focus();});
main.addEventListener("click",e=>{const tab=e.target.closest("[data-file]");if(tab){syncFile();state.file=Number(tab.dataset.file);renderEditor(!state.selected);if(state.selected)loadFile(state.file,state.detail.artifact_id,state.detail.latest_revision_id);return;}command(e.target.closest("[data-command]")||{});});main.addEventListener("keydown",e=>{const tab=e.target.closest('[role="tab"]');if(!tab||!/[ArrowLeftRight]/.test(e.key))return;const tabs=[...main.querySelectorAll('[role="tab"]')],i=tabs.indexOf(tab),step=e.key==="ArrowRight"?1:-1,next=(i+step+tabs.length)%tabs.length;e.preventDefault();tabs[next].click();tabs[next].focus();});main.addEventListener("submit",e=>save(e).catch(err=>notice(err.message,"error",err.recovery||recovery(err.kind))));main.addEventListener("input",e=>{if(e.target.matches("#filePath,#fileBody"))state.dirty=true;if(e.target.name==="visibility")state.visibility=e.target.value;});
window.addEventListener("message",e=>{if(e.source!==window.parent)return;const data=e.data;if(data?.method==="ui/resource-teardown"){if(data.id!==undefined)window.parent.postMessage({jsonrpc:"2.0",id:data.id,result:{}},"*");persistContinuity();state.disposed=true;state.request++;Object.keys(state.seq).forEach(k=>state.seq[k]++);}});window.addEventListener("beforeunload",()=>{persistContinuity();state.disposed=true;state.request++;});window.addEventListener("resize",resize);
restoreContinuity();$("quickCreate").disabled=true;$("newSkill").disabled=true;if(host.hasBridge()){setStatus("Connected · authoritative state comes from Labby");loadList().then(()=>{$("quickCreate").disabled=!state.contract.canCreate||!deriveViewModel({}, {isNew:true}).affordances.save;});}else setStatus("Interactive host unavailable · use the skills tool actions in the conversation");resize();
})();
