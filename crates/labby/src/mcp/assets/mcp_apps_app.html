<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Labby MCP Apps</title>
<style>
:root{color-scheme:dark;--bg:#07131c;--panel:#13293a;--panel2:#173245;--control:#0c1a24;--border:#1d3d4e;--border2:#28556b;--text:#e6f4fb;--muted:#a7bcc9;--accent:#29b6f6;--ok:#7dd3c7;--error:#c78490;font-family:Inter,Manrope,"Segoe UI",system-ui,sans-serif;color:var(--text)}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;min-width:0;background:transparent}body{padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}button{font:inherit}.shell{width:100%;max-width:720px;margin:auto;overflow:hidden;border:1px solid color-mix(in srgb,var(--border) 70%,transparent);border-radius:12px;background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 10px 24px rgba(0,0,0,.18)}
.head{display:flex;align-items:center;gap:8px;min-width:0;padding:8px 9px;border-bottom:1px solid color-mix(in srgb,var(--border) 70%,transparent)}.lamp{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px color-mix(in srgb,var(--ok) 65%,transparent);flex:none}.title{font-size:12.5px;font-weight:800;white-space:nowrap}.summary{min-width:0;color:var(--muted);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bulk{margin-left:auto;display:flex;gap:4px;flex:none}.bulk button{height:28px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:var(--control);color:var(--muted);font-size:10px;font-weight:750;cursor:pointer}.bulk button:hover{border-color:var(--border2);color:var(--text)}.bulk button:focus-visible,.switch:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px}.bulk button:disabled,.switch:disabled{opacity:.5;cursor:wait}
.status{min-height:0;margin:0;padding:0 9px;color:var(--muted);font-size:10px;line-height:1.35}.status:not(:empty){padding-top:6px}.status.error{color:var(--error)}.apps{display:grid;padding:5px 7px 7px}.app{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;min-height:44px;padding:7px 3px;border-top:1px solid color-mix(in srgb,var(--border) 42%,transparent)}.app:first-child{border-top:0}.identity{min-width:0}.name-row{display:flex;align-items:center;gap:7px;min-width:0}.dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex:none}.app[data-enabled="true"] .dot{background:var(--ok)}.name{min-width:0;font-size:11.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tool{margin-left:auto;padding:2px 5px;border:1px solid color-mix(in srgb,var(--border) 55%,transparent);border-radius:999px;color:var(--muted);font:8.5px ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap}.desc{margin:2px 0 0 13px;color:var(--muted);font-size:10px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.switch{position:relative;width:40px;height:22px;border:1px solid var(--border2);border-radius:999px;background:var(--control);cursor:pointer;padding:0;flex:none}.switch:after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .14s ease,background .14s ease}.switch[aria-checked="true"]{background:color-mix(in srgb,var(--ok) 17%,var(--control));border-color:color-mix(in srgb,var(--ok) 55%,var(--border2))}.switch[aria-checked="true"]:after{transform:translateX(18px);background:var(--ok)}
@media(max-width:440px){body{padding:0}.shell{border-radius:0;border-left:0;border-right:0}.head{padding:7px}.summary{font-size:9.5px}.bulk button{width:28px;padding:0;font-size:0}.bulk button:first-child:after{content:"All+";font-size:9px}.bulk button:last-child:after{content:"All−";font-size:9px}.apps{padding:3px 6px 6px}.app{min-height:42px}.tool{display:none}.desc{margin-left:13px;max-width:calc(100vw - 82px)}}
@media(prefers-reduced-motion:reduce){.switch:after{transition:none}}
</style>
<script>window.__LABBY_APP_INFO={name:"LabbyMcpApps",version:"1.0.0"};</script>
<script src="/apps/assets/labby-app-host.js"></script>
</head>
<body>
<main class="shell" id="shell">
 <header class="head"><span class="lamp"></span><span class="title">MCP Apps</span><span class="summary" id="summary">Loading…</span><div class="bulk"><button id="enableAll" type="button">All on</button><button id="disableAll" type="button">All off</button></div></header>
 <p class="status" id="status" role="status" aria-live="polite"></p>
 <section class="apps" id="apps" aria-label="Labby MCP App visibility"></section>
</main>
<script>
(()=>{"use strict";
const host=window.LabbyAppHost,shell=document.getElementById("shell"),appsEl=document.getElementById("apps"),statusEl=document.getElementById("status"),summaryEl=document.getElementById("summary"),enableAll=document.getElementById("enableAll"),disableAll=document.getElementById("disableAll");
const catalog=[{id:"manager",title:"App switchboard",description:"Show or hide Labby-owned app surfaces.",tool:"mcp_app"},{id:"codemode",title:"Code Mode inspector",description:"Inspect tool calls, timing, results, and nested apps.",tool:"codemode_ui"},{id:"skill_library",title:"Skill Library",description:"Browse and manage artifacts, skills, and revisions.",tool:"artifacts"},{id:"gateway_status",title:"Gateway status",description:"See upstream health and capability counts.",tool:"gateway_status"},{id:"server_logs",title:"Server logs",description:"Search Labby's rolling process logs.",tool:"server_logs"},{id:"add_server",title:"Add server",description:"Test and connect a new MCP upstream.",tool:"add_server"},{id:"settings",title:"Settings",description:"Change safe runtime and feature settings.",tool:"settings"}];
let state={},disposed=false,frame=null,pending=new Set();
function normalize(value){if(value==null)return value;if(value.structuredContent!=null)return normalize(value.structuredContent);if(value.ok===false)throw new Error(value.error&&value.error.message||"The MCP App request failed.");if(value.ok===true)return normalize(value.data);if(value.isError===true&&Array.isArray(value.content)){const message=value.content.map(item=>item&&item.text).filter(Boolean).join(String.fromCharCode(10));throw new Error(message||"The MCP App request failed.")}if(Array.isArray(value.content)&&value.content[0]&&value.content[0].text){try{return normalize(JSON.parse(value.content[0].text))}catch(_){}}return value}
function enabledFor(id){const item=state[id];return typeof item==="boolean"?item:!!(item&&item.enabled)}
function setStatus(message,error=false){statusEl.className=error?"status error":"status";statusEl.textContent=message||"";scheduleResize()}
function apply(raw){const value=normalize(raw)||{};if(value.apps&&typeof value.apps==="object")state=value.apps;else if(value.target&&value.target!=="all"&&typeof value.enabled==="boolean")state=Object.assign({},state,{[value.target]:Object.assign({},state[value.target]||{},{enabled:value.enabled})});render()}
function render(){const active=catalog.filter(item=>enabledFor(item.id)).length;summaryEl.textContent=active===catalog.length?"Everything on":active+" of "+catalog.length+" on";const busyAll=pending.has("all");appsEl.innerHTML=catalog.map(item=>{const on=enabledFor(item.id),busy=busyAll||pending.has(item.id);return `<article class="app" data-enabled="${on}"><div class="identity"><div class="name-row"><span class="dot"></span><span class="name">${item.title}</span><span class="tool">${item.tool}</span></div><p class="desc">${item.description}</p></div><button class="switch" type="button" role="switch" data-target="${item.id}" aria-label="${on?"Disable ":"Enable "}${item.title}" aria-checked="${on}" ${busy?"disabled":""}></button></article>`}).join("");appsEl.querySelectorAll(".switch").forEach(button=>button.addEventListener("click",onToggle));const busy=pending.size>0;enableAll.disabled=busy;disableAll.disabled=busy;scheduleResize()}
async function refresh(){try{setStatus("");apply(await host.callAction("mcp_app","status",{target:"all"}))}catch(error){setStatus(error&&error.message||"Could not load app state.",true)}}
async function mutate(target,enabled){pending.add(target);render();setStatus(enabled?"Enabling…":"Disabling…");try{apply(await host.callAction("mcp_app",enabled?"enable":"disable",{target}));setStatus("")}catch(error){setStatus(error&&error.message||"Could not change app state.",true)}finally{pending.delete(target);render()}}
function onToggle(event){const target=event.currentTarget.dataset.target;void mutate(target,!enabledFor(target))}
function scheduleResize(){if(disposed||frame!==null)return;frame=requestAnimationFrame(()=>{frame=null;if(!disposed)host.requestResize({height:Math.ceil(document.documentElement.scrollHeight)})})}
const observer=new ResizeObserver(scheduleResize);function dispose(){if(disposed)return;disposed=true;observer.disconnect();enableAll.removeEventListener("click",onEnableAll);disableAll.removeEventListener("click",onDisableAll);window.removeEventListener("pagehide",dispose);if(frame!==null)cancelAnimationFrame(frame)}function onEnableAll(){void mutate("all",true)}function onDisableAll(){void mutate("all",false)}
enableAll.addEventListener("click",onEnableAll);disableAll.addEventListener("click",onDisableAll);observer.observe(shell);window.addEventListener("pagehide",dispose,{once:true});render();void refresh();
})();
</script>
</body>
</html>
