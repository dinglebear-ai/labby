name: team-labby

services:
  labby:
    image: ${LABBY_IMAGE:?set LABBY_IMAGE to an immutable image digest}
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      team-depot:
        condition: service_healthy
      catalog-depot:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LABBY_HOST_PORT:-8765}:8765"
    volumes:
      - ./config.toml:/home/labby/.labby/config.toml:ro
      - ./.env:/home/labby/.labby/.env:ro
      - labby-home:/home/labby/.labby
      - labby-data:/home/labby/.local
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000
    environment:
      LABBY_HOME: /home/labby/.labby
      LABBY_MCP_HTTP_HOST: 0.0.0.0
      LABBY_MCP_HTTP_PORT: "8765"
      RUST_LOG: labby=info,warn
    networks: [backend]
    healthcheck:
      test: [CMD, /usr/local/bin/labby-healthcheck]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}

  team-depot:
    image: ${DEPOT_IMAGE:?set DEPOT_IMAGE to an immutable image digest}
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    env_file: [.env]
    environment:
      DEPOT_PORT: "4100"
      DEPOT_DATA_DIR: /data
      DEPOT_AUTH_MODE: bearer
      DEPOT_DEPLOYMENT_ID: team-depot
      DEPOT_BACKEND_ID: r2
      DEPOT_TENANT_ID: lime-technology
      DEPOT_BLOB_STORE_BACKEND: s3
      DEPOT_S3_PROFILE: r2
      DEPOT_S3_BUCKET: ${DEPOT_R2_BUCKET:?set DEPOT_R2_BUCKET}
      DEPOT_S3_PREFIX: ${TEAM_DEPOT_R2_PREFIX:-team}
      DEPOT_S3_REGION: auto
      DEPOT_S3_R2_ACCOUNT_ID: ${DEPOT_R2_ACCOUNT_ID:?set DEPOT_R2_ACCOUNT_ID}
      DEPOT_S3_ENDPOINT: ${DEPOT_R2_ENDPOINT:?set DEPOT_R2_ENDPOINT}
      DEPOT_S3_ADDRESSING: path
      DEPOT_S3_CREDENTIAL_SOURCE: team-labby-vm-secret
      DEPOT_S3_ACCESS_KEY_ID: ${DEPOT_R2_ACCESS_KEY_ID:?set DEPOT_R2_ACCESS_KEY_ID}
      DEPOT_S3_SECRET_ACCESS_KEY: ${DEPOT_R2_SECRET_ACCESS_KEY:?set DEPOT_R2_SECRET_ACCESS_KEY}
      DEPOT_S3_CONCURRENCY: ${DEPOT_S3_CONCURRENCY:-32}
    volumes:
      - team-depot-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1g,uid=1000,gid=1000
    networks: [backend]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --max-time, "5", http://127.0.0.1:4100/health]
      interval: 30s
      timeout: 6s
      start_period: 10m
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}

  catalog-depot:
    image: ${DEPOT_IMAGE:?set DEPOT_IMAGE to an immutable image digest}
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    env_file: [.env]
    environment:
      DEPOT_PORT: "4100"
      DEPOT_DATA_DIR: /data
      DEPOT_AUTH_MODE: bearer
      DEPOT_DEPLOYMENT_ID: catalog-depot
      DEPOT_BACKEND_ID: r2
      DEPOT_TENANT_ID: public-catalog
      DEPOT_BLOB_STORE_BACKEND: s3
      DEPOT_S3_PROFILE: r2
      DEPOT_S3_BUCKET: ${DEPOT_R2_BUCKET:?set DEPOT_R2_BUCKET}
      DEPOT_S3_PREFIX: ${CATALOG_DEPOT_R2_PREFIX:-catalog}
      DEPOT_S3_REGION: auto
      DEPOT_S3_R2_ACCOUNT_ID: ${DEPOT_R2_ACCOUNT_ID:?set DEPOT_R2_ACCOUNT_ID}
      DEPOT_S3_ENDPOINT: ${DEPOT_R2_ENDPOINT:?set DEPOT_R2_ENDPOINT}
      DEPOT_S3_ADDRESSING: path
      DEPOT_S3_CREDENTIAL_SOURCE: team-labby-vm-secret
      DEPOT_S3_ACCESS_KEY_ID: ${DEPOT_R2_ACCESS_KEY_ID:?set DEPOT_R2_ACCESS_KEY_ID}
      DEPOT_S3_SECRET_ACCESS_KEY: ${DEPOT_R2_SECRET_ACCESS_KEY:?set DEPOT_R2_SECRET_ACCESS_KEY}
      DEPOT_S3_CONCURRENCY: ${DEPOT_S3_CONCURRENCY:-32}
    volumes:
      - catalog-depot-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1g,uid=1000,gid=1000
    networks: [backend]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --max-time, "5", http://127.0.0.1:4100/health]
      interval: 30s
      timeout: 6s
      start_period: 30m
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}

volumes:
  labby-home: {}
  labby-data: {}
  team-depot-data: {}
  catalog-depot-data: {}

networks:
  # No Depot port is published. This ordinary bridge still permits outbound R2
  # and notification-worker traffic; an `internal` network would block it.
  backend: {}
