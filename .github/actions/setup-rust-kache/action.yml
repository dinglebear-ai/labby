name: Setup Rust with shared Kache
description: Install Rust and connect fast Linux jobs to the fleet MinIO cache.

inputs:
  toolchain:
    description: Rust toolchain to install.
    required: false
    default: "1.97.1"
  components:
    description: Comma-separated Rust components to install.
    required: false
    default: ""
  targets:
    description: Comma-separated Rust targets to install.
    required: false
    default: ""
  enable-cache:
    description: Enable the shared MinIO-backed Kache wrapper.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Linux build prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        # Toolchain prerequisites shared by every Rust job. Deliberately no GTK,
        # WebKit, or other Tauri/GUI packages: this action runs on 16 jobs and
        # only one of them (Palette Tauri (Linux)) builds a GUI, and that job
        # installs its own desktop dependencies. Requiring them here made the
        # action non-portable across the runner images behind a single pool
        # label — `libwebkit2gtk-4.1-dev` does not exist on Ubuntu focal, so
        # any job that landed on a focal runner died in setup, before it
        # compiled a line of code. Tauri v2 needs 4.1 specifically, so a 4.0
        # fallback here would have installed the wrong library rather than
        # fixing anything.
        packages="build-essential lld pkg-config libssl-dev libdbus-1-dev"
        need_install=false
        command -v cc >/dev/null 2>&1 || need_install=true
        command -v ld.lld >/dev/null 2>&1 || need_install=true
        command -v pkg-config >/dev/null 2>&1 || need_install=true
        pkg-config --exists openssl 2>/dev/null || need_install=true
        pkg-config --exists dbus-1 2>/dev/null || need_install=true
        if [ "$need_install" = false ]; then
          exit 0
        fi
        if [ "$(id -u)" = "0" ]; then
          apt-get update
          # shellcheck disable=SC2086
          apt-get install -y $packages
        else
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y $packages
        fi

    - name: Select writable Rust homes
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
        cargo_home="${CARGO_HOME:-$HOME/.cargo}"
        if ! mkdir -p "$rustup_home" 2>/dev/null || [ ! -w "$rustup_home" ]; then
          rustup_home="$RUNNER_TEMP/rustup"
          mkdir -p "$rustup_home"
        fi
        if ! mkdir -p "$cargo_home" 2>/dev/null || [ ! -w "$cargo_home" ]; then
          cargo_home="$RUNNER_TEMP/cargo"
          mkdir -p "$cargo_home"
        fi
        {
          echo "RUSTUP_HOME=$rustup_home"
          echo "CARGO_HOME=$cargo_home"
        } >> "$GITHUB_ENV"
        echo "$cargo_home/bin" >> "$GITHUB_PATH"

    - name: Install Rust
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Detect persistent host Kache
      id: kache-host
      if: inputs.enable-cache == 'true' && runner.os == 'Linux'
      shell: bash
      run: "$GITHUB_ACTION_PATH/detect-persistent-host.sh"

    - name: Reuse persistent host Kache
      if: >-
        inputs.enable-cache == 'true' &&
        runner.os == 'Linux' &&
        steps.kache-host.outputs.managed == 'true'
      shell: bash
      run: |
        set -euo pipefail
        binary="${{ steps.kache-host.outputs.binary }}"
        [ -x "$binary" ]
        {
          echo "RUSTC_WRAPPER=$binary"
          echo "CARGO_BUILD_RUSTC_WRAPPER=$binary"
        } >> "$GITHUB_ENV"
        status="$("$binary" daemon status 2>&1)"
        grep -q "Daemon:" <<<"$status"
        ! grep -q "not running" <<<"$status"
        stats="$("$binary" stats 2>&1)"
        grep -Eq '^Remote:[[:space:]]+s3://kache/rust$' <<<"$stats"
        # Every writer to the shared prefix must agree on how cache keys are
        # computed. kache 0.13.0 fixed a key-soundness hole (env vars a proc
        # macro reads during expansion were unkeyed, so a byte-identical
        # command line could restore a stale expansion). A host still on an
        # older kache would write into the same bucket under the old key
        # regime, so refuse to reuse it rather than fail open into a
        # silently-wrong hit.
        host_version="$("$binary" --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
        echo "Persistent host kache version: $host_version"
        case "$host_version" in
          0.1[3-9].*|0.[2-9][0-9].*|[1-9]*)
            ;;
          *)
            echo "::error::persistent host kache $host_version predates the 0.13.0 cache-key fix; refusing to share the s3://kache/rust prefix" >&2
            exit 1
            ;;
        esac

    - name: Check action tool cache writability
      id: tool-cache
      if: >-
        inputs.enable-cache == 'true' &&
        runner.os == 'Linux' &&
        steps.kache-host.outputs.managed != 'true' &&
        env.KACHE_S3_ACCESS_KEY != '' &&
        env.KACHE_S3_SECRET_KEY != ''
      shell: bash
      run: |
        set -euo pipefail
        writable_kache_root() {
          local root="$1"
          local probe="$root/kache/.labby-write-probe-$$"
          mkdir -p "$root/kache" 2>/dev/null || return 1
          mkdir "$probe" 2>/dev/null || return 1
          rmdir "$probe"
        }

        tool_cache="${RUNNER_TOOL_CACHE:-}"
        usable=false
        if [ -n "$tool_cache" ] && writable_kache_root "$tool_cache"; then
          usable=true
        fi
        echo "usable=$usable" >> "$GITHUB_OUTPUT"

    - name: Connect shared MinIO Kache
      if: >-
        inputs.enable-cache == 'true' &&
        runner.os == 'Linux' &&
        steps.kache-host.outputs.managed != 'true' &&
        steps.tool-cache.outputs.usable == 'true' &&
        env.KACHE_S3_ACCESS_KEY != '' &&
        env.KACHE_S3_SECRET_KEY != ''
      uses: kunobi-ninja/kache-action@a257c055543c2840700a9bbca8f9c3094a421b1b
      with:
        version: "0.15.1"
        s3-bucket: ${{ env.KACHE_S3_BUCKET || 'kache' }}
        s3-region: us-east-1
        s3-prefix: ${{ env.KACHE_S3_PREFIX || 'rust' }}
        # No literal fallback: this repository is public. The endpoint lives in
        # the org variable KACHE_S3_ENDPOINT, which every calling workflow puts
        # on `env`. If it were ever empty this step is already skipped, because
        # its `if` requires the S3 credentials that accompany it.
        s3-endpoint: ${{ env.KACHE_S3_ENDPOINT }}
        s3-access-key-id: ${{ env.KACHE_S3_ACCESS_KEY }}
        s3-secret-access-key: ${{ env.KACHE_S3_SECRET_KEY }}
        manifest-key: labby-fast-rust
        namespace: labby-fast-rust
        warm: "true"
        sync: "false"
        pr-comment: "false"

    - name: Verify action-managed Kache remote
      id: kache-action-health
      if: >-
        inputs.enable-cache == 'true' &&
        runner.os == 'Linux' &&
        steps.kache-host.outputs.managed != 'true' &&
        steps.tool-cache.outputs.usable == 'true' &&
        env.KACHE_S3_ACCESS_KEY != '' &&
        env.KACHE_S3_SECRET_KEY != ''
      shell: bash
      run: |
        set -euo pipefail
        bucket="${KACHE_S3_BUCKET:-kache}"
        prefix="${KACHE_S3_PREFIX:-rust}"
        expected_remote="s3://$bucket/$prefix"
        remote_matches() {
          awk -v expected="$expected_remote" \
            '$1 == "Remote:" && $2 == expected && NF == 2 { found = 1 } END { exit !found }'
        }
        stats="$(kache stats 2>&1 || true)"
        printf '%s\n' "$stats"
        if remote_matches <<<"$stats"; then
          echo "usable=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # kache-action can attach to a daemon left behind by an earlier job.
        # The daemon's watched configuration wins over the current process
        # configuration, so a stale daemon with no remote makes every rustc
        # invocation fail even though action setup itself succeeded. Restart
        # once so the daemon inherits this job's validated S3 configuration.
        echo "::warning::Kache daemon is not connected to $expected_remote; restarting it"
        kache daemon restart || true
        for _attempt in {1..10}; do
          sleep 1
          stats="$(kache stats 2>&1 || true)"
          if remote_matches <<<"$stats"; then
            printf '%s\n' "$stats"
            echo "usable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done

        # Cache is an optimization. If repair did not converge, fail open to
        # bare Cargo for this job and let the GitHub Actions cache provide a
        # safe fallback.
        printf '%s\n' "$stats"
        echo "::warning::Kache daemon still is not connected to $expected_remote; using bare Cargo"
        {
          echo "RUSTC_WRAPPER="
          echo "CARGO_BUILD_RUSTC_WRAPPER="
        } >> "$GITHUB_ENV"
        echo "usable=false" >> "$GITHUB_OUTPUT"

    # Fork PRs (and any run without shared MinIO credentials) get the GitHub
    # Actions cache instead of building fully cold. Trusted paths above are
    # untouched: this step only fires when kache cannot be used.
    - name: Restore GitHub Actions Cargo cache without shared credentials
      if: >-
        inputs.enable-cache == 'true' &&
        runner.os == 'Linux' &&
        steps.kache-host.outputs.managed != 'true' &&
        (
          env.KACHE_S3_ACCESS_KEY == '' ||
          env.KACHE_S3_SECRET_KEY == '' ||
          steps.tool-cache.outputs.usable != 'true' ||
          steps.kache-action-health.outputs.usable == 'false'
        )
      uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      with:
        shared-key: labby-credentialless-fallback
        cache-on-failure: true

    - name: Use bare Cargo when shared credentials are unavailable
      if: >-
        inputs.enable-cache != 'true' ||
        runner.os != 'Linux' ||
        (
          steps.kache-host.outputs.managed != 'true' &&
          (
            env.KACHE_S3_ACCESS_KEY == '' ||
            env.KACHE_S3_SECRET_KEY == '' ||
            steps.tool-cache.outputs.usable != 'true' ||
            steps.kache-action-health.outputs.usable == 'false'
          )
        )
      shell: bash
      run: |
        {
          echo "RUSTC_WRAPPER="
          echo "CARGO_BUILD_RUSTC_WRAPPER="
        } >> "$GITHUB_ENV"

    - name: Print cache evidence
      if: >-
        inputs.enable-cache == 'true' &&
        runner.os == 'Linux' &&
        (
          steps.kache-host.outputs.managed == 'true' ||
          (
            env.KACHE_S3_ACCESS_KEY != '' &&
            env.KACHE_S3_SECRET_KEY != '' &&
            steps.tool-cache.outputs.usable == 'true' &&
            steps.kache-action-health.outputs.usable == 'true'
          )
        )
      shell: bash
      run: |
        kache --version
        kache stats || true
