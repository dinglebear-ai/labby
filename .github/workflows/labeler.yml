name: Pull request labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    uses: dinglebear-ai/workflows/.github/workflows/repository-labeler.yml@b2813662ca27ca8868752fb353d9dd568f2f97f9
    with:
      configuration-path: .github/labeler.yml
      sync-labels: true
