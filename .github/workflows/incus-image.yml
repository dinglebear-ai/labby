name: Incus image

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/incus-image.yml'
      - '.github/workflows/build-incus-image.yml'
      - '.config/incus/**'
      - 'scripts/incus-bootstrap.sh'
      - 'scripts/ci/build-incus-image.sh'
      - 'scripts/ci/smoke-incus-image.sh'
      - 'scripts/ci/create-incus-image-manifest.py'
      - 'scripts/ci/verify-incus-image-manifest.py'
      - 'scripts/ci/promote-incus-pointer.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/incus-image.yml'
      - '.github/workflows/build-incus-image.yml'
      - '.config/incus/**'
      - 'scripts/incus-bootstrap.sh'
      - 'scripts/ci/build-incus-image.sh'
      - 'scripts/ci/smoke-incus-image.sh'
      - 'scripts/ci/create-incus-image-manifest.py'
      - 'scripts/ci/verify-incus-image-manifest.py'
      - 'scripts/ci/promote-incus-pointer.sh'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Image channel; stable requires an explicit selection'
        type: choice
        default: dev
        options: [dev, stable]

concurrency:
  group: incus-image-${{ github.ref }}
  # Superseded PR builds are wasteful; main publication must complete or roll back.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    name: Build and smoke Incus substrate
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-incus-image.yml
    with:
      source_ref: ${{ github.sha }}
      release_tag: ${{ inputs.channel == 'stable' && format('incus-{0}', github.sha) || format('incus-dev-{0}', github.sha) }}
      channel: ${{ inputs.channel || 'dev' }}
      publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
