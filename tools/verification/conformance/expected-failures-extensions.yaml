# Known failures for optional extension scenarios in
# @modelcontextprotocol/conformance 0.2.0-alpha.10.
#
# Extensions are excluded from the 2026-07-28 dated-protocol score. CI runs
# them separately with this strict baseline:
# - an unlisted failure fails the build
# - a listed scenario that starts passing fails as a stale entry
#
# The stock RMCP conformance client is pinned by upstream-baseline.json
# (currently 3.3.0). These expectations describe optional outbound authorization
# extensions of that fixture, not Labby's inbound authorization server, which
# has separate product-level coverage. A new fixture pin requires a full
# conformance run before changing these expectations.
server: []

client:
  - auth/enterprise-managed-authorization
  - auth/dpop
  - auth/dpop-nonce
  - auth/wif-jwt-bearer
