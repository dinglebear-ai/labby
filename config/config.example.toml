# Lab configuration — preferences only, no secrets.
#
# Copy to $LABBY_HOME/config.toml and uncomment sections as needed. LABBY_HOME
# must be absolute and defaults to ~/.labby. Labby does not implicitly read a
# working-directory or XDG fallback config.
#
# Docker: set LABBY_CONFIG_DIR to the directory containing config.toml; Compose
# mounts that directory read-only at /home/labby/.config/labby.
#
# Secrets (API keys, tokens, passwords, URLs) belong in $LABBY_HOME/.env
# (normally ~/.labby/.env).
# Everything else belongs here. Only settings with a documented environment
# alias can be overridden that way; proxy preferences intentionally do not
# invent one-to-one aliases. Where an alias exists, env wins over config.toml.
#
# Configuration authority:
#   $LABBY_HOME/config.toml (normally ~/.labby/config.toml)
#
# Value precedence (highest wins):
#   1. CLI flags
#   2. Environment variables (including those loaded from $LABBY_HOME/.env)
#   3. $LABBY_HOME/config.toml
#   4. Built-in defaults

# ── Output ───────────────────────────────────────────────────────────────────

[output]
# Default output format for CLI commands: "human" or "json".
# Override per-command with --json.
# format = "human"                       # default: "human"

# ── Logging ──────────────────────────────────────────────────────────────────

[log]
# Tracing filter directive.
# Override with LABBY_LOG env var.
# filter = "lab=info,lab_apis=warn"       # default: "lab=info,lab_apis=warn"

# Log output format: "text" or "json".
# Override with LABBY_LOG_FORMAT env var.
# format = "text"                         # default: "text"

# ── MCP Server ───────────────────────────────────────────────────────────────

[mcp]
# Default transport: "stdio" or "http".
# Override with --transport or LABBY_MCP_TRANSPORT.
# transport = "stdio"                     # default: "stdio"

# Bind address for the HTTP transport.
# Override with --host or LABBY_MCP_HTTP_HOST.
# host = "127.0.0.1"                      # default: "127.0.0.1"

# Port for the HTTP transport.
# Override with --port or LABBY_MCP_HTTP_PORT.
# port = 8765                             # default: 8765

# Additional allowed hosts for DNS rebinding protection.
# Override with LABBY_MCP_ALLOWED_HOSTS env var (comma-separated).
# allowed_hosts = []                      # default: []

# ── Direct stdio MCP proxy ──────────────────────────────────────────────────

[proxy]
# Publish through one owned Tailscale Serve HTTPS port, or keep loopback-only.
# exposure = "tailscale"                  # tailscale | local

# tailnet uses Tailscale reachability/grants without an application token.
# auth = "tailnet"                        # tailnet | bearer | oauth | none
# path = "/mcp"                           # absolute, non-root, no query/fragment
# port = "random"                         # random or fixed integer
# port_range_start = 49152
# port_range_end = 65535

# The secret value belongs in ~/.labby/.env, never here.
# bearer_token_env = "LABBY_PROXY_BEARER_TOKEN"
# oauth_scopes = ["mcp:read", "mcp:write"]

# Ambient child variables beyond the runtime-essential scrubbed allowlist.
# inherit_env = []
# shutdown_grace_ms = 3000                 # valid range: 1..=60000

# ── HTTP API ─────────────────────────────────────────────────────────────────

[api]
# Additional CORS origins beyond the built-in loopback defaults.
# Loopback origins (localhost, 127.0.0.1, [::1]) are always included.
# Override with LABBY_CORS_ORIGINS env var (comma-separated).
# cors_origins = []                       # default: [] (loopback only)

# Example:
# cors_origins = [
#   "https://lab.example.com",
#   "http://192.168.1.100:3000",        # standalone Next dev server (development only)
# ]

# ── Web UI ───────────────────────────────────────────────────────────────────

[web]
# Path to the exported Labby assets directory served by `labby serve --transport http`.
# Override with LABBY_WEB_ASSETS_DIR.
# If unset, `labby serve` auto-detects the repo-local fallback at apps/gateway-admin/out.
# assets_dir = "/srv/labby/out"

# Local development only: bypass /v1/* browser authentication only while the
# server is bound directly to a loopback address. This must not be used on a
# network-reachable deployment or behind a reverse proxy, even if that proxy
# performs its own authentication.
# Override with LABBY_WEB_UI_AUTH_DISABLED=true.
# disable_auth = false                    # default: false

# ── Workspace ────────────────────────────────────────────────────────────────

[workspace]
# Root directory for the supported filesystem browser.
# No env var override; config-file only.
# root = "~/.labby/workspace"              # default: ~/.labby/workspace

# ── Gateway Spawn Guard ───────────────────────────────────────────────────────
#
# The gateway only allows known-safe runtimes and transports (npx, uvx, docker,
# node, bun, python, python3, deno, pipx, dnx, ssh) as the `command` of a stdio
# upstream. Use these knobs when you have custom binaries or want to disable
# the guard entirely.

[gateway]
# Additional commands to allow beyond the built-in runtime list.
# Each entry is matched against the basename of the upstream `command`.
# extra_stdio_commands = ["labby", "myserver", "runarr"]  # default: []

# Skip the allowlist entirely. Operator takes full responsibility for
# any command that appears in the gateway config.
# disable_spawn_guard = false                             # default: false

# ── Local Log Store ───────────────────────────────────────────────────────────

[local_logs]
# Override with LABBY_LOCAL_LOGS_STORE_PATH env var.
# store_path = "~/.labby/logs.db"

# Override with LABBY_LOCAL_LOGS_RETENTION_DAYS env var.
# retention_days = 7                     # default: 7

# Override with LABBY_LOCAL_LOGS_MAX_BYTES env var.
# max_bytes = 268435456                  # default: 256 MiB

# Override with LABBY_LOCAL_LOGS_QUEUE_CAPACITY env var.
# queue_capacity = 1024                  # default: 1024

# Override with LABBY_LOCAL_LOGS_SUBSCRIBER_CAPACITY env var.
# subscriber_capacity = 256              # default: 256

# ── Gateway Code Mode ──────────────────────────────────────────────────────

[code_mode]
# Preferences for the gateway `codemode` sandbox.
# These are product knobs, not secrets/URLs/runtime-discovery values, so keep
# them here rather than in .env.
# enabled = false                         # default: false; advertises `codemode`
# mcp_ui_enabled = false                  # default: false; opt in to `codemode_ui` and its app resources
# trace_params = true                     # default: true; stores only redacted/capped call params in traces/history
# `codemode` runs a JS async arrow function in the Javy/QuickJS sandbox with
# in-sandbox discovery (`codemode.search()` / `codemode.describe()`), raw
# `callTool(id, params)`, and typed `codemode.<upstream>.<tool>(params)`
# helpers generated from connected servers' inputSchemas.
# timeout_ms = 30000                        # valid range: 1..=60000  (wall-clock budget)
# max_source_bytes = 131072                 # valid range: 1024..=1048576  (JavaScript source)
# max_response_bytes = 24576                # valid range: 1024..=1048576
# max_response_tokens = 6000                # valid range: 256..=256000
# token_estimate_divisor = 4                # valid range: 1..=64  (lower is more conservative)
# max_log_entries = 1000                    # valid range: 1..=100000
# max_log_bytes = 65536                     # valid range: 1..=104857600

# ── Labby-owned MCP Apps ───────────────────────────────────────────────────

[mcp_apps]
# Gateway-wide visibility switches for Labby-owned app surfaces other than the
# always-available `mcp_app` control tool. Disabling a surface removes its app
# advertisement and UI resources; the underlying text/service capability remains
# available where one exists. The control tool remains text-only when its own UI
# is disabled. The Code Mode inspector keeps its legacy switch above.
# manager = false                           # default: false; opt in to the switchboard UI
# add_server = false                        # default: false; opt in when the app is ready for your deployment
# server_logs = false                       # default: false; underlying service tool remains available
# gateway_status = false                    # default: false
# settings = false                          # default: false

# ── Code Mode `openapi` provider ─────────────────────────────────────────────
#
# Turn an operator-configured OpenAPI spec into locally-dispatched Code Mode
# operations callable as `openapi.call(label, operationId, params)`. Each spec is
# fetched + parsed once at `labby serve` startup; only admin+unscoped Code Mode
# callers can use it, and only the operations you explicitly allow-list are
# dispatchable (deny-by-default). Outbound HTTP is SSRF-hardened (https-only,
# redirects off, private/loopback/CGNAT addresses rejected). Credentials are NOT
# set here — they live in .env as OPENAPI_<LABEL>_TOKEN / OPENAPI_<LABEL>_API_KEY.
#
# [[openapi.specs]]
# label = "petstore"                        # [A-Za-z0-9_-] only (no '.', ':', or spaces)
# base_url = "https://api.example.com/v3"   # MANDATORY — rmcp-openapi never reads the spec's servers[]
# spec_url = "https://api.example.com/v3/openapi.json"   # OR: spec_path = "/etc/labby/specs/api.json"
# allowed_operations = ["findPetsByStatus", "getPetById"]   # deny-by-default; empty = nothing dispatchable
# api_key_header = "X-API-Key"              # optional; header name for an OPENAPI_<LABEL>_API_KEY credential

# ── Shared Google Credential Broker ───────────────────────────────────────────
#
# OAuth upstreams default to a dedicated encrypted token bundle per upstream.
# Compatible Google Workspace MCP servers can instead reuse Labby's central,
# subject-scoped Google provider credential. The preregistered client_id MUST be
# the same Google OAuth client that owns the provider refresh token.
#
# [[upstream]]
# name = "google-calendar"
# url = "https://calendarmcp.googleapis.com/mcp/v1"
#
# [upstream.oauth]
# mode = "authorization_code_pkce"
# scopes = [
#   "https://www.googleapis.com/auth/calendar.calendarlist.readonly",
#   "https://www.googleapis.com/auth/calendar.events.freebusy",
#   "https://www.googleapis.com/auth/calendar.events.readonly",
# ]
#
# [upstream.oauth.credential]
# source = "google_provider"              # default: dedicated
# account = "admin@example.com"           # Google sub or verified email; omit only with one account
#
# [upstream.oauth.registration]
# strategy = "preregistered"
# client_id = "your-google-oauth-client-id"
# client_secret_env = "LABBY_GOOGLE_CLIENT_SECRET"
#
# Shared mode also requires the auth provider token key in ~/.labby/.env:
#   LABBY_TOKEN_ENCRYPTION_KEY=<64 hex digits or 43 base64url characters>
# Reusable labby-auth consumers substitute their configured environment prefix.
#
# See docs/design/GOOGLE_CREDENTIAL_BROKER.md for schemas, security constraints,
# scope profiles, migration, rollout, and explicit revocation.

# ── OAuth Relay Machines ─────────────────────────────────────────────────────

# Full callback base URL for a named remote OAuth listener.
# [oauth.machines.workstation]
# target_url = "http://100.64.0.10:38935/callback/workstation"
# description = "Workstation OAuth callback target"
# default_port = 38935

# ── Auth ─────────────────────────────────────────────────────────────────────

[auth]
# HTTP auth mode: "bearer" or "oauth".
# Override with LABBY_AUTH_MODE.
# mode = "bearer"                         # default: "bearer"

# Public URL used for OAuth metadata, callbacks, and JWT issuer/audience.
# Often kept in ~/.labby/.env alongside other URLs.
# Override with LABBY_PUBLIC_URL.
# public_url = "https://lab.example.com"

# Optional path override for the auth SQLite database.
# Override with LABBY_AUTH_SQLITE_PATH.
# sqlite_path = "/var/lib/labby/auth.db"    # default: ~/.labby/auth.db

# Optional path override for the JWT signing key.
# Override with LABBY_AUTH_KEY_PATH.
# key_path = "/var/lib/labby/auth-jwt.pem"  # default: ~/.labby/auth-jwt.pem

# Google credentials are usually kept in ~/.labby/.env:
#   LABBY_GOOGLE_CLIENT_ID
#   LABBY_GOOGLE_CLIENT_SECRET

# Optional Google callback path override.
# Override with LABBY_GOOGLE_CALLBACK_PATH.
# google_callback_path = "/auth/google/callback"

# Optional redirect URI patterns for non-loopback MCP OAuth callbacks.
# Override with LABBY_AUTH_ALLOWED_REDIRECT_URIS.
# allowed_client_redirect_uris = ["https://callback.example.com/callback/*"]

# Optional Google scopes override.
# Override with LABBY_GOOGLE_SCOPES.
# google_scopes = ["openid", "email", "profile"]

# Optional token/code lifetime overrides (seconds).
# Override with LABBY_AUTH_ACCESS_TOKEN_TTL_SECS / LABBY_AUTH_REFRESH_TOKEN_TTL_SECS / LABBY_AUTH_CODE_TTL_SECS.
# access_token_ttl_secs = 3600
# refresh_token_ttl_secs = 2592000
# auth_code_ttl_secs = 300

# ── Admin ────────────────────────────────────────────────────────────────────

[admin]
# Enable the lab_admin MCP tool (onboarding audit).
# Override with LABBY_ADMIN_ENABLED=1 env var.
# enabled = false                         # default: false

# ── Per-Service Preferences ──────────────────────────────────────────────────

[services]
# Runtime exposure switch for compiled built-in upstream API integrations.
# Currently retained for compatibility; this checkout does not ship the older
# first-party upstream integration features.
# built_in_upstream_apis_enabled = true    # default: true

# ── Setup / Provision Preferences ────────────────────────────────────────────

[setup]
# Operator toggles for `labby setup --provision`. These install optional
# capabilities on demand — they are NOT baked into the Incus image to keep it
# slim. Either this table or the matching env var enables a step.

# Install android-sdk during provision. Only needed by the claude-in-mobile MCP
# server (it pulls ~300 MiB of JVM + java deps that the gateway core does not
# use). Default: false.
# Override: LABBY_ENABLE_ANDROID_SDK=1
# install_android_sdk = false               # default: false

# ── Secrets (env-only) ───────────────────────────────────────────────────────
#
# Optional exact-revision Depot source for durable Skill Library imports.
# The endpoint is the authenticated public edge; Labby writes verified bytes
# beneath $LABBY_HOME/artifacts and does not depend on Depot after import.
# Resolve and pin every currently accepted public edge address before rollout.
#
# [[skill_library.sources]]
# id = "unraid-team-depot"
# kind = "depot"
# endpoint = "https://depot.example.invalid/artifacts/acquire"
# pinned_addresses = ["203.0.113.10", "2001:db8::10"]
# bearer_token_env = "UNRAID_TEAM_DEPOT_TOKEN"
#
# These MUST be set via environment variables (in ~/.labby/.env), not here:
#
#   LABBY_MCP_HTTP_TOKEN — bearer token for HTTP transport (required in bearer mode)
#   *_URL              — service base URLs
#   *_API_KEY          — service API keys
#   *_TOKEN            — service auth tokens
#   *_USERNAME         — service usernames
#   *_PASSWORD         — service passwords
