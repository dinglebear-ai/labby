<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Labby Skill Library</title>
<style>
:root{color-scheme:dark;--bg:#07131c;--panel:#13293a;--border:#1d3d4e;--text:#e6f4fb;--muted:#a7bcc9;--accent:#29b6f6;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--text)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);padding:18px}.shell{display:grid;gap:14px;max-width:720px;margin:auto}.card{border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:16px}h1{font-size:19px;margin:0 0 6px}.muted{color:var(--muted);font-size:13px;line-height:1.45}.status{margin-top:12px;color:var(--accent);font-size:12px}
</style>
</head>
<body>
<main class="shell">
  <section class="card">
    <h1>Skill Library</h1>
    <div class="muted">Create, review, and activate Labby-managed Skills. This protocol shell delegates every action to the authenticated Labby host.</div>
    <div class="status" id="status">Ready</div>
  </section>
</main>
<script src="/apps/assets/labby-app-host.js"></script>
<script>
window.__LABBY_APP_INFO={name:"LabbySkillLibrary",version:"1.0.0"};
const status=document.getElementById("status");
status.textContent=window.LabbyAppHost.hasBridge()?"Connected to host":"Text fallback; use the skills tool actions";
</script>
</body>
</html>
