name: Release

on:
  # Release Please creates the immutable tag and a draft release. Qualification
  # starts from the tag; the draft becomes public only in the final promotion.
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  KACHE_S3_ACCESS_KEY: ""
  KACHE_S3_SECRET_KEY: ""
  KACHE_S3_ENDPOINT: ${{ vars.KACHE_S3_ENDPOINT }}
  KACHE_S3_BUCKET: ${{ vars.KACHE_S3_BUCKET }}
  KACHE_S3_PREFIX: ${{ vars.KACHE_S3_PREFIX }}
  # Release jobs must not inherit a host-level compiler wrapper. Cache-enabled
  # jobs configure kache explicitly through setup-rust-kache (mirrors ci.yml).
  RUSTC_WRAPPER: ""
  CARGO_BUILD_RUSTC_WRAPPER: ""
jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      # The validation below shells out to Node and npm for version lockstep
      # plus launcher test/check/pack smoke, so install Node explicitly on the
      # hosted release runner.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Validate release tag, ancestry, and version lockstep
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release tag must be stable SemVer vMAJOR.MINOR.PATCH"
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::tag commit is not reachable from origin/main"
            exit 1
          }
          expected="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n '/^\[workspace.package\]$/,/^\[/s/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          npm_version="$(node -p "require('./packages/labby-mcp/package.json').version")"
          registry_version="$(python3 -c "import json; print(json.load(open('server.json'))['version'])")"
          manifest_version="$(python3 -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")"
          desktop_package_version="$(node -p "require('./apps/labby-desktop/package.json').version")"
          desktop_tauri_version="$(node -p "require('./apps/labby-desktop/src-tauri/tauri.conf.json').version")"
          desktop_cargo_version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' apps/labby-desktop/src-tauri/Cargo.toml | head -1)"
          for pair in "Cargo.toml:$cargo_version" "package.json:$npm_version" "server.json:$registry_version" "release manifest:$manifest_version" "desktop package:$desktop_package_version" "desktop tauri:$desktop_tauri_version" "desktop cargo:$desktop_cargo_version"; do
            [[ "${pair#*:}" == "$expected" ]] || { echo "::error::${pair%%:*} version ${pair#*:} != $expected"; exit 1; }
          done
          npm test --prefix packages/labby-mcp
          npm run check --prefix packages/labby-mcp
          npm pack --dry-run --json ./packages/labby-mcp >/dev/null
      - name: Validate publication credentials before building
        env:
          NPM_TOKEN_PRESENT: ${{ secrets.NPM_TOKEN != '' }}
          MCP_PRIVATE_KEY_PRESENT: ${{ secrets.MCP_PRIVATE_KEY != '' }}
        run: |
          test "$NPM_TOKEN_PRESENT" = true || { echo '::error::NPM_TOKEN is not configured'; exit 1; }
          test "$MCP_PRIVATE_KEY_PRESENT" = true || { echo '::error::MCP_PRIVATE_KEY is not configured'; exit 1; }
      - name: Validate npm publication identity before building
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami >/dev/null
      - name: Resolve N-1 baselines before building
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          releases="$RUNNER_TEMP/labby-releases.json"
          merged="$RUNNER_TEMP/labby-merged-tags.txt"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" >"$releases"
          git tag --merged HEAD 'v*' >"$merged"
          for archive in lab-x86_64-unknown-linux-gnu.tar.gz lab-aarch64-apple-darwin.tar.gz; do
            python3 scripts/ci/resolve-n-minus-one-baseline.py \
              --candidate "$GITHUB_REF_NAME" --releases "$releases" --merged-tags "$merged" \
              --asset "$archive" --asset "$archive.sha256"
          done

  frontend-assets:
    name: Frontend assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: preflight
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-gateway-admin
      - name: Upload gateway-admin export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 90
    needs: frontend-assets
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: '"ubuntu-24.04"'
            binary: labby
            archive: lab-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-apple-darwin
            runner: '"macos-15"'
            binary: labby
            archive: lab-aarch64-apple-darwin.tar.gz
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
        with:
          targets: ${{ matrix.target }}

      - name: Build natively
        # CI checks every workspace member. The release archives contain only
        # the product CLI, so avoid compiling unrelated workspace binaries and
        # fixture executables on each native release runner.
        run: cargo build --package labby --bin labby --all-features --locked --release --target ${{ matrix.target }}

      - name: Package artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"
          tar -C dist -czf "${{ matrix.archive }}" "${{ matrix.binary }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          else
            shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          fi

      - name: Smoke packaged Code Mode runner
        env:
          # This is a one-shot CLI smoke. Do not leave a warm runner parked
          # while the workflow shell waits for the packaged process to exit.
          LABBY_CODE_MODE_POOL_SIZE: "0"
        run: |
          set -euo pipefail
          ./dist/${{ matrix.binary }} --json code run \
            --code 'async () => ({ ok: true, sum: 1 + 1 })' \
            | grep -q '"sum":2'
          ./dist/${{ matrix.binary }} skill --help \
            | grep -q 'Read locally visible skills'

      - name: Attest exact platform candidate archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lab-${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error

  upgrade-qualification:
    name: N-1 stateful upgrade and rollback qualification (${{ matrix.deployment }})
    needs: [build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - deployment: unix
            runner: ubuntu-24.04
            artifact: lab-x86_64-unknown-linux-gnu
            archive: lab-x86_64-unknown-linux-gnu.tar.gz
            binary: labby
          - deployment: macos
            runner: macos-15
            artifact: lab-aarch64-apple-darwin
            archive: lab-aarch64-apple-darwin.tar.gz
            binary: labby
          - deployment: incus
            runner: ubuntu-24.04
            artifact: lab-x86_64-unknown-linux-gnu
            archive: lab-x86_64-unknown-linux-gnu.tar.gz
            binary: labby
          - deployment: host-service
            runner: ubuntu-24.04
            artifact: lab-x86_64-unknown-linux-gnu
            archive: lab-x86_64-unknown-linux-gnu.tar.gz
            binary: labby
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact tested candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ matrix.artifact }}
          path: candidate-archive
      - name: Verify exact archive provenance before extraction
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/candidate-archive/${{ matrix.archive }}"
          sidecar="$archive.sha256"
          scripts/ci/verify-release-provenance.sh \
            --repo "$GITHUB_REPOSITORY" --workflow release.yml \
            --ref "$GITHUB_REF" --artifact "$archive"
          expected=$(awk '{print $1}' "$sidecar")
          # Hash stdin: GNU sha256sum prefixes the digest with "\" when the
          # path contains a backslash, which every Windows workspace path does.
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum <"$archive" | awk '{print $1}')
          else
            actual=$(shasum -a 256 <"$archive" | awk '{print $1}')
          fi
          [[ "$expected" =~ ^[0-9a-f]{64}$ && "$actual" == "$expected" ]]
          {
            echo "LABBY_N_MINUS_ONE_CANDIDATE_ARCHIVE=$archive"
            echo "LABBY_N_MINUS_ONE_CANDIDATE_ARCHIVE_SHA256=$actual"
          } >> "$GITHUB_ENV"
      - name: Bind qualification to candidate binary and digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir candidate
          case "${{ matrix.archive }}" in
            *.zip) unzip -q "candidate-archive/${{ matrix.archive }}" -d candidate ;;
            *.tar.gz) tar -C candidate -xzf "candidate-archive/${{ matrix.archive }}" ;;
            *) echo "::error::unsupported candidate archive"; exit 1 ;;
          esac
          candidate="$GITHUB_WORKSPACE/candidate/${{ matrix.binary }}"
          test -f "$candidate"
          if command -v sha256sum >/dev/null 2>&1; then
            digest=$(sha256sum <"$candidate" | awk '{print $1}')
          else
            digest=$(shasum -a 256 <"$candidate" | awk '{print $1}')
          fi
          binding="$RUNNER_TEMP/labby-candidate-binding.json"
          python3 - "$LABBY_N_MINUS_ONE_CANDIDATE_ARCHIVE" \
            "$LABBY_N_MINUS_ONE_CANDIDATE_ARCHIVE_SHA256" "$candidate" "$digest" "$binding" <<'PY'
          import json, pathlib, sys
          archive, archive_sha256, binary, binary_sha256, output = sys.argv[1:]
          pathlib.Path(output).write_text(json.dumps({
              "attested_archive": {"path": archive, "sha256": archive_sha256},
              "extracted_binary": {"path": binary, "sha256": binary_sha256},
          }, sort_keys=True) + "\n")
          PY
          {
            echo "LABBY_N_MINUS_ONE_CANDIDATE_BINARY=$candidate"
            echo "LABBY_N_MINUS_ONE_CANDIDATE_SHA256=$digest"
            echo "LABBY_N_MINUS_ONE_CANDIDATE_BINDING=$binding"
          } >> "$GITHUB_ENV"
      - name: Resolve N-1 release
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          # N-1 is the newest published release carrying this leg's installer
          # assets, not the newest tag: a release that fails qualification
          # stays an asset-less draft, and installing it would strand every
          # later release. The resolver fails closed when nothing qualifies.
          releases="$RUNNER_TEMP/labby-releases.json"
          merged="$RUNNER_TEMP/labby-merged-tags.txt"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" >"$releases"
          git tag --merged HEAD 'v*' >"$merged"
          previous=$(python3 scripts/ci/resolve-n-minus-one-baseline.py \
            --candidate "$GITHUB_REF_NAME" --releases "$releases" --merged-tags "$merged" \
            --asset "$REQUIRED_ARCHIVE" --asset "$REQUIRED_ARCHIVE.sha256")
          test -n "$previous"
          echo "tag=$previous" >> "$GITHUB_OUTPUT"
      - name: N-1 stateful upgrade and rollback qualification
        shell: bash
        env:
          # The installers and verify-and-activate-release.sh run
          # `gh attestation verify` on both the N-1 and the candidate archive.
          GH_TOKEN: ${{ github.token }}
          # Each adapter is an executable deployment-path contract. Until a
          # platform adapter exists, qualification fails closed rather than
          # silently substituting a clean-install smoke.
          LABBY_N_MINUS_ONE_INSTALL_PREVIOUS: scripts/ci/n-minus-one/${{ matrix.deployment }} install-previous
          LABBY_N_MINUS_ONE_SEED_STATE: scripts/ci/n-minus-one/${{ matrix.deployment }} seed-state
          LABBY_N_MINUS_ONE_VERIFY_PREVIOUS: scripts/ci/n-minus-one/${{ matrix.deployment }} verify-previous
          LABBY_N_MINUS_ONE_VERIFY_PROVENANCE: scripts/ci/n-minus-one/${{ matrix.deployment }} verify-provenance
          LABBY_N_MINUS_ONE_UPGRADE: scripts/ci/n-minus-one/${{ matrix.deployment }} upgrade
          LABBY_N_MINUS_ONE_VERIFY_CANDIDATE: scripts/ci/n-minus-one/${{ matrix.deployment }} verify-candidate
          LABBY_N_MINUS_ONE_AUTHENTICATED_ACTION: scripts/ci/n-minus-one/${{ matrix.deployment }} authenticated-action
          LABBY_N_MINUS_ONE_RESTART: scripts/ci/n-minus-one/${{ matrix.deployment }} restart
          LABBY_N_MINUS_ONE_VERIFY_RESTART: scripts/ci/n-minus-one/${{ matrix.deployment }} verify-restart
          LABBY_N_MINUS_ONE_ROLLBACK: scripts/ci/n-minus-one/${{ matrix.deployment }} rollback
          LABBY_N_MINUS_ONE_VERIFY_ROLLBACK: scripts/ci/n-minus-one/${{ matrix.deployment }} verify-rollback
        run: scripts/ci/qualify-n-minus-one.sh "${{ matrix.deployment }}" "${{ steps.previous.outputs.tag }}" "$GITHUB_REF_NAME"
      - name: Show N-1 diagnostics on failure
        if: failure()
        shell: bash
        env:
          DEPLOYMENT: ${{ matrix.deployment }}
        run: scripts/ci/n-minus-one-diagnostics.sh "$DEPLOYMENT"

  incus-candidate:
    needs: upgrade-qualification
    permissions:
      contents: write
    uses: ./.github/workflows/build-incus-image.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  desktop-candidate:
    # Advisory: build-desktop.yml marks its build job continue-on-error, so a
    # missing Apple signing identity or a failed bundle never blocks stable
    # promotion. Its assets are uploaded when present.
    # This is an additive artifact with no registry side effects. Build it in
    # parallel with CLI binaries and N-1 qualification, then keep waiting for
    # it before creating the complete release manifest.
    needs: preflight
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-desktop.yml
    secrets: inherit

  npm-candidate:
    # The MCP Registry only accepts a manifest whose npm version is already
    # published with a matching mcpName, so the candidate-tagged npm version
    # must exist before mcp-candidate runs. Waiting for incus-candidate keeps
    # this irreversible publication behind every non-publishing gate.
    name: Publish npm candidate
    needs: [build, upgrade-qualification, incus-candidate, desktop-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Validate npm publication identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami >/dev/null
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lab-*
          merge-multiple: true
      - name: Verify artifact checksums
        run: sha256sum --check --ignore-missing ./*.sha256
      - name: Publish candidate-tagged npm launcher
        env:
          LABBY_RELEASE_ASSET_DIR: ${{ github.workspace }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./packages/labby-mcp/package.json').name")"
          version="$(node -p "require('./packages/labby-mcp/package.json').version")"
          if npm view "$package_name@$version" version >/dev/null 2>&1; then
            echo "$package_name@$version is already published"
          else
            npm publish --access public --tag "candidate-$version" ./packages/labby-mcp
          fi

  mcp-candidate:
    needs: [upgrade-qualification, npm-candidate]
    uses: ./.github/workflows/mcp-registry.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  release:
    name: Publish validated release
    # npm lacks conditional dist-tag writes. Serialize the complete promotion
    # and rollback transaction across all tags; version guards reject stale runs.
    concurrency:
      group: labby-stable-release-promotion
      cancel-in-progress: false
    needs: [build, upgrade-qualification, incus-candidate, desktop-candidate, npm-candidate, mcp-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Validate npm publication identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami >/dev/null
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lab-*
          merge-multiple: true
      - name: Verify artifact checksums
        run: sha256sum --check --ignore-missing ./*.sha256
      - name: Prepare immutable installer assets
        run: |
          cp scripts/install.sh labby-install.sh
          sha256sum labby-install.sh > labby-install.sh.sha256
      - name: Install Syft for subject-specific SBOMs
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
      - name: Generate one SPDX SBOM per shipped subject
        run: scripts/ci/generate-release-sboms.sh
      - name: Qualify complete release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' | grep -Fx true
      - name: Create immutable release manifest
        env:
          INCUS_SHA256: ${{ needs.incus-candidate.outputs.asset_sha256 }}
          MCP_MANIFEST_SHA256: ${{ needs.mcp-candidate.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          # Desktop assets are additive: the advisory desktop leg may have
          # produced none of them, and an unmatched glob must not become a
          # literal "missing subject".
          shopt -s nullglob
          python3 scripts/ci/create-release-manifest.py \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --incus-sha256 "$INCUS_SHA256" \
            --mcp-manifest-sha256 "$MCP_MANIFEST_SHA256" \
            lab-*.tar.gz lab-*.sha256 lab-*.spdx.json \
            labby-desktop-*.tar.gz labby-desktop-*.AppImage labby-desktop-*.sha256 labby-desktop-*.spdx.json \
            labby-install.sh.spdx.json labby-install.sh labby-install.sh.sha256
      - name: Upload qualified assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(lab-*.tar.gz lab-*.tar.gz.sha256 lab-*.spdx.json labby-desktop-*.tar.gz labby-desktop-*.AppImage labby-desktop-*.sha256 labby-desktop-*.spdx.json labby-install.sh labby-install.sh.sha256 labby-install.sh.spdx.json release-manifest.json)
          gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft | grep -Fx true
          touch /tmp/labby-release-was-draft
          scripts/ci/upload-immutable-release-assets.sh -- "${files[@]}"
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: |
            lab-*.tar.gz
            lab-*.spdx.json
            lab-*.sha256
            labby-desktop-*.tar.gz
            labby-desktop-*.AppImage
            labby-desktop-*.sha256
            labby-desktop-*.spdx.json
            labby-install.*.spdx.json
            labby-install.sh
            labby-install.sh.sha256
            release-manifest.json
      - name: Verify release provenance as a consumer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for artifact in lab-*.tar.gz lab-*.sha256 lab-*.spdx.json labby-desktop-*.tar.gz labby-desktop-*.AppImage labby-desktop-*.sha256 labby-desktop-*.spdx.json labby-install.sh labby-install.sh.sha256 labby-install.sh.spdx.json release-manifest.json; do
            scripts/ci/verify-release-provenance.sh --repo ${{ github.repository }} --workflow release.yml --ref ${{ github.ref }} --artifact "$artifact"
          done
      - name: Prepare npm stable pointer transaction
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          python3 scripts/ci/promote-npm-pointer.py prepare \
            --package "$(node -p "require('./packages/labby-mcp/package.json').name")" \
            --version "$(node -p "require('./packages/labby-mcp/package.json').version")" \
            --receipt /tmp/labby-npm-pointer.json
      - name: Transactionally promote Incus rolling pointer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          INCUS_POINTER_RECEIPT: /tmp/labby-incus-pointer-receipt
        run: scripts/ci/promote-incus-pointer.sh promote
      - name: Check whether npm version already exists
        id: npm-version
        run: |
          package_name="$(node -p "require('./packages/labby-mcp/package.json').name")"
          version="$(node -p "require('./packages/labby-mcp/package.json').version")"
          if npm view "$package_name@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish validated npm launcher
        if: steps.npm-version.outputs.exists != 'true'
        env:
          LABBY_RELEASE_ASSET_DIR: ${{ github.workspace }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./packages/labby-mcp/package.json').version")"
          npm publish --access public --tag "candidate-$version" ./packages/labby-mcp
      - name: Publish qualified draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/ci/promote-release.sh
      - name: Advance npm stable pointer after release promotion
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_name="$(node -p "require('./packages/labby-mcp/package.json').name")"
          version="$(node -p "require('./packages/labby-mcp/package.json').version")"
          python3 scripts/ci/promote-npm-pointer.py promote --package "$package_name" \
            --version "$version" --receipt /tmp/labby-npm-pointer.json
      - name: Roll back partial publication
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ROLLBACK_STATUS_FILE: /tmp/labby-release-rollback.json
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -u
          pointer_rc=0
          if [[ -f /tmp/labby-incus-pointer-receipt/state ]]; then
            INCUS_POINTER_RECEIPT=/tmp/labby-incus-pointer-receipt \
              scripts/ci/promote-incus-pointer.sh rollback || pointer_rc=$?
          fi
          npm_rc=0
          if [[ -f /tmp/labby-npm-pointer.json ]]; then
            python3 scripts/ci/promote-npm-pointer.py rollback \
              --package "$(node -p "require('./packages/labby-mcp/package.json').name")" \
              --version "$(node -p "require('./packages/labby-mcp/package.json').version")" \
              --receipt /tmp/labby-npm-pointer.json || npm_rc=$?
          fi
          github_rc=0
          # Keep assets public if a stable consumer pointer cannot be restored.
          # Promotion may have succeeded remotely even when its visibility
          # verification timed out. Restore and verify the safe draft state.
          if [[ "$npm_rc" != 0 || "$pointer_rc" != 0 ]]; then
            github_rc=1
          elif [[ -f /tmp/labby-release-was-draft ]]; then
            if ! gh release edit "$RELEASE_TAG" --draft=true ||
               ! gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft | grep -Fx true; then
              github_rc=1
            fi
          fi
          # Successful candidate dependencies prove immutable publication, even if this job fails early.
          python3 scripts/ci/compound-release-rollback.py \
            --pointer-rc "$pointer_rc" --github-rc "$github_rc" --npm-pointer-rc "$npm_rc" \
            --npm-candidate-published true \
            --mcp-version-published true \
            --output "$ROLLBACK_STATUS_FILE"
      - name: Persist compound rollback status
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-rollback-status
          path: /tmp/labby-release-rollback.json
          if-no-files-found: warn
          retention-days: 30
