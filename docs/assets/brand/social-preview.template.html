<meta charset="utf-8">
<style>
@font-face {
  font-family: 'Manrope';
  src: url(data:font/ttf;base64,__FONT__) format('truetype');
  font-weight: 200 800;
  font-style: normal;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1280px; height: 640px; background: #07131c; }

.card {
  position: relative;
  width: 1280px; height: 640px;
  background: #07131c;
  overflow: hidden;
  font-family: 'Manrope', sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

/* Very soft cyan lift behind the mark — keeps the flat brand ground from
   reading dead at poster size. Max alpha 0.075. */
.glow {
  position: absolute;
  left: -300px; top: -340px;
  width: 1180px; height: 1180px;
  background: radial-gradient(circle,
    rgba(41,182,246,0.075) 0%,
    rgba(41,182,246,0.028) 38%,
    rgba(41,182,246,0) 64%);
}

/* The cell matrix continued, unlit. Same 18-unit pitch and same dim-cell
   radius as the mark (18 x 2.25 = 40.5px pitch, r 3.4 x 2.25 = 7.65px),
   phase-locked to the mark's own cells so the field and the mark are one
   grid. Masked to fade in only right of the wordmark. */
.lattice {
  position: absolute; inset: 0;
  background-image: radial-gradient(circle at center,
    #24536c 0 7.65px, rgba(36,83,108,0) 8.2px);
  background-size: 40.5px 40.5px;
  background-position: 107.25px 139.25px;
  opacity: 0.22;
  -webkit-mask-image:
    linear-gradient(to right, transparent 46%, #000 74%, #000 100%),
    linear-gradient(to bottom, transparent 4%, #000 17%, #000 33%, transparent 49%);
  -webkit-mask-composite: source-in;
  mask-composite: intersect;
}

/* Lockup: mark + wordmark. Mark box 144px (64-unit grid at 2.25x),
   gap 54px = 0.375 x mark size, matching badge-labby.svg proportions. */
.lockup {
  position: absolute;
  left: 96px; top: 128px;
  display: flex; align-items: center; gap: 54px;
}
.mark { width: 144px; height: 144px; display: block; }
.word {
  font-size: 108px; font-weight: 800;
  letter-spacing: -0.042em;
  color: #e8f4fb;
  line-height: 1;
}
.word .suffix { color: #29b6f6; }

/* Role-hue accent, echoing the lone rose dot in badge-labby.svg — there it is
   ~0.94 of a lit-cell radius, so 6.4 x 2.25 x 0.94 = 13.5px here. Snapped to a
   lattice node (x 1180.5, y 200) so it reads as one lit cell in the field,
   on the lockup's optical axis. */
.dot {
  position: absolute;
  left: 1167px; top: 186.5px;
  width: 27px; height: 27px;
  border-radius: 50%;
  background: #f9a8c4;
}

.tag {
  position: absolute;
  left: 96px; top: 326px;
  font-size: 44px; font-weight: 500;
  letter-spacing: -0.012em;
  color: #e8f4fb; opacity: 0.62;
}

.foot { position: absolute; left: 96px; right: 96px; bottom: 64px; }
.rule { height: 1px; background: #14303f; }
.row {
  margin-top: 38px;
  display: flex; align-items: center; justify-content: space-between;
}
.chips { display: flex; gap: 14px; }
.chip {
  border: 1px solid #14303f; border-radius: 999px;
  padding: 12px 22px 13px;
  font-size: 24px; font-weight: 600;
  letter-spacing: 0.005em;
  color: #e8f4fb; opacity: 0.78;
  line-height: 1;
}
.url {
  font-size: 26px; font-weight: 600;
  letter-spacing: 0.005em;
  color: #e8f4fb; opacity: 0.5;
}
</style>

<div class="card">
  <div class="glow"></div>
  <div class="lattice"></div>

  <div class="lockup">
    <!-- dinglebear-ai 4A Cell Matrix — labby pattern.
         Lit (col,row): 0,0 · 0,1 · 0,2 · 1,1 · 2,1 ; role cell 2,1 rose. -->
    <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="14" r="3.4" fill="#24536c"></circle>
      <circle cx="32" cy="50" r="3.4" fill="#24536c"></circle>
      <circle cx="50" cy="14" r="3.4" fill="#24536c"></circle>
      <circle cx="50" cy="50" r="3.4" fill="#24536c"></circle>
      <circle cx="14" cy="14" r="6.4" fill="#29b6f6"></circle>
      <circle cx="14" cy="32" r="6.4" fill="#29b6f6"></circle>
      <circle cx="14" cy="50" r="6.4" fill="#29b6f6"></circle>
      <circle cx="32" cy="32" r="6.4" fill="#29b6f6"></circle>
      <circle cx="50" cy="32" r="6.4" fill="#f9a8c4"></circle>
    </svg>
    <div class="word">lab<span class="suffix">by</span></div>
  </div>

  <div class="dot"></div>

  <div class="tag">Rust MCP gateway and homelab control plane</div>

  <div class="foot">
    <div class="rule"></div>
    <div class="row">
      <div class="chips">
        <div class="chip">Code Mode</div>
        <div class="chip">CLI</div>
        <div class="chip">HTTP API</div>
        <div class="chip">Operator UI</div>
      </div>
      <div class="url">github.com/dinglebear-ai</div>
    </div>
  </div>
</div>
