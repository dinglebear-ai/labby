name: Verification toolkit (advisory)

on:
  pull_request:
    paths:
      - 'verification/**'
      - 'crates/labby-model/**'
      - 'formal/**'
      - 'docs/plans/verification-toolkit/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'clippy.toml'
      - 'Justfile'
      - '.github/actions/setup-rust-kache/**'
      - '.github/workflows/verification.yml'
      - 'scripts/ci/test_verification_workflow.py'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Incubation-only advisory lane, deliberately outside the required ci-gate.
  # Test failures remain visible; no continue-on-error or schema regeneration.
  core:
    name: Verification core (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-kache
        with:
          components: clippy,rustfmt
      - name: Compile isolated workspace
        run: cargo check --manifest-path verification/Cargo.toml --workspace --all-features --all-targets --locked
      - name: Test workspace boundaries
        run: python3 -m unittest discover -s verification/tests -p 'test_*.py' -v
      - name: Test core and generated schema drift
        run: cargo test --manifest-path verification/Cargo.toml --workspace --all-features --locked
      - name: Lint isolated workspace
        run: cargo clippy --manifest-path verification/Cargo.toml --workspace --all-features --all-targets --locked -- -D warnings
      - name: Check formatting
        run: cargo fmt --manifest-path verification/Cargo.toml --all -- --check
      - uses: taiki-e/install-action@3ae2e1de8b1f6447853fd29a6000b3953b0494ac
        with:
          tool: cargo-deny@0.20.2
      - name: Audit isolated dependency graph
        run: cargo deny --manifest-path verification/Cargo.toml --config verification/deny.toml --locked check
