<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Labby Settings</title>
<style>
:root{color-scheme:dark;--bg:#07131c;--panel:#13293a;--panel2:#173245;--control:#0c1a24;--border:#1d3d4e;--border2:#28556b;--text:#e6f4fb;--muted:#a7bcc9;--accent:#29b6f6;--ok:#7dd3c7;--warn:#c6a36b;--err:#c78490;font-family:Inter,Manrope,"Segoe UI",system-ui,sans-serif;color:var(--text)}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;min-width:0;background:transparent}body{padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}button,input,select{font:inherit}
.app{width:100%;max-width:920px;margin:auto;overflow:hidden;border:1px solid color-mix(in srgb,var(--border) 60%,var(--bg));border-radius:12px;background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 12px 28px rgba(0,0,0,.2)}
.head{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 18%,transparent)}.lamp{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 7px color-mix(in srgb,var(--accent) 70%,transparent)}.title{font-size:13px;font-weight:800}.sub,.status{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:11px}.status{margin-left:auto}.status.err{color:var(--err)}
.tabs{display:flex;gap:4px;padding:7px 9px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid color-mix(in srgb,var(--border) 65%,transparent)}.tab{height:30px;padding:0 10px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--muted);font-size:11px;font-weight:750;white-space:nowrap;cursor:pointer}.tab[aria-selected="true"]{border-color:var(--border2);background:var(--control);color:var(--text)}.tab:focus-visible,.save:focus-visible,.field input:focus-visible,.field select:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px}
.section-head{display:flex;align-items:flex-start;gap:12px;padding:11px;border-bottom:1px solid color-mix(in srgb,var(--border) 45%,transparent)}.section-head p{margin:3px 0 0;color:var(--muted);font-size:11px;line-height:1.4}.save{margin-left:auto;min-height:34px;padding:0 12px;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--border));border-radius:7px;background:color-mix(in srgb,var(--accent) 12%,var(--control));color:var(--text);font-size:11px;font-weight:800;cursor:pointer}.save:disabled{opacity:.45;cursor:not-allowed}
.fields{display:grid}.field{display:grid;grid-template-columns:minmax(170px,.85fr) minmax(210px,1.15fr);gap:16px;align-items:center;padding:10px 11px;border-bottom:1px solid color-mix(in srgb,var(--border) 35%,transparent)}.field:last-child{border-bottom:0}.label{font-size:12px;font-weight:750}.desc{margin-top:3px;color:var(--muted);font-size:10.5px;line-height:1.35}.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}.chip{padding:2px 5px;border:1px solid color-mix(in srgb,var(--border) 65%,transparent);border-radius:999px;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.07em}.chip.restart{color:var(--warn)}.control{display:flex;justify-content:flex-end;align-items:center;gap:8px}.field input:not([type=checkbox]),.field select{width:100%;min-height:34px;padding:0 9px;border:1px solid var(--border);border-radius:7px;background:var(--control);color:var(--text);font-size:11px}.toggle{position:relative;width:42px;height:24px;flex:none}.toggle input{position:absolute;opacity:0}.track{position:absolute;inset:0;border:1px solid var(--border2);border-radius:999px;background:var(--control);cursor:pointer}.track:after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:var(--muted);transition:transform .16s ease,background .16s ease}.toggle input:checked+.track{background:color-mix(in srgb,var(--accent) 25%,var(--control))}.toggle input:checked+.track:after{transform:translateX(18px);background:var(--accent)}.readonly{max-width:100%;overflow:auto;padding:8px;border:1px solid var(--border);border-radius:7px;background:var(--control);color:var(--muted);font:10px/1.45 "JetBrains Mono",ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:22px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:560px){body{padding:0}.app{border-radius:0;border-left:0;border-right:0}.head{padding:9px}.sub{display:none}.section-head{align-items:center}.section-head p{font-size:10px}.field{grid-template-columns:1fr;gap:8px;padding:11px}.control{justify-content:flex-start}.save{min-height:44px}.tab{min-height:44px}.field input:not([type=checkbox]),.field select{min-height:44px}.toggle{width:48px;height:28px}.track:after{width:18px;height:18px;top:4px}.toggle input:checked+.track:after{transform:translateX(21px)}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.track:after{transition:none}}
</style>
<script>window.__LABBY_APP_INFO={name:"LabbySettings",version:"0.1.0"};</script>
<script src="/apps/assets/labby-app-host.js"></script>
</head>
<body>
<main class="app" id="app">
 <div class="head"><span class="lamp"></span><span class="title">Settings</span><span class="sub">Labby runtime controls</span><span class="status" id="status" role="status" aria-live="polite">Loading…</span></div>
 <nav class="tabs" id="tabs" aria-label="Settings sections"></nav>
 <div class="section-head"><div><strong id="sectionTitle">Settings</strong><p id="sectionDescription">Loading schema-backed settings…</p></div><button class="save" id="save" type="button" disabled>Save changes</button></div>
 <section class="fields" id="fields"></section>
</main>
<script>
(()=>{"use strict";
const host=window.LabbyAppHost,app=document.getElementById("app"),tabs=document.getElementById("tabs"),fields=document.getElementById("fields"),status=document.getElementById("status"),save=document.getElementById("save"),sectionTitle=document.getElementById("sectionTitle"),sectionDescription=document.getElementById("sectionDescription");
let schema=null,state=null,section="features",draft=new Map(),busy=false,frame=null,disposed=false;
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c])}
function norm(v){if(v==null||Array.isArray(v))return v;if(v.structuredContent!=null)return norm(v.structuredContent);if(v.ok===false)throw new Error(v.error&&v.error.message||"Settings request failed.");if(v.ok===true)return norm(v.data);if(v.data!=null)return norm(v.data);if(Array.isArray(v.content)&&v.content[0]&&v.content[0].text){try{return norm(JSON.parse(v.content[0].text))}catch(_){}}return v}
function resize(){if(disposed||frame!==null)return;frame=requestAnimationFrame(()=>{frame=null;host.requestResize({height:Math.ceil(document.documentElement.scrollHeight)})})}
function setStatus(message,error=false){status.textContent=message;status.className=error?"status err":"status"}
function currentFields(){return (schema&&schema.fields||[]).filter(f=>f.section===section)}
function valueOf(f){return draft.has(f.key)?draft.get(f.key):(state&&state.values?state.values[f.key]:null)}
function inputMarkup(f,v){const disabled=f.write_policy!=="editable"||f.control==="read_only";if(disabled)return `<pre class="readonly">${esc(JSON.stringify(v,null,2))}</pre>`;if(f.control==="boolean")return `<label class="toggle"><input data-key="${esc(f.key)}" data-backend="${esc(f.backend)}" type="checkbox" ${v===true?"checked":""}><span class="track"></span></label>`;if(f.control==="enum")return `<select data-key="${esc(f.key)}" data-backend="${esc(f.backend)}">${(f.options||[]).map(o=>`<option value="${esc(o.value)}" ${String(v)===String(o.value)?"selected":""}>${esc(o.label||o.value)}</option>`).join("")}</select>`;const type=f.control==="number"?"number":"text";return `<input data-key="${esc(f.key)}" data-backend="${esc(f.backend)}" type="${type}" value="${esc(v==null?"":v)}" ${f.min!=null?`min="${f.min}"`:""} ${f.max!=null?`max="${f.max}"`:""}>`}
function render(){const spec=(schema.sections||[]).find(s=>s.id===section);tabs.innerHTML=(schema.sections||[]).filter(s=>!s.advanced).map(s=>`<button class="tab" type="button" data-section="${esc(s.id)}" aria-selected="${s.id===section}">${esc(s.label)}</button>`).join("");sectionTitle.textContent=spec?spec.label:"Settings";sectionDescription.textContent=spec?spec.description:"";const list=currentFields();fields.innerHTML=list.length?list.map(f=>{const source=state&&state.sources&&state.sources[f.key];return `<article class="field"><div><div class="label">${esc(f.label)}</div><div class="desc">${esc(f.description)}</div><div class="meta"><span class="chip">${esc(source&&source.source||f.backend)}</span><span class="chip ${f.apply_mode==='restart'?'restart':''}">${esc(f.apply_mode)}</span></div></div><div class="control">${inputMarkup(f,valueOf(f))}</div></article>`}).join(""):'<div class="empty">No settings in this section.</div>';save.disabled=busy||draft.size===0;resize()}
async function load(next=section){busy=true;save.disabled=true;setStatus("Loading…");try{if(!schema)schema=norm(await host.callAction("settings","schema",{}));section=next;state=norm(await host.callAction("settings","state",{section}));draft.clear();setStatus("Up to date");render()}catch(e){setStatus(e&&e.message||"Settings unavailable.",true);fields.innerHTML='<div class="empty">Settings could not be loaded.</div>'}finally{busy=false;save.disabled=draft.size===0;resize()}}
function onInput(e){const el=e.target,key=el&&el.dataset&&el.dataset.key;if(!key)return;let value=el.type==="checkbox"?el.checked:el.type==="number"&&el.value!==""?Number(el.value):el.value;draft.set(key,{value,backend:el.dataset.backend});save.disabled=false;setStatus(`${draft.size} unsaved change${draft.size===1?"":"s"}`)}
async function onSave(){if(!draft.size||busy)return;busy=true;render();setStatus("Saving…");try{const config=[],env=[];for(const [key,item] of draft){(item.backend==="env"?env:config).push({key,value:item.value})}if(config.length)await host.callAction("settings","config.update",{section,entries:config,confirm:true});if(env.length)await host.callAction("settings","env.update",{section,entries:env,confirm:true});await load(section);setStatus("Saved") }catch(e){setStatus(e&&e.message||"Save failed.",true)}finally{busy=false;render()}}
tabs.addEventListener("click",e=>{const next=e.target&&e.target.dataset&&e.target.dataset.section;if(next&&next!==section)void load(next)});fields.addEventListener("input",onInput);fields.addEventListener("change",onInput);save.addEventListener("click",onSave);new ResizeObserver(resize).observe(app);window.addEventListener("pagehide",()=>{disposed=true},{once:true});void load();
})();
</script>
</body>
</html>
