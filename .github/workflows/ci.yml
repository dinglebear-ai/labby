  test-windows:
    name: Test (Windows advisory)
    runs-on: windows-latest
    needs: [changes, frontend-assets]
    # GitHub-hosted isolation makes this safe for fork PRs. This remains a
    # visible portability signal but is intentionally excluded from ci-gate.
    if: ${{ needs.changes.outputs.rust_test == 'true' }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@aad518f59d88bae90133242f9ddac7f8bbc5dddf
      - name: Neutralize rustc wrapper (native Windows)
        shell: pwsh
        run: |
          "RUSTC_WRAPPER=" >> $env:GITHUB_ENV
          "CARGO_BUILD_RUSTC_WRAPPER=" >> $env:GITHUB_ENV
      - name: Restore Windows Cargo cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: . -> target
          key: workspace-nextest-v1
          cache-on-failure: true
      - name: Prepare hosted Windows build cache
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $targetDir = $env:CARGO_TARGET_DIR
          $targetMaxBytes = 12GB

          function Get-TreeSizeBytes($Path) {
            if (-not (Test-Path $Path)) {
              return 0
            }
            $sum = Get-ChildItem -LiteralPath $Path -Recurse -Force -File -ErrorAction SilentlyContinue |
              Measure-Object -Property Length -Sum
            if ($null -eq $sum.Sum) {
              return 0
            }
            return [int64]$sum.Sum
          }

          function Remove-IfExists($Path) {
            if (Test-Path $Path) {
              Remove-Item -LiteralPath $Path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          function Enforce-HardCap($Path, $MaxBytes, $Label) {
            $size = Get-TreeSizeBytes $Path
            if ($size -gt $MaxBytes) {
              Write-Warning "$Label is $([math]::Round($size / 1GB, 2)) GiB, above $([math]::Round($MaxBytes / 1GB, 2)) GiB; wiping it to enforce the hard cap."
              Remove-Item -LiteralPath $Path -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force -Path $Path | Out-Null
              $size = Get-TreeSizeBytes $Path
            }
            Write-Host "$Label ready at $Path ($([math]::Round($size / 1GB, 2)) GiB, hard cap $([math]::Round($MaxBytes / 1GB, 2)) GiB)."
          }

          function Remove-TargetBuildDirs($TargetDir, $Patterns) {
            $buildDir = Join-Path $TargetDir "debug\build"
            if (-not (Test-Path $buildDir)) {
              return
            }
            foreach ($pattern in $Patterns) {
              Get-ChildItem -LiteralPath $buildDir -Directory -Filter $pattern -ErrorAction SilentlyContinue |
                Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null

          # Native bindgen outputs can be left half-written by interrupted runs,
          # and Cargo may then reuse the stale build dir until the include! fails.
          Remove-TargetBuildDirs $targetDir @("libsqlite3-sys-*")

          $size = Get-TreeSizeBytes $targetDir
          if ($size -gt $targetMaxBytes) {
            Write-Warning "Hosted Cargo target dir is $([math]::Round($size / 1GB, 2)) GiB, above $([math]::Round($targetMaxBytes / 1GB, 2)) GiB; pruning volatile caches."
            Remove-IfExists (Join-Path $targetDir "debug\incremental")
            Remove-IfExists (Join-Path $targetDir "debug\.fingerprint")
            Remove-IfExists (Join-Path $targetDir "debug\deps")
          }

          Enforce-HardCap $targetDir $targetMaxBytes "Hosted Cargo target dir"
      - name: Install cargo-nextest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "0.9.138"
          $current = $null
          try {
            $current = (& cargo nextest --version 2>$null)
          } catch {
            $current = $null
          }
          if ($current -like "*$version*") {
            Write-Host "cargo-nextest already installed: $current"
            exit 0
          }

          $target = "x86_64-pc-windows-msvc"
          $base = "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$version"
          $archive = Join-Path $env:RUNNER_TEMP "cargo-nextest.tar.gz"
          $shaFile = Join-Path $env:RUNNER_TEMP "cargo-nextest.sha256"
          $extractDir = Join-Path $env:RUNNER_TEMP "cargo-nextest"
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"

          Invoke-WebRequest "$base/cargo-nextest-$version-$target.tar.gz" -OutFile $archive
          Invoke-WebRequest "$base/cargo-nextest-$version-$target.sha256" -OutFile $shaFile

          $expected = (Get-Content $shaFile -Raw).Split(" ")[0].Trim().ToLowerInvariant()
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "cargo-nextest checksum mismatch: expected $expected, got $actual"
          }

          if (Test-Path $extractDir) {
            Remove-Item -Recurse -Force $extractDir
          }
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          tar -xzf $archive -C $extractDir
          $exe = Get-ChildItem -Path $extractDir -Recurse -Filter cargo-nextest.exe | Select-Object -First 1
          if (-not $exe) {
            throw "cargo-nextest.exe not found in release archive"
          }

          New-Item -ItemType Directory -Force -Path $cargoBin | Out-Null
          Copy-Item $exe.FullName (Join-Path $cargoBin "cargo-nextest.exe") -Force
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $cargoBin "cargo-nextest.exe") --version
      - name: Check Windows Job Object helper crate
        shell: pwsh
        run: cargo check -p labby-winjob --all-targets --locked
      - name: Run cargo nextest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $process = Start-Process `
            -FilePath cargo `
            -ArgumentList @("nextest", "run", "--workspace", "--all-features", "--locked", "--profile", "ci") `
            -NoNewWindow `
            -PassThru

          while (-not $process.WaitForExit(5000)) {
            Write-Host "Windows nextest still running at $(Get-Date -Format o)"
          }

          exit $process.ExitCode
      - name: Run Windows Job Object reaping integration test
        shell: pwsh
        run: cargo nextest run -p labby --test windows_job_object_reaping --all-features --locked --profile ci --run-ignored ignored-only --no-tests pass
      - name: Enforce Windows build cache caps
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $targetDir = $env:CARGO_TARGET_DIR
          $targetMaxBytes = 12GB

          function Get-TreeSizeBytes($Path) {
            if (-not (Test-Path $Path)) {
              return 0
            }
            $sum = Get-ChildItem -LiteralPath $Path -Recurse -Force -File -ErrorAction SilentlyContinue |
              Measure-Object -Property Length -Sum
            if ($null -eq $sum.Sum) {
              return 0
            }
            return [int64]$sum.Sum
          }

          function Enforce-HardCap($Path, $MaxBytes, $Label) {
            New-Item -ItemType Directory -Force -Path $Path | Out-Null
            $size = Get-TreeSizeBytes $Path
            if ($size -gt $MaxBytes) {
              Write-Warning "$Label grew to $([math]::Round($size / 1GB, 2)) GiB, above $([math]::Round($MaxBytes / 1GB, 2)) GiB; wiping it to enforce the hard cap."
              Remove-Item -LiteralPath $Path -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force -Path $Path | Out-Null
              $size = Get-TreeSizeBytes $Path
            }
            Write-Host "$Label final size: $([math]::Round($size / 1GB, 2)) GiB (hard cap $([math]::Round($MaxBytes / 1GB, 2)) GiB)."
          }

          Enforce-HardCap $targetDir $targetMaxBytes "Persistent Cargo target dir"

  release-contract:
    name: Release metadata contract
    runs-on: ci-pool-ops
    timeout-minutes: 10
    needs: changes
    if: ${{ needs.changes.outputs.release == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Validate release metadata
        run: |
          bash scripts/check-version-sync.sh
          bash scripts/check-rust-toolchain-sync.sh

  container-contract:
    name: Container source contract
    runs-on: ci-pool-ops
    timeout-minutes: 10
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Validate container source inputs
        run: |
          set -euo pipefail
          test -f config/Dockerfile
          test -f .dockerignore
          test -f apps/gateway-admin/package.json
          grep -Fq 'FROM rust:' config/Dockerfile
          grep -Fq 'COPY apps/gateway-admin/out' config/Dockerfile
          grep -Fq 'ARG NPM_VERSION="12.0.2"' config/Dockerfile
          grep -Fq 'ARG NPM_SHA512="b885e890b9418fa1693544d05f53e64f9a73ec194837d4258b15fecdd692347b1dd2a517b1b0cbaf9d31cd8e92c3b70956bd2ecc72833a57b4b3098f5bfa7943"' config/Dockerfile
          grep -Fq 'registry.npmjs.org/npm/-/npm-' config/Dockerfile
          grep -Fq 'tar/package.json' config/Dockerfile
          grep -Fq 'undici/package.json' config/Dockerfile
          grep -Fq '7.5.19' config/Dockerfile
          grep -Fq '6.27.0' config/Dockerfile
          grep -Fq 'HEALTHCHECK' config/Dockerfile

  palette-web:
    name: Palette renderer
    runs-on: ci-pool-typescript
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.palette == 'true' }}
    defaults:
      run:
        working-directory: apps/palette-tauri
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 9.15.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/palette-tauri/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm coverage
      - run: pnpm typecheck
      - run: pnpm vite:build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: palette-renderer-coverage
          path: apps/palette-tauri/coverage/
          if-no-files-found: error

  palette-rust:
    name: Palette Tauri (Linux)
    runs-on: ci-pool-rust
    timeout-minutes: 45
    needs: changes
    if: ${{ needs.changes.outputs.palette == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo test --manifest-path apps/palette-tauri/src-tauri/Cargo.toml --locked
      - uses: taiki-e/install-action@3ae2e1de8b1f6447853fd29a6000b3953b0494ac
        with:
          tool: cargo-deny@0.20.2
      - name: Audit Palette dependencies
        run: |
          "$CARGO_HOME/bin/cargo-deny" --version
          "$CARGO_HOME/bin/cargo-deny" \
            --manifest-path apps/palette-tauri/src-tauri/Cargo.toml \
            --config apps/palette-tauri/src-tauri/deny.toml \
            check advisories

  palette-windows:
    name: Palette Tauri (Windows advisory)
    runs-on: windows-latest
    needs: changes
    if: ${{ needs.changes.outputs.palette == 'true' }}
    timeout-minutes: 60
    # GitHub-hosted job: do not inherit an ambient compiler wrapper. Cache jobs
    # configure kache explicitly through setup-rust-kache.
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@aad518f59d88bae90133242f9ddac7f8bbc5dddf
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: apps/palette-tauri/src-tauri
          key: palette-tauri-windows-v1
          cache-on-failure: true
      - run: cargo test --manifest-path apps/palette-tauri/src-tauri/Cargo.toml --locked
      - run: cargo build --manifest-path apps/palette-tauri/src-tauri/Cargo.toml --locked

  rust-coverage:
    name: Rust coverage
    runs-on: ci-pool-rust
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "1"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=lld"
    needs: [changes, frontend-assets]
    if: ${{ needs.changes.outputs.rust_test == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@3ae2e1de8b1f6447853fd29a6000b3953b0494ac
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Collect coverage
        run: cargo llvm-cov nextest --workspace --all-features --locked --profile ci --lcov --output-path lcov.info
      - name: Enforce coverage floor and critical-module floor
        run: |
          python3 scripts/ci/check-rust-coverage.py lcov.info \
            --overall-minimum 15 \
            --critical-minimum 5 \
            --critical crates/labby-auth/src/ \
            --critical crates/labby-gateway/src/ \
            --critical crates/labby/src/dispatch/ \
            --critical crates/labby/src/config.rs \
            --summary coverage-summary.md
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-coverage
          path: |
            lcov.info
            coverage-summary.md
          if-no-files-found: error

  ci-gate:
    name: ci-gate
    runs-on: ci-pool-ops
    timeout-minutes: 10
    if: always()
    needs:
      - fleet-policy
      - fleet-contract
      - changes
      - unraid-plugin-check
      - actionlint
      - frontend-assets
      - gateway-admin-browser
      - fmt
      - deny
      - check
      - msrv
      - npm-launcher
      - feature-slices
      - extracted-crate-slices
      - docs-check
      - clippy
      - test
      - test-fork
      - codemode-runner-smoke
      - mcp-regressions
      - mcp-conformance
      - release-contract
      - container-contract
      - palette-web
      - palette-rust
      - rust-coverage
    steps:
      - name: verify required jobs passed or were intentionally skipped
        run: |
          set -euo pipefail
          require_success_or_skipped() {
            local name="$1"
            local result="$2"
            case "$result" in
              success|skipped) printf '%s=%s\n' "$name" "$result" ;;
              *) echo "::error::$name concluded $result" >&2; exit 1 ;;
            esac
          }
          require_success_or_skipped fleet-policy "${{ needs.fleet-policy.result }}"
          require_success_or_skipped fleet-contract "${{ needs.fleet-contract.result }}"
          require_success_or_skipped changes "${{ needs.changes.result }}"
          require_success_or_skipped unraid-plugin-check "${{ needs.unraid-plugin-check.result }}"
          require_success_or_skipped actionlint "${{ needs.actionlint.result }}"
          require_success_or_skipped frontend-assets "${{ needs.frontend-assets.result }}"
          require_success_or_skipped gateway-admin-browser "${{ needs.gateway-admin-browser.result }}"
          require_success_or_skipped fmt "${{ needs.fmt.result }}"
          require_success_or_skipped deny "${{ needs.deny.result }}"
          require_success_or_skipped check "${{ needs.check.result }}"
          require_success_or_skipped msrv "${{ needs.msrv.result }}"
          require_success_or_skipped npm-launcher "${{ needs.npm-launcher.result }}"
          require_success_or_skipped feature-slices "${{ needs.feature-slices.result }}"
          require_success_or_skipped extracted-crate-slices "${{ needs.extracted-crate-slices.result }}"
          require_success_or_skipped docs-check "${{ needs.docs-check.result }}"
          require_success_or_skipped clippy "${{ needs.clippy.result }}"
          require_success_or_skipped test "${{ needs.test.result }}"
          require_success_or_skipped test-fork "${{ needs.test-fork.result }}"
          require_success_or_skipped codemode-runner-smoke "${{ needs.codemode-runner-smoke.result }}"
          require_success_or_skipped mcp-regressions "${{ needs.mcp-regressions.result }}"
          require_success_or_skipped mcp-conformance "${{ needs.mcp-conformance.result }}"
          require_success_or_skipped release-contract "${{ needs.release-contract.result }}"
          require_success_or_skipped container-contract "${{ needs.container-contract.result }}"
          require_success_or_skipped palette-web "${{ needs.palette-web.result }}"
          require_success_or_skipped palette-rust "${{ needs.palette-rust.result }}"
          require_success_or_skipped rust-coverage "${{ needs.rust-coverage.result }}"
