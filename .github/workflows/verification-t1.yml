name: Verification T1

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    # Remains outside ci-gate until runtime stability has been established.
    name: Bounded model checking (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: verification/target
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-kache
      - uses: taiki-e/install-action@3ae2e1de8b1f6447853fd29a6000b3953b0494ac
        with:
          tool: cargo-deny@0.20.2
      - name: Audit the executed isolated dependency graph
        timeout-minutes: 2
        run: cargo deny --manifest-path verification/Cargo.toml --config verification/deny.toml --locked check
      - name: Build model host (separate build budget)
        timeout-minutes: 12
        run: cargo build --manifest-path verification/Cargo.toml -p labby-verify --locked
      - name: Check bounded models (T1, less than five minutes)
        run: |
          set -euo pipefail
          source_status="$(git status --porcelain)"
          mkdir -p verification-evidence
          git rev-parse HEAD > verification-evidence/source-revision.txt
          printf '%s' "$source_status" > verification-evidence/source-dirty.txt
          sha256sum verification/target/debug/labby-verify > verification-evidence/binary-sha256.txt
          timeout --signal=TERM --kill-after=5s 290s verification/target/debug/labby-verify t1 formal > verification-evidence/model-checking.json
      - name: Check bounded Loom lifecycle schedules (T1, less than five minutes)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 290s \
            cargo test --manifest-path verification/Cargo.toml -p verify-loom \
              --locked --test lifecycle loom_ -- --test-threads=1 \
              2>&1 | tee verification-evidence/loom-qualification.txt
      - name: Render retained evidence without changing the search result
        if: always()
        run: |
          set -euo pipefail
          for format in json text markdown html; do
            verification/target/debug/labby-verify report-t1 verification-evidence/model-checking.json verification-evidence/source-revision.txt verification-evidence/source-dirty.txt verification-evidence/binary-sha256.txt "$format" dinglebear-ai/labby > "verification-evidence/report.$format"
          done
          cat verification-evidence/report.markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve bounded model evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-t1
          path: verification-evidence/
          if-no-files-found: error
          retention-days: 14
