name: Rust coverage

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

concurrency:
  group: rust-coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=lld"
  KACHE_S3_ACCESS_KEY: ""
  KACHE_S3_SECRET_KEY: ""
  KACHE_S3_ENDPOINT: ${{ vars.KACHE_S3_ENDPOINT }}
  KACHE_S3_BUCKET: ${{ vars.KACHE_S3_BUCKET }}
  KACHE_S3_PREFIX: ""
  KACHE_S3_PREFIX_ENFORCED: ${{ vars.KACHE_S3_PREFIX_ENFORCED }}

jobs:
  coverage:
    name: Rust coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Build frontend assets for the instrumented binary
        uses: ./.github/actions/build-gateway-admin
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@3ae2e1de8b1f6447853fd29a6000b3953b0494ac
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Collect coverage
        run: cargo llvm-cov nextest --workspace --all-features --locked --profile ci --lcov --output-path lcov.info
      - name: Enforce coverage floor and critical-module floor
        run: |
          python3 scripts/ci/check-rust-coverage.py lcov.info \
            --overall-minimum 15 \
            --critical-minimum 30 \
            --critical crates/labby-auth/src/ \
            --critical crates/labby-gateway/src/ \
            --critical crates/labby/src/dispatch/ \
            --critical crates/labby/src/config.rs \
            --summary coverage-summary.md
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-coverage
          path: |
            lcov.info
            coverage-summary.md
          if-no-files-found: error
