name: Build Incus image

on:
  release:
    types: [published]

concurrency:
  group: incus-image-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-image:
    name: Build and smoke hosted x86_64 image
    uses: dinglebear-ai/workflows/.github/workflows/hosted-incus-image.yml@98e40816bfab64ed9fcce82236e9ecb0c0055d7d
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      artifact-name: labby-incus-image
      artifact-directory: dist
      enable-kache: true
      kache-manifest-key: labby-incus-release
      timeout-minutes: 120
      setup-command: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y debootstrap gpg incus rsync shellcheck squashfs-tools uidmap
        rustup toolchain install 1.97.1 --profile minimal --target x86_64-unknown-linux-gnu
        rustup default 1.97.1
        corepack enable
        corepack prepare pnpm@9.15.9 --activate
        distrobuilder_version=3.3.1
        distrobuilder_sha256=6c411af7178bb55ef649c708f4f38fc3c30e6ecce901c08d8a389448a900a73a
        distrobuilder_dir="$(mktemp -d)"
        archive="$distrobuilder_dir/distrobuilder.tar.gz"
        curl --fail --show-error --location --proto '=https' --tlsv1.2 \
          --retry 5 --retry-all-errors --retry-delay 2 \
          --output "$archive" \
          "https://github.com/lxc/distrobuilder/releases/download/v${distrobuilder_version}/distrobuilder-${distrobuilder_version}.tar.gz"
        printf '%s  %s\n' "$distrobuilder_sha256" "$archive" |
          sha256sum --check --strict
        tar -xzf "$archive" -C "$distrobuilder_dir"
        (
          cd "$distrobuilder_dir/distrobuilder-${distrobuilder_version}"
          go build -mod=vendor -trimpath \
            -tags=containers_image_storage_stub,containers_image_docker_daemon_stub,containers_image_openpgp \
            -o "$RUNNER_TEMP/distrobuilder" ./distrobuilder
        )
        chmod 0755 "$RUNNER_TEMP/distrobuilder"
        echo "DISTROBUILDER_BIN=$RUNNER_TEMP/distrobuilder" >> "$GITHUB_ENV"
      validate-command: |
        set -euo pipefail
        sh -n scripts/incus-bootstrap.sh
        bash -n scripts/ci/build-incus-image.sh scripts/ci/smoke-incus-image.sh
        shellcheck scripts/incus-bootstrap.sh scripts/ci/build-incus-image.sh scripts/ci/smoke-incus-image.sh
        sudo "$DISTROBUILDER_BIN" validate config/incus/labby-image.yaml -o image.serial=ci
      build-command: |
        set -euo pipefail
        (
          cd apps/gateway-admin
          pnpm install --frozen-lockfile
          pnpm run test:install-script
          pnpm run test:unit
          pnpm exec tsc --noEmit
          pnpm build
        )
        git diff --exit-code -- apps/gateway-admin/public/install.sh
        cargo build --workspace --all-features --locked \
          --target x86_64-unknown-linux-gnu
        mkdir -p target/incus-image-input
        cp target/x86_64-unknown-linux-gnu/debug/labby \
          target/incus-image-input/labby
        tar -C target/incus-image-input -czf \
          target/incus-image-input/lab-x86_64-unknown-linux-gnu.tar.gz labby
        image_serial="${GITHUB_REF_NAME}-${GITHUB_SHA::12}"
        image_serial="${image_serial//[^A-Za-z0-9_.-]/-}"
        scripts/ci/build-incus-image.sh \
          "$image_serial" \
          target/incus-image-input/lab-x86_64-unknown-linux-gnu.tar.gz \
          dist
      smoke-command: |
        EXPORT_DIR="$GITHUB_WORKSPACE/dist" \
        IMAGE_ALIAS="labby-incus-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
        SMOKE_CONTAINER_NAME="labby-incus-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
        SMOKE_PROFILE_NAME="labby-gateway-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
        SMOKE_EXPECT_ANDROID_SDK=0 \
          scripts/ci/smoke-incus-image.sh
    secrets:
      KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_S3_ACCESS_KEY }}
      KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_S3_SECRET_KEY }}

  publish-image:
    name: Publish verified image and advance rolling alias
    needs: [build-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: labby-incus-image
          path: dist

      - name: Publish exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ROLLING_TAG: labby-incus-latest
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check --strict SHA256SUMS)
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0)
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

          verify_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --dir "$verify_dir"
          (cd "$verify_dir" && sha256sum --check --strict SHA256SUMS)

          rolling_notes="$(mktemp)"
          printf "Rolling pointer to \`%s\` from \`%s\`.\n" \
            "$RELEASE_TAG" "$GITHUB_SHA" > "$rolling_notes"
          if gh release view "$ROLLING_TAG" >/dev/null 2>&1; then
            gh release upload "$ROLLING_TAG" "$verify_dir"/* --clobber
            gh release edit "$ROLLING_TAG" \
              --title "labby-incus latest" \
              --notes-file "$rolling_notes" \
              --latest=false
          else
            gh release create "$ROLLING_TAG" "$verify_dir"/* \
              --target "$GITHUB_SHA" \
              --title "labby-incus latest" \
              --notes-file "$rolling_notes" \
              --latest=false
          fi

          rolling_verify="$(mktemp -d)"
          gh release download "$ROLLING_TAG" --dir "$rolling_verify"
          (cd "$rolling_verify" && sha256sum --check --strict SHA256SUMS)
          git tag -f "$ROLLING_TAG" "$GITHUB_SHA"
          git push -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$ROLLING_TAG"
