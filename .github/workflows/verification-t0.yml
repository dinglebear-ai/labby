name: Verification T0

on:
  workflow_call:

permissions:
  contents: read

jobs:
  replay:
    name: Labby model replay
    runs-on: ubuntu-24.04
    # Audit/build/replay budgets plus bounded setup and evidence-upload margin.
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: tools/verification/target
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-kache
      - uses: taiki-e/install-action@3ae2e1de8b1f6447853fd29a6000b3953b0494ac
        with:
          tool: cargo-deny@0.20.2
      - name: Audit the executed isolated dependency graph
        timeout-minutes: 2
        run: cargo deny --manifest-path tools/verification/Cargo.toml --config tools/verification/deny.toml --locked check
      - name: Build model host (separate build budget)
        timeout-minutes: 12
        run: cargo build --manifest-path tools/verification/Cargo.toml -p labby-verify --locked
      - name: Replay catalog and corpus (T0, 60 seconds)
        run: |
          set -euo pipefail
          source_status="$(git status --porcelain)"
          mkdir -p verification-evidence
          git rev-parse HEAD > verification-evidence/source-revision.txt
          printf '%s' "$source_status" > verification-evidence/source-dirty.txt
          sha256sum tools/verification/target/debug/labby-verify > verification-evidence/binary-sha256.txt
          timeout --signal=TERM --kill-after=5s 60s tools/verification/target/debug/labby-verify t0 tools/verification/formal > verification-evidence/model-replay.json
      - name: Render retained evidence without changing the replay result
        if: always()
        run: |
          set -euo pipefail
          for format in json text markdown html; do
            tools/verification/target/debug/labby-verify report-t0 verification-evidence/model-replay.json verification-evidence/source-revision.txt verification-evidence/source-dirty.txt verification-evidence/binary-sha256.txt "$format" dinglebear-ai/labby > "verification-evidence/report.$format"
          done
          cat verification-evidence/report.markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve model-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-t0
          path: verification-evidence/
          if-no-files-found: error
          retention-days: 14
