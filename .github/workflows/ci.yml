name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_S3_ACCESS_KEY }}
  KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_S3_SECRET_KEY }}

jobs:
  fleet-policy:
    name: Fleet workflow policy
    uses: dinglebear-ai/workflows/.github/workflows/fleet-policy.yml@98e40816bfab64ed9fcce82236e9ecb0c0055d7d
    with:
      release-file-regex: '(^|/)(release|build-incus-image)\.ya?ml$'

  fleet-contract:
    name: Fleet repository contract
    uses: dinglebear-ai/workflows/.github/workflows/fleet-contract.yml@98e40816bfab64ed9fcce82236e9ecb0c0055d7d
    with:
      profile: rust
      implementation-ref: 98e40816bfab64ed9fcce82236e9ecb0c0055d7d

  changes:
    name: changes
    runs-on: ci-pool-ops
    timeout-minutes: 10
    outputs:
      all: ${{ steps.classify.outputs.all }}
      docs: ${{ steps.classify.outputs.docs }}
      docs_check: ${{ steps.classify.outputs.docs_check }}
      workflow: ${{ steps.classify.outputs.workflow }}
      rust_compile: ${{ steps.classify.outputs.rust_compile }}
      rust_test: ${{ steps.classify.outputs.rust_test }}
      web: ${{ steps.classify.outputs.web }}
      # `all` keeps the first PR that introduces this category fail-closed
      # while the trusted base-branch classifier is still one revision behind.
      palette: ${{ steps.classify.outputs.palette == 'true' || steps.classify.outputs.all == 'true' }}
      npm: ${{ steps.classify.outputs.npm }}
      docker: ${{ steps.classify.outputs.docker }}
      security: ${{ steps.classify.outputs.security }}
      release: ${{ steps.classify.outputs.release }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare trusted changed path classifier
        run: |
          set -euo pipefail
          classifier="scripts/ci/changed_paths.py"
          trusted="/tmp/lab-changed-paths.py"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if ! git show "${{ github.event.pull_request.base.sha }}:$classifier" > "$trusted" 2>/dev/null; then
              cat > "$trusted" <<'PY'
          #!/usr/bin/env python3
          import argparse
          from pathlib import Path
          keys = "all docs docs_check workflow rust_compile rust_test web palette npm docker security release".split()
          parser = argparse.ArgumentParser()
          parser.add_argument("--event", required=True)
          parser.add_argument("--output", type=Path, required=True)
          parser.add_argument("--write-changed-files", type=Path)
          args, _ = parser.parse_known_args()
          if args.write_changed_files:
              args.write_changed_files.write_text("")
          args.output.write_text("".join(f"{key}=true\n" for key in keys))
          for key in keys:
              print(f"{key}=true")
          PY
            fi
          else
            cp "$classifier" "$trusted"
          fi
          chmod +x "$trusted"
          echo "LABBY_CHANGED_PATHS=$trusted" >> "$GITHUB_ENV"
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 "$LABBY_CHANGED_PATHS" --event "$EVENT_NAME" --output "$GITHUB_OUTPUT" --write-changed-files changed-files.txt
      - name: Enforce retired feature boundary
        run: scripts/check-retired-features.sh

  unraid-plugin-check:
    name: Unraid plugin checksums
    runs-on: ci-pool-ops
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.3"
          coverage: none
      - run: scripts/ci/unraid-plugin-checksums.sh
      - run: scripts/ci/unraid-runtime-tests.sh

  actionlint:
    name: Actionlint
    runs-on: ci-pool-ops
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.5
      - name: Run pinned Actionlint
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          go version
          echo "actionlint=v1.7.7"
      - name: Test CI policy helpers
        run: python3 -m unittest scripts/ci/test_check_rust_coverage.py scripts/ci/test_windows_ci_policy.py

  frontend-assets:
    name: Frontend assets
    runs-on: ci-pool-typescript
    timeout-minutes: 20
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.rust_compile == 'true' ||
        needs.changes.outputs.docs_check == 'true' ||
        needs.changes.outputs.web == 'true' ||
        needs.changes.outputs.docker == 'true' ||
        needs.changes.outputs.release == 'true'
      }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-gateway-admin
      - name: Upload gateway-admin export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out/
          if-no-files-found: error
          retention-days: 1

  gateway-admin-browser:
    name: Gateway Admin browser tests
    runs-on: ci-pool-typescript
    timeout-minutes: 20
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    defaults:
      run:
        working-directory: apps/gateway-admin
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 9.15.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/gateway-admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright runtime libraries
        run: |
          set -euo pipefail
          if [ "$(id -u)" = "0" ]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              libasound2t64 \
              libatk-bridge2.0-0t64 \
              libatk1.0-0t64 \
              libatspi2.0-0t64 \
              libcairo2 \
              libcups2t64 \
              libdbus-1-3 \
              libdrm2 \
              libgbm1 \
              libglib2.0-0t64 \
              libnspr4 \
              libnss3 \
              libpango-1.0-0 \
              libx11-6 \
              libxcb1 \
              libxcomposite1 \
              libxdamage1 \
              libxext6 \
              libxfixes3 \
              libxkbcommon0 \
              libxrandr2
          else
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              libasound2t64 \
              libatk-bridge2.0-0t64 \
              libatk1.0-0t64 \
              libatspi2.0-0t64 \
              libcairo2 \
              libcups2t64 \
              libdbus-1-3 \
              libdrm2 \
              libgbm1 \
              libglib2.0-0t64 \
              libnspr4 \
              libnss3 \
              libpango-1.0-0 \
              libx11-6 \
              libxcb1 \
              libxcomposite1 \
              libxdamage1 \
              libxext6 \
              libxfixes3 \
              libxkbcommon0 \
              libxrandr2
          fi
      # The self-hosted runner image carries the matching Playwright browser.
      # Playwright's installer rejects Ubuntu 26.04 even when that browser is
      # already cached, so verify the image contract with a real headless launch
      # instead of invoking the unsupported installer.
      - name: Verify cached Playwright browser launch
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const { chromium } = require("playwright");

          (async () => {
            const executable = chromium.executablePath();
            if (!fs.existsSync(executable)) {
              throw new Error(`Missing cached Playwright browser: ${executable}`);
            }
            const browser = await chromium.launch({ headless: true });
            await browser.close();
            console.log(`Verified cached Playwright browser launch: ${executable}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - run: pnpm test:browser

  fmt:
    name: Format
    runs-on: ci-pool-rust
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.rust_compile == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      # Fails when Cargo.toml, package.json, server.json and friends disagree
      # on the version. Previously reachable only by hand, which is how a
      # sibling repo sat seven releases out of sync unnoticed.
      - name: Check version sync
        run: bash scripts/check-version-sync.sh
      - name: Check Rust toolchain sync
        run: bash scripts/check-rust-toolchain-sync.sh
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  deny:
    name: Cargo Deny
    runs-on: ci-pool-rust
    timeout-minutes: 20
    needs: changes
    if: ${{ needs.changes.outputs.security == 'true' }}
    env:
      CARGO_DENY_VERSION: "0.19.8"
      CARGO_DENY_SHA256: "70e769ae3872e34d45132b17040859175e11401dc12dddb0303e0b8c7d088f3f"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      - name: Run pinned Cargo Deny
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          trap 'rm -rf "$tool_dir"' EXIT
          archive="$tool_dir/cargo-deny.tar.gz"
          curl --fail --show-error --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "$CARGO_DENY_SHA256" "$archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_dir" --strip-components=1
          "$tool_dir/cargo-deny" --version
          "$tool_dir/cargo-deny" \
            --log-level warn \
            --manifest-path ./Cargo.toml \
            --all-features \
            check

  check:
    name: Check
    runs-on: ci-pool-rust
    timeout-minutes: 30
    needs: [changes, frontend-assets]
    if: ${{ needs.changes.outputs.rust_compile == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      - run: cargo check --workspace --all-features --locked

  msrv:
    name: MSRV
    runs-on: ci-pool-rust
    timeout-minutes: 30
    needs: [changes, frontend-assets]
    if: ${{ needs.changes.outputs.rust_compile == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - name: Install minimum supported Rust
        uses: ./.github/actions/setup-rust-kache
        with:
          toolchain: "1.97.1"
      - run: cargo +1.97.1 check --workspace --all-features --all-targets --locked

  codemode-runner-smoke:
    name: Code Mode runner smoke
    runs-on: ci-pool-rust
    timeout-minutes: 30
    needs: [changes, frontend-assets]
    if: ${{ needs.changes.outputs.rust_test == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      - name: Execute sandbox through the CLI-hosted runner
        run: |
          set -euo pipefail
          cargo run -p labby --all-features --locked -- --json gateway code exec \
            --code 'async () => ({ ok: true, sum: 1 + 1 })' \
            | grep -q '"sum":2'

  npm-launcher:
    name: npm launcher
    runs-on: ci-pool-typescript
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.npm == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "lts/*"
      - name: Test npm launcher
        run: |
          set -euo pipefail
          npm test --prefix packages/labby-mcp
          npm run check --prefix packages/labby-mcp
          npm pack --dry-run --json ./packages/labby-mcp

  feature-slices:
    name: Feature slice (${{ matrix.slice }})
    runs-on: ci-pool-rust
    timeout-minutes: 30
    needs: [changes, frontend-assets]
    if: ${{ needs.changes.outputs.rust_compile == 'true' }}
    # CLAUDE.md's intent is that each standalone product slice compiles on its
    # own (--no-default-features --features <slice>) to catch cross-slice
    # coupling — a shared module referencing a feature-gated one unconditionally.
    # This is a hard gate on COMPILATION (errors), not warning-cleanliness:
    # per-slice dead-code warnings are an inherent, expected consequence of
    # disabling features (a service module is compiled but its registration is
    # gated off), so this job overrides the global `-D warnings`. The
    # all-features `check`/`clippy`/`test` jobs above remain the authoritative
    # warning-clean signal.
    # Retired ACP, Registry, Marketplace, Deploy, Fleet, and Stash product
    # surfaces are deleted from the workspace. Gateway and fs are the only
    # standalone product slices left on `labby` itself.
    # Slices are compile checks, EXCEPT gateway: the flagship slice also runs
    # its test suite so omission-side tests (#[cfg(not(feature = ...))] —
    # registry omission tests, the no-feature rejection helpers) actually
    # execute somewhere in CI instead of only ever being compiled.
    env:
      RUSTFLAGS: ""
    strategy:
      fail-fast: false
      matrix:
        slice: [gateway, fs]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      - run: cargo check -p labby --no-default-features --features ${{ matrix.slice }} --all-targets --locked
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        if: matrix.slice == 'gateway'
        with:
          install_args: cargo:cargo-nextest
      - name: Run gateway-slice test suite
        if: matrix.slice == 'gateway'
        run: cargo nextest run -p labby --no-default-features --features gateway --locked

  extracted-crate-slices:
    name: Extracted crate slice (${{ matrix.name }})
    runs-on: ci-pool-rust
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.rust_compile == 'true' }}
    env:
      RUSTFLAGS: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: labby-auth-minimal
            command: cargo check -p labby-auth --no-default-features --all-targets --locked
          - name: labby-auth-http-axum
            command: cargo check -p labby-auth --no-default-features --features http-axum --all-targets --locked
          - name: labby-auth-upstream-oauth-rmcp
            command: cargo check -p labby-auth --no-default-features --features upstream-oauth-rmcp --all-targets --locked
          - name: labby-auth-all-runtime-features
            command: cargo check -p labby-auth --no-default-features --features http-axum,upstream-oauth-rmcp --all-targets --locked
          - name: labby-codemode
            command: cargo check -p labby-codemode --all-targets --locked
          - name: labby-gateway
            command: cargo check -p labby-gateway --all-targets --locked
          - name: labby-runtime
            command: cargo check -p labby-runtime --no-default-features --all-targets --locked
          - name: labby-web
            command: cargo check -p labby-web --all-targets --locked
          - name: labby-winjob
            command: cargo check -p labby-winjob --all-targets --locked
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      - run: ${{ matrix.command }}

  docs-check:
    name: Generated docs
    runs-on: ci-pool-rust
    timeout-minutes: 30
    needs: [changes, frontend-assets]
    if: ${{ needs.changes.outputs.docs_check == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install_args: just
      - run: just docs-check

  clippy:
    name: Clippy
    runs-on: ci-pool-rust
    timeout-minutes: 30
    needs: [changes, frontend-assets]
    if: ${{ needs.changes.outputs.rust_compile == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
        with:
          components: clippy
      - run: cargo clippy --workspace --all-features --locked -- -D warnings

  mcp-regressions:
    name: MCP focused regressions
    runs-on: ci-pool-rust
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "1"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=lld"
    needs: [changes, frontend-assets]
    if: ${{ needs.changes.outputs.rust_test == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      - name: MCP route-scope resources/tools and list pagination
        run: |
          cargo test -p labby --all-features --locked mcp::handlers_resources::tests
          cargo test -p labby --all-features --locked mcp::handlers_tools::tests
      - name: Upstream ui resource route scope
        run: |
          cargo test -p labby-gateway --features testkit --locked read_upstream_ui_resource
          cargo test -p labby-gateway --lib --features testkit --locked healthy_tool_names_allowed_matches_route_and_exposure_filters
      - name: Elicitation and relay controls
        run: |
          cargo test -p labby --all-features --locked destructive_builtin_uses_stateless_mrtr_elicitation
          cargo test -p labby-gateway --lib --locked upstream_input_required_is_preserved_for_downstream
          cargo test -p labby-gateway --lib --locked stateless_adapter_ignores_legacy_session_ids_in_both_directions
      - name: Lifecycle, SEP-2243 headers, caching, and subscriptions
        run: |
          cargo test -p labby --all-features --locked cli::serve::tests::http_mcp_
          cargo test -p labby --all-features --locked stateless_subscription_receives_catalog_notifications

  mcp-conformance:
    name: MCP 2026-07-28 conformance
    runs-on: ci-pool-rust
    timeout-minutes: 20
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.rust_test == 'true' ||
        needs.changes.outputs.workflow == 'true'
      }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      - name: Verify Labby auth core and extension contracts
        run: cargo test -p labby-auth --all-features --locked
      - name: Run dated protocol and extension suites
        run: scripts/ci/mcp-conformance.sh
      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mcp-conformance
          path: target/mcp-conformance
          if-no-files-found: warn

  test:
    name: Test
    # The Rust pool connects Kache to the fleet MinIO cache; no GitHub cache
    # save/restore layer is needed.
    runs-on: ci-pool-rust
    timeout-minutes: 60
    if: >-
      needs.changes.outputs.rust_test == 'true' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    needs: [changes, frontend-assets]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
