# APM package manifest for Labby (https://microsoft.github.io/apm/).
#
#   apm install -g dinglebear-ai/labby/plugins/labby
#
# deploys the five Labby Agent Skills (this package's .apm/skills) into ~/.claude/skills and
# ~/.agents/skills, and registers the `labby` stdio MCP server (the npm
# launcher, `npx -y @dinglebear/labby mcp`) in Claude Code and Codex. It does
# not install the labby binary or provision a gateway host: run the
# `install-labby` skill (or the attested labby-install.sh) for that, then
# `labby setup`. The version line is bumped by Release Please.
name: labby
version: 2.6.2 # x-release-please-version
description: Labby MCP gateway skills (guided install, operation, live Code Mode, and snippets) and the labby stdio MCP server registration.
author: dinglebear-ai
license: AGPL-3.0-only
targets:
  - claude
  - codex
includes: auto
dependencies:
  apm: []
  mcp:
    - name: labby
      registry: false
      transport: stdio
      command: npx
      args: ["-y", "@dinglebear/labby", "mcp"]
