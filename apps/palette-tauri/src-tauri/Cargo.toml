[package]
name = "labby-palette-tauri"
version = "0.2.0"
description = "Tauri command palette for the Labby gateway API"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-only"
publish = false

[workspace]

[workspace.lints.rust]
missing_crate_level_docs = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
missing_safety_doc = "deny"
mod_module_files = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
invalid_html_tags = "deny"
bare_urls = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"

[lints]
workspace = true

[lib]
name = "labby_palette_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "labby-palette-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
atomicwrites = "0.4.4"
base64 = "0.22"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
labby-oauth-wire = { path = "../../../crates/labby-oauth-wire" }
open = "5"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["sync", "net", "io-util", "time", "macros", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
