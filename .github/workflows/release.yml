name: Release

on:
  # Release Please creates the immutable tag and a draft release. Qualification
  # starts from the tag; the draft becomes public only in the final promotion.
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  KACHE_S3_ACCESS_KEY: ""
  KACHE_S3_SECRET_KEY: ""
  KACHE_S3_ENDPOINT: ${{ vars.KACHE_S3_ENDPOINT }}
  KACHE_S3_BUCKET: ${{ vars.KACHE_S3_BUCKET }}
  KACHE_S3_PREFIX: ${{ vars.KACHE_S3_PREFIX }}
  # Release jobs must not inherit a host-level compiler wrapper. Cache-enabled
  # jobs configure kache explicitly through setup-rust-kache (mirrors ci.yml).
  RUSTC_WRAPPER: ""
  CARGO_BUILD_RUSTC_WRAPPER: ""
jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      # The validation below shells out to Node and npm for version lockstep
      # plus launcher test/check/pack smoke, so install Node explicitly on the
      # hosted release runner.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "lts/*"
      - name: Validate release tag, ancestry, and version lockstep
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release tag must be stable SemVer vMAJOR.MINOR.PATCH"
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::tag commit is not reachable from origin/main"
            exit 1
          }
          expected="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n '/^\[workspace.package\]$/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          npm_version="$(node -p "require('./packages/labby-mcp/package.json').version")"
          registry_version="$(python3 -c "import json; print(json.load(open('server.json'))['version'])")"
          manifest_version="$(python3 -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")"
          for pair in "Cargo.toml:$cargo_version" "package.json:$npm_version" "server.json:$registry_version" "release manifest:$manifest_version"; do
            [[ "${pair#*:}" == "$expected" ]] || { echo "::error::${pair%%:*} version ${pair#*:} != $expected"; exit 1; }
          done
          npm test --prefix packages/labby-mcp
          npm run check --prefix packages/labby-mcp
          npm pack --dry-run --json ./packages/labby-mcp >/dev/null

  frontend-assets:
    name: Frontend assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: preflight
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-gateway-admin
      - name: Upload gateway-admin export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 90
    needs: frontend-assets
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: '"ubuntu-24.04"'
            binary: labby
            archive: lab-x86_64-unknown-linux-gnu.tar.gz
          - target: x86_64-pc-windows-msvc
            runner: '"windows-latest"'
            binary: labby.exe
            archive: lab-x86_64-pc-windows-msvc.zip
          - target: aarch64-apple-darwin
            runner: '"macos-15"'
            binary: labby
            archive: lab-aarch64-apple-darwin.tar.gz
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - name: Install Rust and kache
        if: runner.os != 'Windows'
        uses: ./.github/actions/setup-rust-kache
        with:
          targets: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        if: runner.os == 'Windows'
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}
      - name: Restore Windows Cargo cache
        if: runner.os == 'Windows'
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          shared-key: labby-release-windows-v1
          cache-on-failure: true

      - name: Build natively
        run: cargo build --workspace --all-features --locked --release --target ${{ matrix.target }}

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"
          tar -C dist -czf "${{ matrix.archive }}" "${{ matrix.binary }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          else
            shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          fi

      - name: Smoke packaged Code Mode runner (Unix)
        if: runner.os != 'Windows'
        env:
          # This is a one-shot CLI smoke. Do not leave a warm runner parked
          # while the workflow shell waits for the packaged process to exit.
          LABBY_CODE_MODE_POOL_SIZE: "0"
        run: |
          set -euo pipefail
          ./dist/${{ matrix.binary }} --json gateway code exec \
            --code 'async () => ({ ok: true, sum: 1 + 1 })' \
            | grep -q '"sum":2'
          ./dist/${{ matrix.binary }} skills --help \
            | grep -q 'Read Agent Skills visible to the local CLI'

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"
          Compress-Archive -Path "dist/${{ matrix.binary }}" -DestinationPath "${{ matrix.archive }}" -Force
          $hash = (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.archive }}" | Out-File -FilePath "${{ matrix.archive }}.sha256" -Encoding ascii

      - name: Smoke packaged Code Mode runner (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Hosted Windows runners track descendant processes. A pooled Code
          # Mode runner can therefore keep this one-shot smoke alive after the
          # CLI has returned its result.
          LABBY_CODE_MODE_POOL_SIZE: "0"
        run: |
          $ErrorActionPreference = "Stop"
          $output = & ".\dist\${{ matrix.binary }}" --json gateway code exec --code "async () => ({ ok: true, sum: 1 + 1 })"
          if ($LASTEXITCODE -ne 0) {
            throw "Code Mode packaged smoke failed with exit code $LASTEXITCODE"
          }
          if ($output -notmatch '"sum":2') {
            throw "Code Mode packaged smoke did not return expected result: $output"
          }
          $skillsHelp = & ".\dist\${{ matrix.binary }}" skills --help
          if ($LASTEXITCODE -ne 0 -or $skillsHelp -notmatch 'Read Agent Skills visible to the local CLI') {
            throw "Packaged binary does not expose the required Skills surface"
          }

      - name: Attest exact platform candidate archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lab-${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error

  container:
    name: Build and smoke container image
    needs: frontend-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Load immutable container supply inputs
        id: container_supply
        run: |
          set -euo pipefail
          source config/container-supply.conf
          scripts/ci/validate-supply-manifest.py
          {
            echo "builder=$LABBY_BUILDER_IMAGE"
            echo "runtime=$LABBY_RUNTIME_IMAGE"
            echo "debian_snapshot=$LABBY_DEBIAN_SNAPSHOT"
            echo "node_version=$LABBY_NODE_VERSION"
            echo "node_sha256=$LABBY_NODE_SHA256"
            echo "uv_version=$LABBY_UV_VERSION"
            echo "uv_sha256=$LABBY_UV_SHA256"
            echo "agent_clis_lock_sha256=$LABBY_AGENT_CLIS_LOCK_SHA256"
            echo "npm_version=$LABBY_NPM_VERSION"
            echo "npm_sha512=$LABBY_NPM_SHA512"
            echo "npm_brace_expansion_version=$LABBY_NPM_BRACE_EXPANSION_VERSION"
            echo "npm_brace_expansion_sha512=$LABBY_NPM_BRACE_EXPANSION_SHA512"
            echo "npm_ip_address_version=$LABBY_NPM_IP_ADDRESS_VERSION"
            echo "npm_ip_address_sha512=$LABBY_NPM_IP_ADDRESS_SHA512"
          } >> "$GITHUB_OUTPUT"
      - name: Build private container candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: config/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/lab-container-image.tar
          tags: lab:release-candidate
          build-args: |
            LABBY_BUILDER_IMAGE=${{ steps.container_supply.outputs.builder }}
            LABBY_RUNTIME_IMAGE=${{ steps.container_supply.outputs.runtime }}
            LABBY_DEBIAN_SNAPSHOT=${{ steps.container_supply.outputs.debian_snapshot }}
            LABBY_NODE_VERSION=${{ steps.container_supply.outputs.node_version }}
            LABBY_NODE_SHA256=${{ steps.container_supply.outputs.node_sha256 }}
            LABBY_UV_VERSION=${{ steps.container_supply.outputs.uv_version }}
            LABBY_UV_SHA256=${{ steps.container_supply.outputs.uv_sha256 }}
            LABBY_AGENT_CLIS_LOCK_SHA256=${{ steps.container_supply.outputs.agent_clis_lock_sha256 }}
            LABBY_NPM_VERSION=${{ steps.container_supply.outputs.npm_version }}
            LABBY_NPM_SHA512=${{ steps.container_supply.outputs.npm_sha512 }}
            LABBY_NPM_BRACE_EXPANSION_VERSION=${{ steps.container_supply.outputs.npm_brace_expansion_version }}
            LABBY_NPM_BRACE_EXPANSION_SHA512=${{ steps.container_supply.outputs.npm_brace_expansion_sha512 }}
            LABBY_NPM_IP_ADDRESS_VERSION=${{ steps.container_supply.outputs.npm_ip_address_version }}
            LABBY_NPM_IP_ADDRESS_SHA512=${{ steps.container_supply.outputs.npm_ip_address_sha512 }}
          cache-from: type=gha,scope=labby-release-container
          cache-to: type=gha,mode=min,scope=labby-release-container
      - name: Load private container candidate
        run: docker load --input /tmp/lab-container-image.tar
      - name: Smoke container Code Mode runner
        run: |
          set -euo pipefail
          docker run --rm lab:release-candidate --json gateway code exec \
            --code 'async () => ({ ok: true, sum: 1 + 1 })' \
            | grep -q '"sum":2'
          docker run --rm lab:release-candidate skills --help \
            | grep -q 'Read Agent Skills visible to the local CLI'
      - name: Scan tested container candidate
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8
        with:
          image-ref: lab:release-candidate
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload tested container candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lab-container-image
          path: /tmp/lab-container-image.tar
          if-no-files-found: error
          retention-days: 1

  upgrade-qualification:
    name: N-1 stateful upgrade and rollback qualification (${{ matrix.deployment }})
    needs: [build, container]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - deployment: unix
            runner: ubuntu-24.04
            artifact: lab-x86_64-unknown-linux-gnu
            archive: lab-x86_64-unknown-linux-gnu.tar.gz
            binary: labby
          - deployment: windows
            runner: windows-latest
            artifact: lab-x86_64-pc-windows-msvc
            archive: lab-x86_64-pc-windows-msvc.zip
            binary: labby.exe
          - deployment: macos
            runner: macos-15
            artifact: lab-aarch64-apple-darwin
            archive: lab-aarch64-apple-darwin.tar.gz
            binary: labby
          - deployment: compose
            runner: ubuntu-24.04
            artifact: lab-x86_64-unknown-linux-gnu
            archive: lab-x86_64-unknown-linux-gnu.tar.gz
            binary: labby
          - deployment: incus
            runner: ubuntu-24.04
            artifact: lab-x86_64-unknown-linux-gnu
            archive: lab-x86_64-unknown-linux-gnu.tar.gz
            binary: labby
          - deployment: host-service
            runner: ubuntu-24.04
            artifact: lab-x86_64-unknown-linux-gnu
            archive: lab-x86_64-unknown-linux-gnu.tar.gz
            binary: labby
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact tested candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ matrix.artifact }}
          path: candidate-archive
      - name: Verify exact archive provenance before extraction
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/candidate-archive/${{ matrix.archive }}"
          sidecar="$archive.sha256"
          scripts/ci/verify-release-provenance.sh \
            --repo "$GITHUB_REPOSITORY" --workflow release.yml \
            --ref "$GITHUB_REF" --artifact "$archive"
          expected=$(awk '{print $1}' "$sidecar")
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$archive" | awk '{print $1}')
          else
            actual=$(shasum -a 256 "$archive" | awk '{print $1}')
          fi
          [[ "$expected" =~ ^[0-9a-f]{64}$ && "$actual" == "$expected" ]]
          {
            echo "LABBY_N_MINUS_ONE_CANDIDATE_ARCHIVE=$archive"
            echo "LABBY_N_MINUS_ONE_CANDIDATE_ARCHIVE_SHA256=$actual"
          } >> "$GITHUB_ENV"
      - name: Bind qualification to candidate binary and digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir candidate
          case "${{ matrix.archive }}" in
            *.zip) unzip -q "candidate-archive/${{ matrix.archive }}" -d candidate ;;
            *.tar.gz) tar -C candidate -xzf "candidate-archive/${{ matrix.archive }}" ;;
            *) echo "::error::unsupported candidate archive"; exit 1 ;;
          esac
          candidate="$GITHUB_WORKSPACE/candidate/${{ matrix.binary }}"
          test -f "$candidate"
          if command -v sha256sum >/dev/null 2>&1; then
            digest=$(sha256sum "$candidate" | awk '{print $1}')
          else
            digest=$(shasum -a 256 "$candidate" | awk '{print $1}')
          fi
          binding="$RUNNER_TEMP/labby-candidate-binding.json"
          python3 - "$LABBY_N_MINUS_ONE_CANDIDATE_ARCHIVE" \
            "$LABBY_N_MINUS_ONE_CANDIDATE_ARCHIVE_SHA256" "$candidate" "$digest" "$binding" <<'PY'
          import json, pathlib, sys
          archive, archive_sha256, binary, binary_sha256, output = sys.argv[1:]
          pathlib.Path(output).write_text(json.dumps({
              "attested_archive": {"path": archive, "sha256": archive_sha256},
              "extracted_binary": {"path": binary, "sha256": binary_sha256},
          }, sort_keys=True) + "\n")
          PY
          {
            echo "LABBY_N_MINUS_ONE_CANDIDATE_BINARY=$candidate"
            echo "LABBY_N_MINUS_ONE_CANDIDATE_SHA256=$digest"
            echo "LABBY_N_MINUS_ONE_CANDIDATE_BINDING=$binding"
          } >> "$GITHUB_ENV"
      - name: Resolve N-1 release
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          previous=$(git tag --sort=-version:refname --merged HEAD 'v*' | grep -Fxv "$GITHUB_REF_NAME" | head -1)
          test -n "$previous"
          echo "tag=$previous" >> "$GITHUB_OUTPUT"
      - name: Download tested container candidate for Compose qualification
        if: matrix.deployment == 'compose'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: lab-container-image
          path: candidate-container
      - name: Bind Compose qualification to immutable images
        if: matrix.deployment == 'compose'
        shell: bash
        run: |
          set -euo pipefail
          docker load --input candidate-container/lab-container-image.tar
          candidate=$(docker image inspect lab:release-candidate --format '{{.Id}}')
          previous=$(docker buildx imagetools inspect "ghcr.io/$GITHUB_REPOSITORY:${{ steps.previous.outputs.tag }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [[ "$candidate" == sha256:* && "$previous" == sha256:* ]]
          {
            echo "LABBY_N_MINUS_ONE_CANDIDATE_IMAGE=$candidate"
            echo "LABBY_N_MINUS_ONE_PREVIOUS_IMAGE=ghcr.io/$GITHUB_REPOSITORY@$previous"
          } >> "$GITHUB_ENV"
      - name: N-1 stateful upgrade and rollback qualification
        shell: bash
        env:
          # Each adapter is an executable deployment-path contract. Until a
          # platform adapter exists, qualification fails closed rather than
          # silently substituting a clean-install smoke.
          LABBY_N_MINUS_ONE_INSTALL_PREVIOUS: scripts/ci/n-minus-one/${{ matrix.deployment }} install-previous
          LABBY_N_MINUS_ONE_SEED_STATE: scripts/ci/n-minus-one/${{ matrix.deployment }} seed-state
          LABBY_N_MINUS_ONE_VERIFY_PREVIOUS: scripts/ci/n-minus-one/${{ matrix.deployment }} verify-previous
          LABBY_N_MINUS_ONE_VERIFY_PROVENANCE: scripts/ci/n-minus-one/${{ matrix.deployment }} verify-provenance
          LABBY_N_MINUS_ONE_UPGRADE: scripts/ci/n-minus-one/${{ matrix.deployment }} upgrade
          LABBY_N_MINUS_ONE_VERIFY_CANDIDATE: scripts/ci/n-minus-one/${{ matrix.deployment }} verify-candidate
          LABBY_N_MINUS_ONE_AUTHENTICATED_ACTION: scripts/ci/n-minus-one/${{ matrix.deployment }} authenticated-action
          LABBY_N_MINUS_ONE_RESTART: scripts/ci/n-minus-one/${{ matrix.deployment }} restart
          LABBY_N_MINUS_ONE_VERIFY_RESTART: scripts/ci/n-minus-one/${{ matrix.deployment }} verify-restart
          LABBY_N_MINUS_ONE_ROLLBACK: scripts/ci/n-minus-one/${{ matrix.deployment }} rollback
          LABBY_N_MINUS_ONE_VERIFY_ROLLBACK: scripts/ci/n-minus-one/${{ matrix.deployment }} verify-rollback
        run: scripts/ci/qualify-n-minus-one.sh "${{ matrix.deployment }}" "${{ steps.previous.outputs.tag }}" "$GITHUB_REF_NAME"

  incus-candidate:
    needs: upgrade-qualification
    permissions:
      contents: write
    uses: ./.github/workflows/build-incus-image.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  mcp-candidate:
    needs: upgrade-qualification
    uses: ./.github/workflows/mcp-registry.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  release:
    name: Publish validated release
    needs: [build, container, upgrade-qualification, incus-candidate, mcp-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Validate npm publication identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami >/dev/null
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: lab-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Verify artifact checksums
        run: sha256sum --check --ignore-missing ./*.sha256
      - name: Prepare immutable installer assets
        run: |
          cp scripts/install.sh labby-install.sh
          cp scripts/install.ps1 labby-install.ps1
          sha256sum labby-install.sh > labby-install.sh.sha256
          sha256sum labby-install.ps1 > labby-install.ps1.sha256
      - name: Install Syft for subject-specific SBOMs
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
      - name: Generate one SPDX SBOM per shipped subject
        run: scripts/ci/generate-release-sboms.sh
      - name: Qualify complete release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s lab-container-image.spdx.json
          gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' | grep -Fx true
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
      - name: Publish exact tested image
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "started=true" >> "$GITHUB_OUTPUT"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          previous_latest="$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)"
          previous_release="$(docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)"
          printf '%s\n' "${previous_latest:-none}" > /tmp/labby-previous-latest-digest
          printf '%s\n' "${previous_release:-none}" > /tmp/labby-previous-release-digest
          if [[ "$previous_release" != sha256:* ]]; then
            touch /tmp/labby-new-version-image
          fi
          touch /tmp/labby-image-publish-started
          docker load --input lab-container-image.tar
          docker tag lab:release-candidate "$IMAGE:$RELEASE_TAG"
          docker tag lab:release-candidate "$IMAGE:latest"
          docker push "$IMAGE:$RELEASE_TAG"
          docker push "$IMAGE:latest"
          digest="$(docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$digest" == sha256:* ]] || { echo "::error::could not resolve published image digest"; exit 1; }
          cosign sign --yes "$IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest container image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publication.outputs.digest }}
          push-to-registry: true
      - name: Create immutable release manifest
        env:
          IMAGE_DIGEST: ${{ steps.publication.outputs.digest }}
          INCUS_SHA256: ${{ needs.incus-candidate.outputs.asset_sha256 }}
          MCP_MANIFEST_SHA256: ${{ needs.mcp-candidate.outputs.manifest_sha256 }}
        run: >-
          python3 scripts/ci/create-release-manifest.py
          --tag "$GITHUB_REF_NAME"
          --repository "$GITHUB_REPOSITORY"
          --image "ghcr.io/$GITHUB_REPOSITORY"
          --image-digest "$IMAGE_DIGEST"
          --image-sbom lab-container-image.spdx.json
          --incus-sha256 "$INCUS_SHA256"
          --mcp-manifest-sha256 "$MCP_MANIFEST_SHA256"
          lab-*.tar.gz lab-*.zip lab-*.sha256 lab-*.spdx.json labby-install.*.spdx.json
          labby-install.sh labby-install.ps1 labby-install.sh.sha256 labby-install.ps1.sha256
      - name: Upload qualified assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=(lab-*.tar.gz lab-*.tar.gz.sha256 lab-*.zip lab-*.zip.sha256 lab-*.spdx.json lab-container-image.spdx.json labby-install.sh labby-install.sh.sha256 labby-install.sh.spdx.json labby-install.ps1 labby-install.ps1.sha256 labby-install.ps1.spdx.json release-manifest.json)
          gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft | grep -Fx true
          scripts/ci/upload-immutable-release-assets.sh -- "${files[@]}"
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: |
            lab-*.tar.gz
            lab-*.zip
            lab-*.spdx.json
            lab-*.sha256
            labby-install.*.spdx.json
            labby-install.sh
            labby-install.ps1
            labby-install.sh.sha256
            labby-install.ps1.sha256
            lab-container-image.spdx.json
            release-manifest.json
      - name: Verify release provenance as a consumer
        run: |
          set -euo pipefail
          for artifact in lab-*.tar.gz lab-*.zip lab-*.sha256 lab-*.spdx.json lab-container-image.spdx.json labby-install.sh labby-install.ps1 labby-install.*.sha256 labby-install.*.spdx.json release-manifest.json; do
            scripts/ci/verify-release-provenance.sh --repo ${{ github.repository }} --workflow release.yml --ref ${{ github.ref }} --artifact "$artifact"
          done
      - name: Transactionally promote Incus rolling pointer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          INCUS_POINTER_RECEIPT: /tmp/labby-incus-pointer-receipt
        run: scripts/ci/promote-incus-pointer.sh promote
      - name: Check whether npm version already exists
        id: npm-version
        run: |
          package_name="$(node -p "require('./packages/labby-mcp/package.json').name")"
          version="$(node -p "require('./packages/labby-mcp/package.json').version")"
          if npm view "$package_name@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            touch /tmp/labby-npm-candidate-published
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish validated npm launcher
        if: steps.npm-version.outputs.exists != 'true'
        env:
          LABBY_RELEASE_ASSET_DIR: ${{ github.workspace }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./packages/labby-mcp/package.json').version")"
          npm publish --access public --tag "candidate-$version" ./packages/labby-mcp
          touch /tmp/labby-npm-candidate-published
      - name: Publish qualified draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/ci/promote-release.sh
      - name: Advance npm stable pointer after release promotion
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_name="$(node -p "require('./packages/labby-mcp/package.json').name")"
          version="$(node -p "require('./packages/labby-mcp/package.json').version")"
          npm dist-tag add "$package_name@$version" latest
          [[ "$(npm view "$package_name@latest" version)" == "$version" ]]
      - name: Roll back partial publication
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ROLLBACK_STATUS_FILE: /tmp/labby-release-rollback.json
          IMAGE_ROLLBACK_STATUS_FILE: /tmp/labby-image-rollback.json
          IMAGE_PUBLICATION_STARTED: ${{ steps.publication.outputs.started }}
        run: |
          set -u
          package="${GITHUB_REPOSITORY#*/}"
          version_id=""
          if [[ -f /tmp/labby-new-version-image ]]; then
            version_id="$(gh api --paginate "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${package}/versions" --jq ".[] | select(.metadata.container.tags | index(\"$RELEASE_TAG\")) | .id" | head -1 || true)"
          fi
          previous_latest="$(cat /tmp/labby-previous-latest-digest 2>/dev/null || printf none)"
          previous_release="$(cat /tmp/labby-previous-release-digest 2>/dev/null || printf none)"
          image_rc=0
          export ROLLBACK_STATUS_FILE="$IMAGE_ROLLBACK_STATUS_FILE"
          if [[ "$IMAGE_PUBLICATION_STARTED" == true ]]; then
            scripts/ci/release-image-rollback.sh \
              --image "ghcr.io/${GITHUB_REPOSITORY}" \
              --tag "$RELEASE_TAG" \
              --previous-latest "$previous_latest" \
              --previous-release "$previous_release" \
              --delete-version-id "$version_id" || image_rc=$?
          else
            printf '%s\n' '{"status":"ok","steps":{"image_publication":"not_started"}}' \
              >"$IMAGE_ROLLBACK_STATUS_FILE"
          fi
          pointer_rc=0
          if [[ -f /tmp/labby-incus-pointer-receipt/state ]]; then
            INCUS_POINTER_RECEIPT=/tmp/labby-incus-pointer-receipt \
              scripts/ci/promote-incus-pointer.sh rollback || pointer_rc=$?
          fi
          github_rc=0
          # Promotion may have succeeded remotely even when its visibility
          # verification timed out. Restore and verify the safe draft state.
          if ! gh release edit "$RELEASE_TAG" --draft=true ||
             ! gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft | grep -Fx true; then
            github_rc=1
          fi
          python3 scripts/ci/compound-release-rollback.py \
            --image-record "$IMAGE_ROLLBACK_STATUS_FILE" \
            --image-rc "$image_rc" --pointer-rc "$pointer_rc" --github-rc "$github_rc" \
            --npm-candidate-published "$([[ -f /tmp/labby-npm-candidate-published ]] && printf true || printf false)" \
            --mcp-version-published true \
            --output "$ROLLBACK_STATUS_FILE"
      - name: Persist compound rollback status
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-rollback-status
          path: /tmp/labby-release-rollback.json
          if-no-files-found: warn
          retention-days: 30
