[advisories]
unmaintained = "all"
yanked = "deny"
ignore = [
    # owner: jmagar (explicitly approved 2026-10-02)
    # path: optional microsandbox 0.7.3 -> microsandbox-filesystem 0.7.3 -> bincode 2.0.1
    # reason: upstream SDK requires this snapshot serializer; latest 0.7.6 still uses it.
    #         This advisory is maintenance status, not a reported vulnerability.
    # re-review: 2026-11-02; remove when upstream replaces bincode or the SDK is removed.
    { id = "RUSTSEC-2025-0141", reason = "Approved optional Microsandbox filesystem snapshot dependency on bincode 2.0.1; upstream 0.7.6 retains it; re-review 2026-11-02 and remove with upstream migration or SDK removal" },
    # owner: jmagar
    # reason: RSA remains transitively required to verify Google OIDC RS256 ID tokens. Lab's own
    #         access-token signing uses Ed25519 and performs no production RSA private-key operation;
    #         the affected RSA decryption/signing path is therefore not reachable in production.
    # re-review: 2026-09 — drop once rsa upstream ships a fix or the dep is removed
    { id = "RUSTSEC-2023-0071", reason = "RSA is verification-only for Google OIDC; Lab access tokens use Ed25519 and no production private-key RSA operation" },
]

[licenses]
allow = [
  "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    # MIT No Attribution (OSI-approved, MIT-equivalent). Pulled in transitively by
    # borrow-or-share v0.2.4 via fluent-uri -> referencing -> jsonschema -> rmcp-openapi
    # (the OpenAPI spec parser for the Code Mode `openapi` provider).
    "MIT-0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[[bans.deny]]
name = "unsafe-libyaml"
reason = "Untrusted YAML must be parsed by the workspace pure-Rust parser."

# Convention enforcement — codifies rules from /CLAUDE.md and
# crates/labby-apis/CLAUDE.md that clippy can't enforce on its own.
# `wrappers` whitelists *direct* dep-graph parents allowed to pull the
# banned crate in. Any other crate in the workspace doing so fails.
#
# Note: `async-trait` is *not* banned here because `rmcp` pulls it in
# transitively. Writing `#[async_trait]` in our own code is forbidden
# via `clippy::disallowed_macros` instead — see clippy.toml at the
# workspace root.

[[bans.deny]]
name = "clap"
wrappers = ["labby", "clap_complete"]
reason = "Binary-only: labby-apis must stay pure. CLI parsing lives in `labby`."

[[bans.deny]]
name = "rmcp"
wrappers = ["labby", "labby-auth", "labby-gateway"]
reason = "Binary-only: labby-apis must stay pure. MCP server lives in `labby`."

[[bans.deny]]
name = "anyhow"
wrappers = [
    "labby",
    "labby-auth",
    "labby-codemode",
    "labby-gateway",
    "javy",
]
reason = "labby-apis uses `thiserror`. anyhow is for the binary only."

[[bans.deny]]
name = "tabled"
reason = "Binary-only: table formatting happens in `crates/labby/src/output/`, not labby-apis."

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Temporary, exact-source exception for the pinned rmcp decoder fix. The
# dependency itself is rev-pinned in Cargo.toml/Cargo.lock; remove this entry
# with the patch as soon as upstream rmcp publishes the equivalent fix.
allow-git = ["https://github.com/dinglebear-ai/rust-sdk"]
