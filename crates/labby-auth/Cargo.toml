[package]
name = "labby-auth"
description = "Parameterizable OAuth 2.0 + JWT auth crate (axum) for lab and other consumers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["oauth", "auth", "axum", "jwt", "mcp"]
categories = ["authentication", "web-programming::http-server"]
publish = false

[features]
# Explicit empty default to keep Cargo feature unification a no-op for downstream consumers.
default = []
# Outbound upstream OAuth runtime (client cache, manager, refresh, store, runtime).
# Gated because it pulls in the rmcp client/auth transport stack and oauth2, which
# pure-auth consumers (browser/API OAuth) do not need.
upstream-oauth-rmcp = ["dep:rmcp-client", "dep:oauth2", "dep:anyhow", "dep:labby-runtime"]
# Axum HTTP middleware and OAuth route handlers. Runtime crates that only need
# auth storage or outbound upstream OAuth should leave this off.
http-axum = ["dep:axum", "dep:tower"]

[dependencies]
axum = { workspace = true, optional = true }
base64.workspace = true
dashmap = "6"
getrandom = "0.4"
# Use aws-lc-rs for EdDSA signing and Google RS256 verification without
# pulling RustCrypto RSA's timing-side-channel advisory into consumers.
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
labby-runtime = { path = "../labby-runtime", optional = true }
labby-primitives = { path = "../labby-primitives" }
reqwest.workspace = true
rustix = { version = "1", features = ["fs"] }
rustls.workspace = true
ed25519-dalek.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
chacha20poly1305 = "0.10"
sha2.workspace = true
subtle = "2"
thiserror.workspace = true
tokio.workspace = true
tower = { workspace = true, optional = true }
tracing.workspace = true
url.workspace = true
anyhow = { workspace = true, optional = true }
oauth2 = { version = "5.0", default-features = false, optional = true }

[dependencies.rmcp-client]
package = "rmcp"
git = "https://github.com/dinglebear-ai/rust-sdk.git"
rev = "0665dcac527abd6828a6bdc805821e820841e491"
default-features = false
features = ["client", "auth", "transport-streamable-http-client-reqwest"]
optional = true

[dev-dependencies]
tempfile = "3.27"
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
wiremock.workspace = true
rsa.workspace = true
rand.workspace = true

[lints]
workspace = true
