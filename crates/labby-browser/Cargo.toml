[package]
name = "labby-browser"
description = "Rust runtime for Labby's browser-native WebMCP bridge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["browser", "mcp", "webmcp", "gateway"]
categories = ["development-tools"]
publish = false

[dependencies]
labby-auth = { path = "../labby-auth", default-features = false }
base64.workspace = true
ed25519-dalek.workspace = true
jiff.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
labby-winjob = { path = "../labby-winjob" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
