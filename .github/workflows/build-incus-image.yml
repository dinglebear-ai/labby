name: Build Incus image

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    outputs:
      asset_sha256:
        value: ${{ jobs.publish-image.outputs.asset_sha256 }}

concurrency:
  group: incus-image-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-image:
    name: Build and smoke hosted x86_64 image
    uses: dinglebear-ai/workflows/.github/workflows/hosted-incus-image.yml@b2813662ca27ca8868752fb353d9dd568f2f97f9
    with:
      checkout-ref: ${{ inputs.release_tag }}
      artifact-name: labby-incus-image
      artifact-directory: dist
      enable-kache: true
      kache-manifest-key: labby-incus-release
      timeout-minutes: 120
      setup-command: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y debootstrap gpg incus rsync shellcheck squashfs-tools uidmap
        rustup toolchain install 1.97.1 --profile minimal --target x86_64-unknown-linux-gnu
        rustup default 1.97.1
        corepack enable
        corepack prepare pnpm@9.15.9 --activate
        distrobuilder_version=3.3.1
        distrobuilder_sha256=6c411af7178bb55ef649c708f4f38fc3c30e6ecce901c08d8a389448a900a73a
        distrobuilder_dir="$(mktemp -d)"
        archive="$distrobuilder_dir/distrobuilder.tar.gz"
        curl --fail --show-error --location --proto '=https' --tlsv1.2 \
          --connect-timeout 10 --max-time 300 \
          --retry 5 --retry-all-errors --retry-delay 2 \
          --output "$archive" \
          "https://github.com/lxc/distrobuilder/releases/download/v${distrobuilder_version}/distrobuilder-${distrobuilder_version}.tar.gz"
        printf '%s  %s\n' "$distrobuilder_sha256" "$archive" |
          sha256sum --check --strict
        tar -xzf "$archive" -C "$distrobuilder_dir"
        (
          cd "$distrobuilder_dir/distrobuilder-${distrobuilder_version}"
          go build -mod=vendor -trimpath \
            -tags=containers_image_storage_stub,containers_image_docker_daemon_stub,containers_image_openpgp \
            -o "$RUNNER_TEMP/distrobuilder" ./distrobuilder
        )
        chmod 0755 "$RUNNER_TEMP/distrobuilder"
        echo "DISTROBUILDER_BIN=$RUNNER_TEMP/distrobuilder" >> "$GITHUB_ENV"
      validate-command: |
        set -euo pipefail
        sh -n scripts/incus-bootstrap.sh
        bash -n scripts/ci/build-incus-image.sh scripts/ci/smoke-incus-image.sh
        shellcheck scripts/incus-bootstrap.sh scripts/ci/build-incus-image.sh scripts/ci/smoke-incus-image.sh
        sudo "$DISTROBUILDER_BIN" validate config/incus/labby-image.yaml -o image.serial=ci
      build-command: |
        set -euo pipefail
        (
          cd apps/gateway-admin
          pnpm install --frozen-lockfile
          pnpm run test:install-script
          pnpm run test:unit
          pnpm exec tsc --noEmit
          pnpm build
        )
        git diff --exit-code -- apps/gateway-admin/public/install.sh
        cargo build --workspace --all-features --locked --release \
          --target x86_64-unknown-linux-gnu
        mkdir -p target/incus-image-input
        cp target/x86_64-unknown-linux-gnu/release/labby \
          target/incus-image-input/labby
        tar -C target/incus-image-input -czf \
          target/incus-image-input/lab-x86_64-unknown-linux-gnu.tar.gz labby
        image_serial="${GITHUB_REF_NAME}-${GITHUB_SHA::12}"
        image_serial="${image_serial//[^A-Za-z0-9_.-]/-}"
        scripts/ci/build-incus-image.sh \
          "$image_serial" \
          target/incus-image-input/lab-x86_64-unknown-linux-gnu.tar.gz \
          dist
      smoke-command: |
        EXPORT_DIR="$GITHUB_WORKSPACE/dist" \
        IMAGE_ALIAS="labby-incus-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
        SMOKE_CONTAINER_NAME="labby-incus-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
        SMOKE_PROFILE_NAME="labby-gateway-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
        SMOKE_EXPECT_ANDROID_SDK=0 \
          scripts/ci/smoke-incus-image.sh
    secrets:
      KACHE_S3_ACCESS_KEY: ""
      KACHE_S3_SECRET_KEY: ""

  publish-image:
    name: Publish immutable candidate assets
    needs: [build-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      asset_sha256: ${{ steps.publish.outputs.asset_sha256 }}
    steps:
      # MUST come before download-artifact: actions/checkout cleans the
      # workspace by default and would delete dist/ if it ran after.
      #
      # This job has no source dependency, but it still needs a git repo for
      # two reasons. The tag-advance commands at the end of the publish step
      # obviously do. Less obviously, so does every `gh release`
      # call: gh resolves the target repository from git remotes, and
      # without a checkout it fails with "failed to run git: fatal: not a
      # git repository" before uploading anything. That is exactly how the
      # incus image asset silently stopped publishing after v1.8.5 — the
      # build succeeded, the artifact verified, and then the very first
      # upload aborted, so every tag from v1.8.6 onward shipped without
      # labby-incus-x86_64-unknown-linux-gnu.tar.xz. See lab-26zqj.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: labby-incus-image
          path: dist

      - name: Publish exact release assets
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          # Belt-and-braces alongside the checkout above: pinning the repo
          # explicitly keeps every `gh` call correct even if this job's
          # checkout is ever removed or reconfigured again.
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check --strict SHA256SUMS)
          asset_sha256=$(awk '$2 == "labby-incus-x86_64-unknown-linux-gnu.tar.xz" { print $1 }' dist/SHA256SUMS)
          [[ "$asset_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "asset_sha256=$asset_sha256" >> "$GITHUB_OUTPUT"
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0)
          scripts/ci/upload-immutable-release-assets.sh -- "${assets[@]}"

          verify_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --dir "$verify_dir"
          (cd "$verify_dir" && sha256sum --check --strict SHA256SUMS)
