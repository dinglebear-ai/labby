[package]
name = "labby-openapi"
description = "OpenAPI-spec-to-Code-Mode-tool derivation. Extracts allowlisted operations and executes outbound HTTP via its own hardened reqwest client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
publish = false

[features]
standalone-mcp = ["dep:clap", "dep:rmcp", "tokio/macros"]

[[bin]]
name = "labby-openapi-mcp"
path = "src/bin/labby-openapi-mcp.rs"
required-features = ["standalone-mcp"]

[dependencies]
clap = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
labby-runtime = { path = "../labby-runtime" }
labby-primitives = { path = "../labby-primitives" }
tokio = { workspace = true, features = ["sync", "time", "rt", "net", "fs", "io-util"] }
reqwest = { workspace = true }
rustls.workspace = true
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
