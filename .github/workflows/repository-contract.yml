name: Repository contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: repository-contract-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  contract:
    name: contract / contract
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out caller
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          # The pinned checker excludes manifests under target/ and vendor/.
          path: caller
          persist-credentials: false
      - name: Check out immutable contract implementation
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: dinglebear-ai/workflows
          ref: b2813662ca27ca8868752fb353d9dd568f2f97f9
          path: workflow-library
          persist-credentials: false
      - name: Validate repository contract
        run: >-
          python3 workflow-library/scripts/fleet_contract.py check
          --repo caller --profile rust --allow-arm64

  repository-contract:
    name: Repository Contract
    if: always()
    needs: [contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require repository contract
        env:
          RESULT: ${{ needs.contract.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "repository contract concluded $RESULT" >&2
            exit 1
          fi
