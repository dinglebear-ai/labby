name: Incus image

on:
  # The image build and smoke takes about 45 minutes, so it runs nightly rather
  # than on every pull request and push. Pull requests that touch the image keep
  # the cheap `incus-contract` lint in CI.
  schedule:
    - cron: '11 7 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Image channel; stable requires an explicit selection'
        type: choice
        default: dev
        options: [dev, stable]

concurrency:
  group: incus-image-${{ github.ref }}
  # Main publication must complete or roll back.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  published:
    name: Skip a commit whose dev image is published
    # A quiet night leaves main unchanged. Publishing the same immutable
    # incus-dev-<sha> again would fail its draft check, and that failure path
    # re-drafts the published release, so the nightly run skips it instead.
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: incus-dev-${{ github.sha }}
        # Fail closed: only a confirmed 404 means "not published". Any other
        # lookup error fails this job, which blocks the build below. The tags
        # endpoint returns published releases only, never drafts.
        run: |
          set -euo pipefail
          errors="$(mktemp)"
          if draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .draft 2>"$errors")"; then
            if [[ "$draft" == false ]]; then exists=true; else exists=false; fi
          elif grep -Fq '(HTTP 404)' "$errors"; then
            exists=false
          else
            cat "$errors" >&2
            echo "::error::could not determine whether $RELEASE_TAG is published"
            exit 1
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

  image:
    name: Build and smoke Incus substrate
    needs: published
    if: ${{ !cancelled() && needs.published.result != 'failure' && needs.published.outputs.exists != 'true' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-incus-image.yml
    with:
      source_ref: ${{ github.sha }}
      release_tag: ${{ inputs.channel == 'stable' && format('incus-{0}', github.sha) || format('incus-dev-{0}', github.sha) }}
      channel: ${{ inputs.channel || 'dev' }}
      publish: ${{ github.ref == 'refs/heads/main' }}
