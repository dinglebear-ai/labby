<script>(()=>{"use strict";const host=window.LabbyAppHost||{callAction:async()=>{throw new Error("Open this form from an MCP Apps-capable Labby host.")},requestResize:()=>{},requestTeardown:()=>{if(history.length>1)history.back()}};const dialog=document.getElementById("dialog"),form=document.getElementById("form"),nameInput=document.getElementById("name"),targetInput=document.getElementById("target"),resources=document.getElementById("resources"),prompts=document.getElementById("prompts"),status=document.getElementById("status"),testButton=document.getElementById("test"),createButton=document.getElementById("create"),cancelButton=document.getElementById("cancel"),closeButton=document.getElementById("close");const original=new Map([[testButton,testButton.innerHTML],[createButton,createButton.innerHTML]]);let lifecycle="idle",disposed=false,closeTimer=null,resizeFrame=null;function toggle(button){button.setAttribute("aria-checked",button.getAttribute("aria-checked")!=="true"?"true":"false")}function words(value){const out=[];let token="",quote=null,started=false;const slash=String.fromCharCode(92);for(let i=0;i<value.length;i++){const c=value[i];if(c===slash&&quote!=="'"){const n=value[i+1];if(n!==undefined&&(n===slash||n.trim()===""||(quote!==null&&n===quote))){token+=n;started=true;i++;continue}token+=slash;started=true;continue}if(quote){if(c===quote)quote=null;else token+=c;continue}if(c==='"'||c==="'"){quote=c;started=true;continue}if(c.trim()===""){if(started){out.push(token);token="";started=false}continue}token+=c;started=true}if(quote)throw new Error("Close the quoted command argument.");if(started)out.push(token);return out}function isHttpTarget(target){return target.startsWith("http://")||target.startsWith("https://")}function suggestName(){if(nameInput.value.trim())return;const target=targetInput.value.trim();if(!target)return;let candidate="";try{if(isHttpTarget(target)){candidate=new URL(target).hostname.split(".")[0]||""}else{const parts=words(target);c
