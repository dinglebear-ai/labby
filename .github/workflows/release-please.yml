name: release-please

# Drives versioning + changelog from Conventional Commits.
#
# On every green CI run on main, release-please maintains a "release PR" that
# bumps `.release-please-manifest.json` and updates CHANGELOG.md. Merging that
# PR creates the git tag (vX.Y.Z) and a draft GitHub Release. Pushing that tag
# triggers the GitHub-hosted candidate qualification for Linux/macOS/Windows
# archives and the Incus artifact before release promotion.
#
# release-type is "simple", NOT "rust". release-please's rust/cargo-workspace
# support cannot handle this workspace's structure: the root Cargo.toml is a
# pure virtual workspace manifest (no [package] table) and every member crate
# uses `version.workspace = true` (inherited version, no literal version
# string). release-please's CargoToml updater unconditionally tries to write
# a resolved version into `[package].version` for any file literally named
# Cargo.toml, which throws ("is not a package manifest" for the virtual root,
# "value at path package.version is not tagged" for inherited-version member
# crates) regardless of release-type/extra-files config — verified directly
# against the release-please library source, not a hypothesis. See
# docs/sessions for the investigation if this needs revisiting upstream.
#
# So release-please here only manages CHANGELOG.md + the manifest + the git
# tag/draft GitHub Release. The stable tag triggers candidate qualification;
# only the final qualified release job promotes the draft. The
# `sync-release-version` job below runs after it opens
# or updates a release PR and separately patches [workspace.package].version,
# the npm launcher package version, and MCP registry metadata before
# regenerating Cargo.lock and pushing an extra commit onto that same PR branch.
# By the time the PR is merged, Cargo.toml, Cargo.lock, package.json,
# server.json, the manifest, and CHANGELOG.md are all in sync.
#
# IMPORTANT: `token` must be a PAT or GitHub App token with `contents: write`
# and `pull-requests: write`. The default GITHUB_TOKEN deliberately does NOT
# trigger downstream workflows, so a tag it creates would never reach
# release.yml. Store the token as the RELEASE_PLEASE_TOKEN secret.
#
# WARNING — silent failure mode: a classic PAT EXPIRES SILENTLY. When it
# lapses, this job simply stops opening/updating release PRs — no error, no
# alert — and releases quietly halt until someone notices. Prefer a GitHub
# App installation token (no expiry, scoped to exactly these permissions,
# and auditable per install) over a classic PAT. If you must use a PAT, set a
# calendar reminder tied to its expiry date so it gets rotated before it
# lapses.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  KACHE_S3_ACCESS_KEY: ""
  KACHE_S3_SECRET_KEY: ""
  KACHE_S3_ENDPOINT: ${{ vars.KACHE_S3_ENDPOINT }}
  KACHE_S3_BUCKET: ${{ vars.KACHE_S3_BUCKET }}
  KACHE_S3_PREFIX: ${{ vars.KACHE_S3_PREFIX }}

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  stabilize-release-pr:
    name: Pause an existing release PR while it is refreshed
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    outputs:
      auto_merge_pr: ${{ steps.pr.outputs.auto_merge_pr }}
    steps:
      - name: Disable auto-merge during release branch refresh
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_PR_BRANCH: release-please--branches--main--components--labby
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main \
            --head "$RELEASE_PR_BRANCH" --json number,autoMergeRequest \
            --jq '.[0] // empty')"
          if [[ -z "$pr" ]]; then
            echo 'auto_merge_pr=' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          number="$(jq -r '.number' <<<"$pr")"
          if [[ "$(jq -r '.autoMergeRequest != null' <<<"$pr")" == true ]]; then
            gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --disable-auto
            echo "auto_merge_pr=$number" >>"$GITHUB_OUTPUT"
          else
            echo 'auto_merge_pr=' >>"$GITHUB_OUTPUT"
          fi

  release-please:
    needs: stabilize-release-pr
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write       # required to create release commits and tags
      pull-requests: write  # required to create and update release PRs
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      - name: Require release-please token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: test -n "$RELEASE_PLEASE_TOKEN"
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-release-version:
    name: Sync release metadata to release PR version
    needs: [stabilize-release-pr, release-please]
    # release-please can update the branch and then fail before emitting its
    # outputs. Always inspect the canonical open release PR so that a partial
    # action failure cannot leave its generated commit without metadata.
    if: ${{ always() && !cancelled() && needs.stabilize-release-pr.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve the open release PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_PR_BRANCH: release-please--branches--main--components--labby
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main \
            --head "$RELEASE_PR_BRANCH" --json number,headRefName \
            --jq '.[0] // empty')"
          if [[ -z "$pr" ]]; then
            echo 'found=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'found=true'
            echo "number=$(jq -r '.number' <<<"$pr")"
            echo "branch=$(jq -r '.headRefName' <<<"$pr")"
          } >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        if: ${{ steps.pr.outputs.found == 'true' }}
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          ref: ${{ steps.pr.outputs.branch }}
          persist-credentials: true

      - name: Install Rust and kache
        if: ${{ steps.pr.outputs.found == 'true' }}
        uses: ./.github/actions/setup-rust-kache

      - name: Patch release metadata and regenerate Cargo.lock
        if: ${{ steps.pr.outputs.found == 'true' }}
        run: |
          set -euo pipefail
          new_version="$(python3 -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")"
          echo "Syncing release metadata to $new_version"
          python3 - "$new_version" << 'PY'
          import json
          import re
          import sys
          new_version = sys.argv[1]
          path = "Cargo.toml"
          text = open(path).read()
          patched, count = re.subn(
              r'(\[workspace\.package\][^\[]*?\nversion = ")[^"]+(")',
              lambda m: m.group(1) + new_version + m.group(2),
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f"expected exactly 1 substitution in {path}, got {count}")
          open(path, "w").write(patched)

          # The separate verification workspace pins the product's
          # labby-model at the exact release version.
          verify_host_path = "verification/hosts/labby/Cargo.toml"
          text = open(verify_host_path).read()
          patched, count = re.subn(
              r'(\nlabby-model = \{ version = "=)[^"]+(")',
              lambda m: m.group(1) + new_version + m.group(2),
              text,
          )
          if count != 1:
              raise SystemExit(f"expected exactly 1 substitution in {verify_host_path}, got {count}")
          open(verify_host_path, "w").write(patched)

          package_path = "packages/labby-mcp/package.json"
          with open(package_path) as fh:
              npm_manifest = json.load(fh)
          npm_manifest["version"] = new_version
          with open(package_path, "w") as fh:
              json.dump(npm_manifest, fh, indent=2)
              fh.write("\n")

          server_path = "server.json"
          with open(server_path) as fh:
              server = json.load(fh)
          server["version"] = new_version
          for server_package in server.get("packages", []):
              server_package["version"] = new_version
          publisher = server.get("_meta", {}).get("io.modelcontextprotocol.registry/publisher-provided", {})
          distribution = publisher.get("distribution")
          if isinstance(distribution, dict):
              distribution["npm"] = f"{npm_manifest['name']}@{new_version}"
          build_info = publisher.get("buildInfo")
          if isinstance(build_info, dict):
              build_info["version"] = new_version
          with open(server_path, "w") as fh:
              json.dump(server, fh, indent=2)
              fh.write("\n")
          PY
          # Only Cargo.lock's workspace-member version entries need refreshing
          # after the version bump — no compilation required. Offline first;
          # fall back to a networked update if the lockfile needs anything new.
          cargo update --workspace --offline || cargo update --workspace
          cargo update --manifest-path verification/Cargo.toml -p labby-model --offline \
            || cargo update --manifest-path verification/Cargo.toml -p labby-model
          git diff --stat -- Cargo.toml Cargo.lock packages/labby-mcp/package.json server.json \
            verification/hosts/labby/Cargo.toml verification/Cargo.lock

      - name: Commit and push if changed
        if: ${{ steps.pr.outputs.found == 'true' }}
        run: |
          set -euo pipefail
          paths=(Cargo.toml Cargo.lock packages/labby-mcp/package.json server.json
            verification/hosts/labby/Cargo.toml verification/Cargo.lock)
          if git diff --quiet -- "${paths[@]}"; then
            echo "Release metadata already in sync, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "chore: sync release metadata to release version"
          git push origin HEAD:"${{ steps.pr.outputs.branch }}"

      - name: Verify the remote release head and restore auto-merge
        if: ${{ steps.pr.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          AUTO_MERGE_PR: ${{ needs.stabilize-release-pr.outputs.auto_merge_pr }}
          RELEASE_PLEASE_RESULT: ${{ needs.release-please.result }}
        run: |
          set -euo pipefail
          expected="$(git rev-parse HEAD)"
          observed=""
          for attempt in {1..12}; do
            observed="$(gh pr view "${{ steps.pr.outputs.number }}" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
            if [[ "$observed" == "$expected" ]]; then
              break
            fi
            echo "release PR head verification $attempt/12: expected $expected, observed $observed"
            if [[ "$attempt" != 12 ]]; then
              sleep 5
            fi
          done
          if [[ "$observed" != "$expected" ]]; then
            echo "release PR head did not converge after metadata sync: expected $expected, observed $observed" >&2
            exit 1
          fi
          # A failed generator may have mutated the branch only partially. The
          # metadata repair is still mandatory, but keep auto-merge paused so a
          # subsequent successful refresh or a maintainer reviews the result.
          if [[ -n "$AUTO_MERGE_PR" && "$RELEASE_PLEASE_RESULT" == success ]]; then
            gh pr merge "$AUTO_MERGE_PR" --repo "$GITHUB_REPOSITORY" --squash --auto --match-head-commit "$observed"
          fi
