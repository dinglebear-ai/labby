name: Pull request labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    uses: dinglebear-ai/workflows/.github/workflows/repository-labeler.yml@d1a41a7af9c41189e0f1062234364f5814bda99d
    with:
      configuration-path: .github/labeler.yml
      sync-labels: true
