name: Release publish reminder

# Release Please deliberately creates GitHub releases as drafts
# (`release-please-config.json` sets `"draft": true`). The immutable tag starts
# candidate qualification, and only release.yml promotes a fully qualified
# draft. npm and the MCP Registry cannot delete a published version, so manual
# draft publication is forbidden.
#
# The failure mode is silence: v1.5.0 through v1.8.2 sat as unpublished drafts
# and never produced a single artifact, because nothing surfaced that a release
# was waiting. This workflow keeps exactly one open issue describing every
# pending draft release, and closes it once none remain. It never publishes a
# release itself; promotion belongs exclusively to the qualification workflow.
#
# `contents: write` is REQUIRED and must not be tightened to `read`. GitHub's
# REST API returns draft releases only to callers with push access, so a
# read-only token lists zero drafts and this workflow silently becomes a no-op
# — which is exactly how it shipped in #350 and did nothing. The write scope is
# for *visibility*, never for publishing: nothing here mutates a release, and
# `draft_releases_are_surfaced_without_being_auto_published` enforces that.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_run:
    workflows: ["Release", "release-please"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release-publish-reminder
  cancel-in-progress: false

permissions:
  # contents: write is required to *see* drafts, not to change them. See above.
  contents: write
  issues: write

jobs:
  remind:
    name: Surface unpublished draft releases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const TITLE = 'Draft release is waiting to be published';

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 },
            );
            const drafts = releases
              .filter((release) => release.draft)
              .sort((a, b) => a.created_at.localeCompare(b.created_at));

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.find(
              (issue) => !issue.pull_request && issue.title === TITLE,
            );

            if (drafts.length === 0) {
              core.info('No draft releases pending.');
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: 'All draft releases have been published. Closing.',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
                core.info(`Closed issue #${existing.number}.`);
              }
              return;
            }

            const now = Date.now();
            const rows = drafts.map((release) => {
              const ageHours = Math.floor((now - Date.parse(release.created_at)) / 3600000);
              const age = ageHours < 24
                ? `${ageHours}h`
                : `${Math.floor(ageHours / 24)}d`;
              // A draft's `html_url` is a `/releases/tag/untagged-<hash>`
              // placeholder that 404s — the draft has no public tag page yet.
              // `/releases/edit/<id>` is the page where a draft is reviewed and
              // published, so link that instead.
              const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/releases/edit/${release.id}`;
              return `| [\`${release.tag_name}\`](${url}) | ${age} | ${release.assets.length} |`;
            });

            const body = [
              `${drafts.length} release${drafts.length === 1 ? ' is' : 's are'} sitting unpublished.`,
              '',
              '`release.yml` must complete every candidate publisher and',
              'qualification gate before it promotes this draft.',
              '',
              '| Tag | Waiting | Assets |',
              '| --- | --- | --- |',
              ...rows,
              '',
              'Do not publish manually. Inspect the tag-triggered release workflow.',
              '',
              'npm and the MCP Registry cannot un-publish a version. Delete any',
              'draft that should never ship, or repair the failed qualification.',
              '',
              `<sub>Updated by ${context.workflow} · run ${context.runId}</sub>`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.notice(`Updated issue #${existing.number}: ${drafts.length} draft release(s) pending.`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TITLE,
                body,
              });
              core.notice(`Opened issue #${created.data.number}: ${drafts.length} draft release(s) pending.`);
            }

  reconcile:
    name: Reconcile complete release publication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Observe every manifest-bearing published release
        id: observe
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-observations
          observed_count=0
          while IFS=$'\t' read -r tag is_draft; do
            directory="release-observations/$tag"
            mkdir -p "$directory/assets"
            # Published releases predating the versioned manifest contract are
            # outside this reconciler. Draft/redrafted versions are retained
            # even before their manifest upload so irreversible npm/MCP
            # publication can never disappear from incident visibility.
            if ! gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq release-manifest.json; then
              if [[ "$is_draft" == true ]]; then
                printf '{"tag":"%s","complete":false,"error":"draft release is missing release-manifest.json"}\n' "$tag" \
                  >"$directory/reconciliation.json"
                observed_count=$((observed_count + 1))
              else
                rmdir "$directory/assets" "$directory"
              fi
              continue
            fi
            gh release download "$tag" --dir "$directory/assets"
            python3 scripts/ci/observe-release.py \
              --manifest "$directory/assets/release-manifest.json" \
              --assets "$directory/assets" --output "$directory/observed.json"
            if ! scripts/ci/reconcile-release.py \
              --manifest "$directory/assets/release-manifest.json" \
              --observed "$directory/observed.json" >"$directory/reconciliation.json"; then
              : # Preserve the per-version failure for aggregate incident management.
            fi
            observed_count=$((observed_count + 1))
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | [.tag_name, .draft] | @tsv')
          ((observed_count > 0))
      - name: Reconcile machine-readable release manifest
        id: reconcile
        if: steps.observe.outcome == 'success'
        continue-on-error: true
        run: scripts/ci/reconcile-release-set.py --reports release-observations --output reconciliation.json
      - name: Record observation failure
        if: steps.observe.outcome != 'success'
        run: |
          printf '%s\n' '{"complete":false,"error":"observation failed before reconciliation"}' > reconciliation.json
      - name: Idempotently open, update, or close the release incident
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci/manage-release-incident.sh "${{ steps.observe.outcome == 'success' && steps.reconcile.outcome == 'success' }}"
          [[ "${{ steps.observe.outcome }}" == success && "${{ steps.reconcile.outcome }}" == success ]]
