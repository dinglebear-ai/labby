name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_S3_ACCESS_KEY }}
  KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_S3_SECRET_KEY }}
  KACHE_S3_ENDPOINT: ${{ vars.KACHE_S3_ENDPOINT }}
  KACHE_S3_BUCKET: ${{ vars.KACHE_S3_BUCKET }}
  KACHE_S3_PREFIX: ${{ vars.KACHE_S3_PREFIX }}
  # Release jobs must not inherit a host-level compiler wrapper. Cache-enabled
  # jobs configure kache explicitly through setup-rust-kache (mirrors ci.yml).
  RUSTC_WRAPPER: ""
  CARGO_BUILD_RUSTC_WRAPPER: ""
jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      # The validation below shells out to Node and npm for version lockstep
      # plus launcher test/check/pack smoke, so install Node explicitly on the
      # hosted release runner.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "lts/*"
      - name: Validate release tag, ancestry, and version lockstep
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release tag must be stable SemVer vMAJOR.MINOR.PATCH"
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::tag commit is not reachable from origin/main"
            exit 1
          }
          expected="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n '/^\[workspace.package\]$/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          npm_version="$(node -p "require('./packages/labby-mcp/package.json').version")"
          registry_version="$(python3 -c "import json; print(json.load(open('server.json'))['version'])")"
          manifest_version="$(python3 -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")"
          for pair in "Cargo.toml:$cargo_version" "package.json:$npm_version" "server.json:$registry_version" "release manifest:$manifest_version"; do
            [[ "${pair#*:}" == "$expected" ]] || { echo "::error::${pair%%:*} version ${pair#*:} != $expected"; exit 1; }
          done
          npm test --prefix packages/labby-mcp
          npm run check --prefix packages/labby-mcp
          npm pack --dry-run --json ./packages/labby-mcp >/dev/null

  frontend-assets:
    name: Frontend assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: preflight
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-gateway-admin
      - name: Upload gateway-admin export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 90
    needs: frontend-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: '"ubuntu-24.04"'
            binary: labby
            archive: lab-x86_64-unknown-linux-gnu.tar.gz
          - target: x86_64-pc-windows-msvc
            runner: '"windows-latest"'
            binary: labby.exe
            archive: lab-x86_64-pc-windows-msvc.zip
          - target: aarch64-apple-darwin
            runner: '"macos-15"'
            binary: labby
            archive: lab-aarch64-apple-darwin.tar.gz
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - name: Install Rust and kache
        if: runner.os != 'Windows'
        uses: ./.github/actions/setup-rust-kache
        with:
          targets: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        if: runner.os == 'Windows'
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}
      - name: Restore Windows Cargo cache
        if: runner.os == 'Windows'
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          shared-key: labby-release-windows-v1
          cache-on-failure: true

      - name: Build natively
        run: cargo build --workspace --all-features --locked --release --target ${{ matrix.target }}

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"
          tar -C dist -czf "${{ matrix.archive }}" "${{ matrix.binary }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          else
            shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          fi

      - name: Smoke packaged Code Mode runner (Unix)
        if: runner.os != 'Windows'
        env:
          # This is a one-shot CLI smoke. Do not leave a warm runner parked
          # while the workflow shell waits for the packaged process to exit.
          LABBY_CODE_MODE_POOL_SIZE: "0"
        run: |
          set -euo pipefail
          ./dist/${{ matrix.binary }} --json gateway code exec \
            --code 'async () => ({ ok: true, sum: 1 + 1 })' \
            | grep -q '"sum":2'
          ./dist/${{ matrix.binary }} skills --help \
            | grep -q 'Read Agent Skills visible to the local CLI'

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"
          Compress-Archive -Path "dist/${{ matrix.binary }}" -DestinationPath "${{ matrix.archive }}" -Force
          $hash = (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.archive }}" | Out-File -FilePath "${{ matrix.archive }}.sha256" -Encoding ascii

      - name: Smoke packaged Code Mode runner (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Hosted Windows runners track descendant processes. A pooled Code
          # Mode runner can therefore keep this one-shot smoke alive after the
          # CLI has returned its result.
          LABBY_CODE_MODE_POOL_SIZE: "0"
        run: |
          $ErrorActionPreference = "Stop"
          $output = & ".\dist\${{ matrix.binary }}" --json gateway code exec --code "async () => ({ ok: true, sum: 1 + 1 })"
          if ($LASTEXITCODE -ne 0) {
            throw "Code Mode packaged smoke failed with exit code $LASTEXITCODE"
          }
          if ($output -notmatch '"sum":2') {
            throw "Code Mode packaged smoke did not return expected result: $output"
          }
          $skillsHelp = & ".\dist\${{ matrix.binary }}" skills --help
          if ($LASTEXITCODE -ne 0 -or $skillsHelp -notmatch 'Read Agent Skills visible to the local CLI') {
            throw "Packaged binary does not expose the required Skills surface"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lab-${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error

  container:
    name: Build and smoke container image
    needs: frontend-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: gateway-admin-out
          path: apps/gateway-admin/out
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Build private container candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: config/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/lab-container-image.tar
          tags: lab:release-candidate
          cache-from: type=gha,scope=labby-release-container
          cache-to: type=gha,mode=min,scope=labby-release-container
      - name: Load private container candidate
        run: docker load --input /tmp/lab-container-image.tar
      - name: Smoke container Code Mode runner
        run: |
          set -euo pipefail
          docker run --rm lab:release-candidate --json gateway code exec \
            --code 'async () => ({ ok: true, sum: 1 + 1 })' \
            | grep -q '"sum":2'
          docker run --rm lab:release-candidate skills --help \
            | grep -q 'Read Agent Skills visible to the local CLI'
      - name: Scan tested container candidate
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8
        with:
          image-ref: lab:release-candidate
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload tested container candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lab-container-image
          path: /tmp/lab-container-image.tar
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish validated release
    needs: [build, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Validate npm publication identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami >/dev/null
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: lab-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Verify artifact checksums
        run: sha256sum --check --ignore-missing ./*.sha256
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: labby.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=(
            lab-*.tar.gz
            lab-*.tar.gz.sha256
            lab-*.zip
            lab-*.zip.sha256
            labby.spdx.json
          )
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" == "true" ]]; then
            echo "::error::heavy release work must start from release.published"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: |
            lab-*.tar.gz
            lab-*.zip
            labby.spdx.json
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
      - name: Publish exact tested image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          previous_latest="$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)"
          previous_release="$(docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)"
          printf '%s\n' "${previous_latest:-none}" > /tmp/labby-previous-latest-digest
          if [[ "$previous_release" != sha256:* ]]; then
            touch /tmp/labby-new-version-image
          fi
          touch /tmp/labby-image-publish-started
          docker load --input lab-container-image.tar
          docker tag lab:release-candidate "$IMAGE:$RELEASE_TAG"
          docker tag lab:release-candidate "$IMAGE:latest"
          docker push "$IMAGE:$RELEASE_TAG"
          docker push "$IMAGE:latest"
          digest="$(docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$digest" == sha256:* ]] || { echo "::error::could not resolve published image digest"; exit 1; }
          cosign sign --yes "$IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest container image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Check whether npm version already exists
        id: npm-version
        run: |
          package_name="$(node -p "require('./packages/labby-mcp/package.json').name")"
          version="$(node -p "require('./packages/labby-mcp/package.json').version")"
          if npm view "$package_name@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish validated npm launcher
        if: steps.npm-version.outputs.exists != 'true'
        env:
          LABBY_RELEASE_ASSET_DIR: ${{ github.workspace }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public ./packages/labby-mcp
      - name: Roll back partial publication
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ -f /tmp/labby-new-version-image ]]; then
            package="${GITHUB_REPOSITORY#*/}"
            version_id="$(gh api --paginate "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${package}/versions" \
              --jq ".[] | select(.metadata.container.tags | index(\"$RELEASE_TAG\")) | .id" | head -1)"
            if [[ -n "$version_id" ]]; then
              gh api --method DELETE "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${package}/versions/${version_id}" || true
            fi
          fi
          previous_latest="$(cat /tmp/labby-previous-latest-digest 2>/dev/null || printf none)"
          if [[ -f /tmp/labby-image-publish-started && "$previous_latest" == sha256:* ]]; then
            docker buildx imagetools create \
              --tag "ghcr.io/${GITHUB_REPOSITORY}:latest" \
              "ghcr.io/${GITHUB_REPOSITORY}@${previous_latest}" || true
          fi
