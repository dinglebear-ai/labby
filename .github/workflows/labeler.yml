name: Pull request labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    uses: dinglebear-ai/workflows/.github/workflows/repository-labeler.yml@98e40816bfab64ed9fcce82236e9ecb0c0055d7d
    with:
      configuration-path: .github/labeler.yml
      sync-labels: true
