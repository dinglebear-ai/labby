<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Labby WebMCP Qualification Fixture</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 52rem; }
      pre { background: #eef2f6; padding: 1rem; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Labby WebMCP Qualification Fixture</h1>
    <p>This page exposes two bounded WebMCP tools to the installed Labby bridge.</p>
    <pre id="state"></pre>
    <script>
      const tools = [
        {
          name: "delayed_commit",
          title: "Delayed commit",
          description: "Waits before applying one durable test effect.",
          inputSchema: {
            type: "object",
            properties: { invocation_id: { type: "string" } },
            required: ["invocation_id"],
            additionalProperties: false
          },
          annotations: { consequentialHint: true }
        },
        {
          name: "echo",
          title: "Echo",
          description: "Returns the exact qualification payload.",
          inputSchema: {
            type: "object",
            properties: {
              text: { type: "string" },
              invocation_id: { type: "string" }
            },
            required: ["text", "invocation_id"],
            additionalProperties: false
          },
          annotations: { readOnlyHint: true }
        }
      ];
      const state = window.__labbyQ4 = {
        started: [],
        aborted: [],
        durable_effects: [],
        post_abort_timer_observed: [],
        completed: []
      };
      function render() {
        document.querySelector("#state").textContent = JSON.stringify(state, null, 2);
      }
      render();
      document.modelContext = {
        async getTools() { return tools; },
        async executeTool(tool, inputJson, options = {}) {
          const input = JSON.parse(inputJson || "{}");
          state.started.push({ tool: tool.name, invocation_id: input.invocation_id });
          render();
          if (tool.name === "echo") {
            state.completed.push(input.invocation_id);
            render();
            return JSON.stringify({ echo: input.text, invocation_id: input.invocation_id });
          }
          if (tool.name !== "delayed_commit") throw new Error("tool_not_found");
          return new Promise((resolve, reject) => {
            let aborted = options.signal?.aborted === true;
            const onAbort = () => {
              aborted = true;
              state.aborted.push(input.invocation_id);
              render();
              reject(new DOMException("The operation was aborted", "AbortError"));
            };
            options.signal?.addEventListener("abort", onAbort, { once: true });
            setTimeout(() => {
              options.signal?.removeEventListener("abort", onAbort);
              if (aborted || options.signal?.aborted) {
                state.post_abort_timer_observed.push(input.invocation_id);
                render();
                return;
              }
              state.durable_effects.push(input.invocation_id);
              state.completed.push(input.invocation_id);
              render();
              resolve(JSON.stringify({ committed: true, invocation_id: input.invocation_id }));
            }, 1200);
          });
        }
      };
    </script>
  </body>
</html>
