name: probe-self-hosted
on:
  workflow_dispatch:
  push:
    branches: ['ci/probe-self-hosted']
permissions:
  contents: read
jobs:
  probe:
    name: Probe self-hosted rust pool
    runs-on: [self-hosted, ci-pool-rust]
    timeout-minutes: 10
    steps:
      - name: Report runner capability
        run: |
          echo "runner=$RUNNER_NAME os=$RUNNER_OS arch=$RUNNER_ARCH"
          nproc
          free -g || true
          df -h / | tail -1
          command -v kache && kache --version || echo "kache: absent"
          command -v cargo && cargo --version || echo "cargo: absent"
