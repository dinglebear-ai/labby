schema = 1
project = "labby"
namespace = "LABBY"

[[invariant]]
id = "LABBY-REQ-001"
title = "A browser request has at most one authoritative terminal outcome."
kind = "safety"
severity = "critical"
model = "browser_request"
owner = "browser"

[invariant.checks]
stateright = ["request_single_terminal"]
kani = ["request_single_terminal"]

[[invariant]]
id = "LABBY-REQ-002"
title = "A terminal browser request is no longer active."
kind = "safety"
severity = "critical"
model = "browser_request"
owner = "browser"

[invariant.checks]
stateright = ["request_terminal_cleanup"]

[[invariant]]
id = "LABBY-REQ-003"
title = "A late response cannot overwrite a terminal outcome."
kind = "safety"
severity = "critical"
model = "browser_request"
owner = "browser"

[invariant.checks]
stateright = ["request_terminal_immutable"]

[[invariant]]
id = "LABBY-REQ-004"
title = "Only the current owning connection generation can complete a request."
kind = "safety"
severity = "critical"
model = "browser_request"
owner = "browser"

[invariant.checks]
stateright = ["request_generation_owner"]

[[invariant]]
id = "LABBY-REQ-005"
title = "Cancellation before dispatch leaves no executable request."
kind = "safety"
severity = "high"
model = "browser_request"
owner = "browser"

[invariant.checks]
stateright = ["request_cancel_before_dispatch"]

[[invariant]]
id = "LABBY-CAP-001"
title = "Every degraded capability is visible in Doctor capability findings."
kind = "safety"
severity = "critical"
model = "capability_visibility"
owner = "runtime-health"

[invariant.checks]
stateright = ["degradation_visible_in_doctor"]

[[invariant]]
id = "LABBY-CAP-002"
title = "Every degraded capability is visible in readiness health codes."
kind = "safety"
severity = "critical"
model = "capability_visibility"
owner = "runtime-health"

[invariant.checks]
stateright = ["degradation_visible_in_readiness"]

[[invariant]]
id = "LABBY-CAP-003"
title = "Every degraded capability carries actionable operator detail."
kind = "safety"
severity = "high"
model = "capability_visibility"
owner = "runtime-health"

[invariant.checks]
stateright = ["degradation_has_operator_detail"]

[[invariant]]
id = "LABBY-CAP-004"
title = "Fatal capability guard mismatches block startup instead of running degraded."
kind = "safety"
severity = "critical"
model = "capability_visibility"
owner = "runtime-health"

[invariant.checks]
stateright = ["fatal_guard_blocks_startup"]
