# Self-hosted runner labels used by this repository.
#
# These name pools on the organization's CI Runner Farm (runner group
# "CI Runner Farm Trusted"). actionlint rejects unknown runner labels, so every
# pool a workflow may target has to be declared here.
#
# Only non-blocking, same-repository jobs may target these pools; see
# scripts/ci/test_windows_ci_policy.py for the enforced policy.
self-hosted-runner:
  labels:
    - ci-pool-rust
