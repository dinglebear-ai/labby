name: labby

services:
  labby-master:
    image: ${LABBY_IMAGE:?set LABBY_IMAGE to ghcr.io/dinglebear-ai/labby@sha256:<digest>}
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${LABBY_HOST_PORT:-8765}:8765"
    volumes:
      # Mount only immutable policy into the writable installation volume.
      # Runtime diagnostics report this exact canonical path.
      - ${LABBY_CONFIG_DIR:?set LABBY_CONFIG_DIR}/config.toml:/home/labby/.labby/config.toml:ro
      - ${LABBY_CONFIG_DIR:?set LABBY_CONFIG_DIR}/.env:/home/labby/.labby/.env:ro
      - labby-home:/home/labby/.labby
      - labby-data:/home/labby/.local
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000
    environment:
      LABBY_HOME: "/home/labby/.labby"
      LABBY_MCP_HTTP_HOST: "0.0.0.0"
      LABBY_MCP_HTTP_PORT: "8765"
      RUST_LOG: "labby=info,warn"
    healthcheck:
      test: [CMD, /usr/local/bin/labby-healthcheck]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}
    deploy:
      resources:
        limits: {memory: 2G, cpus: "2.0", pids: 512}

  integrations:
    profiles: [integrations]
    image: ${LABBY_IMAGE:?set LABBY_IMAGE to an immutable digest}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    volumes:
      - ${LABBY_INTEGRATIONS_DIR:-./config/integrations}:/integrations:ro
    entrypoint: [/bin/true]

volumes:
  labby-home: {}
  labby-data: {}
