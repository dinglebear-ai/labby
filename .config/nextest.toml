[profile.ci]
fail-fast = false

[profile.ci.junit]
path = "junit.xml"

# These cases repeatedly launch the path-classifier interpreter. On Windows,
# overlapping them with live gateway startup exhausted the readiness budget.
# Reserve this runner's test slots while each classifier case executes.
[[profile.ci.overrides]]
platform = 'cfg(windows)'
filter = 'binary(=ci_changed_paths)'
threads-required = 'num-test-threads'

# Git provider cases spawn several Git processes per test. On busy Windows
# runners, unrelated subprocess tests can exhaust the product's 10s deadline.
# Isolate their scheduling instead of changing the runtime timeout contract.
[[profile.ci.overrides]]
platform = 'cfg(windows)'
filter = 'package(labby-codemode) & test(git::provider::tests::)'
threads-required = 'num-test-threads'

# Shared lifecycle harness tests are compiled into several integration binaries.
# They launch real daemons, process groups, listeners, and cleanup guardians. Running
# copies concurrently exhausted unchanged readiness/cleanup budgets on Windows and,
# after the hosted Linux shard fan-out, produced the same cross-test interference on
# Linux/macOS. Reserve all runner test slots for these cases on every platform. Their
# own multi-process scenarios still run concurrently inside the test.
[[profile.ci.overrides]]
filter = 'package(labby) & test(live_labby::)'
threads-required = 'num-test-threads'

# Proxy qualification cases intentionally build multi-hop live Labby topologies.
# Keep each case isolated from unrelated live-daemon tests while preserving normal
# parallelism for pure integration tests in the same shard.
[[profile.ci.overrides]]
filter = 'package(labby) & binary(=proxy_qualification)'
threads-required = 'num-test-threads'

# These three process-inventory controls hit their unchanged 3s deadlines when
# embedded copies ran alongside other subprocess tests on macOS. Reserve slots
# for each exact case; default-profile overrides also apply to the CI profile.
[[profile.default.overrides]]
filter = '''package(labby) & (
    test(=live_labby::tests::helper_stderr_is_bounded_and_only_reports_safe_categories)
    | test(=live_labby::guardian::tests::guardian_publication_failure_reaps_child_before_later_mutation)
    | test(=live_labby::guardian::tests::runtime_and_browser_guardians_reap_descendants_after_leader_exit)
)'''
threads-required = 'num-test-threads'
