[workspace]
resolver = "3"
members = ["crates/verify-core", "crates/verify-scenario", "crates/verify-runner", "crates/verify-report", "crates/verify-stateright", "crates/verify-loom", "crates/verify-kani", "crates/verify-tla", "crates/verify-alloy", "hosts/labby"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/dinglebear-ai/labby"

# Exact direct pins. Unused declarations do not activate a backend or enter
# Cargo.lock. Adapters opt in individually in later milestones.
[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"
toml = { version = "=1.1.2", default-features = false, features = ["parse", "serde", "std"] }
stateright = "=0.31.0"
loom = "=0.7.2"
shuttle = "=0.9.0"
proptest = "=1.11.0"
arbitrary = { version = "=1.4.2", features = ["derive"] }
schemars = "=1.2.1"
jsonschema = { version = "=0.56.0", default-features = false }
insta = { version = "=1.48.0", features = ["json"] }
blake3 = { version = "=1.8.7", features = ["pure"] }
tempfile = "=3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
mod_module_files = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
