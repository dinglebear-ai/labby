# Known failures for optional extension scenarios in
# @modelcontextprotocol/conformance 0.2.0-alpha.10.
#
# Extensions are excluded from the 2026-07-28 dated-protocol score. CI runs
# them separately with this strict baseline:
# - an unlisted failure fails the build
# - a listed scenario that starts passing fails as a stale entry
#
# RMCP 3.1.0 passes every dated server and client scenario plus the supported
# client-credentials extensions. The entries below are optional outbound
# authorization extensions that the pinned RMCP conformance client does not
# implement. They do not describe Labby's inbound authorization server, which
# has separate product-level coverage.
server: []

client:
  - auth/enterprise-managed-authorization
  - auth/dpop
  - auth/dpop-nonce
  - auth/wif-jwt-bearer
