<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gateway Status</title>
<style>
:root{color-scheme:dark;--bg:#07131c;--panel:#13293a;--panel2:#173245;--control:#0c1a24;--border:#1d3d4e;--border2:#28556b;--text:#e6f4fb;--muted:#a7bcc9;--accent:#29b6f6;--ok:#7dd3c7;--warn:#c6a36b;--error:#c78490;font-family:Inter,Manrope,"Segoe UI",system-ui,sans-serif;color:var(--text)}
*{box-sizing:border-box}html,body{margin:0;min-width:0;background:transparent}body{padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}button{font:inherit}
.shell{width:100%;max-width:980px;margin:auto;border:1px solid color-mix(in srgb,var(--border) 60%,var(--bg));border-radius:12px;overflow:hidden;background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 12px 28px rgba(0,0,0,.2)}
header{display:flex;align-items:center;gap:9px;padding:7px 11px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 18%,transparent)}.live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px color-mix(in srgb,var(--ok) 70%,transparent)}h1{margin:0;font-size:13px}.lede{margin:0;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.refresh{margin-left:auto;width:44px;min-height:44px;border:1px solid var(--border2);border-radius:7px;background:var(--control);color:var(--accent);font-size:0;cursor:pointer}.refresh:after{content:"↻";font-size:17px}.refresh:hover{border-color:var(--accent)}.refresh:focus-visible{outline:2px solid rgba(41,182,246,.4);outline-offset:1px}.refresh:disabled{opacity:.5;cursor:wait}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:7px 9px;border-bottom:1px solid color-mix(in srgb,var(--border) 45%,transparent)}.metric{display:flex;align-items:baseline;gap:7px;padding:6px 8px;border:1px solid color-mix(in srgb,var(--border) 55%,transparent);border-radius:7px;background:var(--control)}.metric strong{font-size:15px;font-variant-numeric:tabular-nums}.metric span{color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.metric.connected strong{color:var(--ok)}.metric.attention strong{color:var(--warn)}
.toolbar{display:flex;gap:8px;padding:7px 9px 0}.filter{flex:1;min-width:0;min-height:34px;border:1px solid var(--border);border-radius:7px;background:var(--control);padding:0 10px;color:var(--text);font-size:11px}.filter:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 1px rgba(41,182,246,.22)}
.status{min-height:17px;margin:6px 10px;color:var(--muted);font-size:10.5px}.status.error{color:var(--error)}.list{display:grid;padding:0 9px 9px}.server{display:grid;grid-template-columns:minmax(140px,1.2fr) minmax(220px,.8fr) auto;gap:12px;align-items:center;padding:8px 9px;border-top:1px solid color-mix(in srgb,var(--border) 42%,transparent)}.server:first-child{border-top:0}.identity{min-width:0}.name{font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.details{display:grid;grid-template-columns:repeat(4,minmax(36px,1fr));gap:5px;color:var(--muted);font-size:9px}.cap{display:grid;gap:1px;padding:4px 5px;border:1px solid color-mix(in srgb,var(--border) 45%,transparent);border-radius:5px;background:color-mix(in srgb,var(--control) 75%,transparent)}.cap b{color:var(--text);font-size:11px;font-variant-numeric:tabular-nums}.warnings{grid-column:1/-1;display:grid;gap:3px;margin:4px 0 0;padding-left:15px;color:var(--warn);font-size:10px;line-height:1.35}.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;background:rgba(145,168,182,.12);color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.badge.connected{color:var(--ok);background:rgba(125,211,199,.1)}.badge.disconnected{color:var(--error);background:rgba(199,132,144,.1)}.empty{padding:24px;text-align:center;color:var(--muted);font-size:11px}
.badge.disabled{color:var(--muted);background:rgba(145,168,182,.12)}
@media(max-width:560px){body{padding:0}.shell{border-radius:0;border-left:0;border-right:0}.lede{display:none}.refresh{width:44px;height:44px}.summary{gap:4px}.metric{display:grid;gap:1px;padding:6px}.metric strong{font-size:14px}.metric span{font-size:8px}.filter{min-height:44px}.server{grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 3px}.details{grid-column:1/-1;grid-row:2}.warnings{grid-row:3}.badge{grid-column:2;grid-row:1}.cap{padding:5px}.status{font-size:10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<script>window.__LABBY_APP_INFO={name:"LabbyGatewayStatus",version:"0.1.0"};</script>
<script src="/apps/assets/labby-app-host.js"></script>
</head>
<body>
<main class="shell" id="shell">
  <header><span class="live"></span><h1>Gateway status</h1><p class="lede">Live upstream connections and exposed capabilities</p><button class="refresh" id="refresh" type="button" aria-label="Refresh gateway status">Refresh</button></header>
  <section class="summary" aria-label="Gateway summary">
    <div class="metric connected"><strong id="connected">—</strong><span>Connected</span></div>
    <div class="metric"><strong id="enabled">—</strong><span>Enabled</span></div>
    <div class="metric attention"><strong id="attention">—</strong><span>Attention</span></div>
  </section>
  <div class="toolbar"><input class="filter" id="filter" type="search" placeholder="Filter upstreams…" aria-label="Filter upstreams"></div>
  <p class="status" id="status" role="status" aria-live="polite">Loading gateway status…</p>
  <section class="list" id="list" aria-label="Gateway upstreams"></section>
</main>
<script>
(() => {
"use strict";
const host=window.LabbyAppHost;
const shell=document.getElementById("shell");
const list=document.getElementById("list");
const status=document.getElementById("status");
const refresh=document.getElementById("refresh");
const filter=document.getElementById("filter");
const connected=document.getElementById("connected");
const enabled=document.getElementById("enabled");
const attention=document.getElementById("attention");
let upstreams=[];
let lastUpdated=null;
let disposed=false;
let frame=null;
let initialOutputTimer=null;
let generation=0;
let acceptingInitialOutput=true;

function normalize(value){
 if(value==null||Array.isArray(value))return value;
 if(value.structuredContent!=null)return normalize(value.structuredContent);
 if(value.ok===false)throw new Error(value.error&&value.error.message||"The gateway request failed.");
 if(value.ok===true)return normalize(value.data);
 if(value.isError===true&&Array.isArray(value.content)){
  const message=value.content.map(item=>item&&item.text).filter(Boolean).join("\n");
  throw new Error(message||"The gateway request failed.");
 }
 if(value.data!=null)return normalize(value.data);
 if(Array.isArray(value.content)&&value.content[0]&&value.content[0].text){
  try{return normalize(JSON.parse(value.content[0].text))}catch(_){}
 }
 return value;
}
function text(value){return String(value==null?"":value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char])}
function plural(count,one,many=`${one}s`){return count===1?one:many}
function warningMessage(warning){return warning&&typeof warning==="object"?(warning.message||warning.code||"Unknown warning"):String(warning||"Unknown warning")}
function serverMarkup(item){
 const name=text(item.name||item.id||"Unnamed upstream");
 const isConnected=!!item.connected;
 const warnings=Array.isArray(item.warnings)?item.warnings:[];
 const tools=Number(item.exposed_tool_count??item.discovered_tool_count??0),resources=Number(item.exposed_resource_count??item.discovered_resource_count??0),prompts=Number(item.exposed_prompt_count??item.discovered_prompt_count??0),transport=item.config_summary&&item.config_summary.transport||item.source||"gateway";
 const badgeClass=isConnected?"connected":item.enabled?"disconnected":"disabled";
 const badgeLabel=isConnected?"Connected":item.enabled?"Disconnected":"Disabled";
 const warningMarkup=warnings.length?`<ul class="warnings">${warnings.map(warning=>`<li>${text(warningMessage(warning))}</li>`).join("")}</ul>`:"";
 return `<article class="server"><div class="identity"><div class="name">${name}</div>${warningMarkup}</div><div class="details"><span class="cap"><b>${tools}</b>tools</span><span class="cap"><b>${resources}</b>resources</span><span class="cap"><b>${prompts}</b>prompts</span><span class="cap"><b>—</b>${text(transport)}</span></div><span class="badge ${badgeClass}">${badgeLabel}</span></article>`;
}
function render(){
 const query=filter.value.trim().toLowerCase();
 const visible=upstreams.filter(item=>String(item.name||item.id||"").toLowerCase().includes(query));
 connected.textContent=String(upstreams.filter(item=>item.connected).length);
 enabled.textContent=String(upstreams.filter(item=>item.enabled).length);
 attention.textContent=String(upstreams.filter(item=>item.enabled&&(!item.connected||(Array.isArray(item.warnings)&&item.warnings.length>0))).length);
 list.innerHTML=visible.length?visible.map(serverMarkup).join(""):`<div class="empty">${query?"No upstreams match this filter.":"No upstreams are visible on this route."}</div>`;
 scheduleResize();
}
function applySnapshot(raw){
 const value=normalize(raw);
 if(!Array.isArray(value))throw new Error("Gateway status returned an invalid snapshot.");
 upstreams=value;
 lastUpdated=new Date();
 status.className="status";
 status.textContent=`Updated ${lastUpdated.toLocaleTimeString()} · ${upstreams.length} visible ${plural(upstreams.length,"upstream")}`;
 render();
}
function cancelInitialOutputTimer(){
 if(initialOutputTimer===null)return;
 clearTimeout(initialOutputTimer);
 initialOutputTimer=null;
}
async function load(){
 if(disposed)return;
 acceptingInitialOutput=false;
 cancelInitialOutputTimer();
 const requestGeneration=++generation;
 refresh.disabled=true;
 status.className="status";
 status.textContent="Refreshing gateway status…";
 try{
  const raw=await host.callAction("gateway_status","refresh",{});
  if(!disposed&&requestGeneration===generation)applySnapshot(raw);
 }catch(error){
  if(!disposed&&requestGeneration===generation){
   status.className="status error";
   status.textContent=lastUpdated?`Refresh failed; showing data from ${lastUpdated.toLocaleTimeString()}.`:(error&&error.message)||"Gateway status could not be loaded.";
  }
 }finally{
  if(!disposed&&requestGeneration===generation)refresh.disabled=false;
 }
}
function acceptToolOutput(raw){
 if(raw==null||disposed||!acceptingInitialOutput)return false;
 acceptingInitialOutput=false;
 cancelInitialOutputTimer();
 generation+=1;
 try{applySnapshot(raw);return true}
 catch(error){
  status.className="status error";
  status.textContent=(error&&error.message)||"Gateway status could not be loaded.";
  return false;
 }
}
function onOpenAiGlobals(event){
 const globals=event&&event.detail&&event.detail.globals;
 if(globals&&Object.prototype.hasOwnProperty.call(globals,"toolOutput"))acceptToolOutput(globals.toolOutput);
}
function onMcpMessage(event){
 const data=event&&event.data;
 if(event.source===window.parent&&data&&data.method==="ui/notifications/tool-result")acceptToolOutput(data.params);
}
function onRefresh(){void load()}
function onFilter(){render()}
function scheduleResize(){
 if(disposed||frame!==null)return;
 frame=requestAnimationFrame(()=>{
  frame=null;
  if(!disposed)host.requestResize({height:Math.ceil(document.documentElement.scrollHeight)});
 });
}
const observer=new ResizeObserver(scheduleResize);
function dispose(){
 if(disposed)return;
 disposed=true;
 observer.disconnect();
 refresh.removeEventListener("click",onRefresh);
 filter.removeEventListener("input",onFilter);
 window.removeEventListener("openai:set_globals",onOpenAiGlobals);
 window.removeEventListener("message",onMcpMessage);
 window.removeEventListener("pagehide",dispose);
 cancelInitialOutputTimer();
 if(frame!==null){cancelAnimationFrame(frame);frame=null}
}
refresh.addEventListener("click",onRefresh);
filter.addEventListener("input",onFilter);
window.addEventListener("openai:set_globals",onOpenAiGlobals);
window.addEventListener("message",onMcpMessage);
observer.observe(shell);
window.addEventListener("pagehide",dispose,{once:true});
scheduleResize();
if(!acceptToolOutput(window.openai&&window.openai.toolOutput)){
 initialOutputTimer=setTimeout(()=>{
  initialOutputTimer=null;
  if(acceptingInitialOutput)void load();
 },50);
}
})();
</script>
</body>
</html>
