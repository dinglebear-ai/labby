# =============================================================================
# .cargo/config.toml — Cargo workspace configuration for Labby
#
# Most build settings (linker, profile tuning, jobs) live in the developer's
# ~/.cargo/config.toml. This file only adds workspace-local settings that the
# global config cannot provide.
#
# See docs/TECH.md for workspace build requirements and cache guidance.
# =============================================================================

# Keep Labby cache-friendly even if a developer's global Cargo config differs.
# Compiler caching is inherited from the host Cargo config (kache on the
# managed fleet); this repo does not add another rustc wrapper layer.
[build]
incremental = false

[profile.dev]
# The all-features labby test harness is large enough that LLVM can exhaust
# memory on this host when the global Cargo config forces debug info on.
debug = 0

[profile.test]
debug = 0
